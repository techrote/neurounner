name: NCR-001E masked-2048 historical current-main source audit (NO MODEL)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ncr-001e-sprocket-masked2048-cold.yml"
      - ".github/workflows/ncr-001e-masked2048-source-integration.yml"
      - "scripts/ncr_001e_sprocket_masked_cold_2048.py"
      - "tests/test_ncr_001e_sprocket_masked_cold_2048.py"
      - "docs/NCR_001_E_SPROCKET_MASKED2048_COLD.md"
permissions:
  contents: read
concurrency:
  group: ncr001-masked2048-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-and-ancestry:
    if: github.event.pull_request.head.repo.full_name == 'techrote/neurounner'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact original source, current main and no automatic model CI
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.ref }}" = main
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor b52af229dbfd0220d8d89f0d18e58733a2c3b56b HEAD
          test "$(git hash-object experiments/ncr-001/protocol.json)" = 14ce5fbaa38f8806c8c8738f19c01b91385eebaf
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = 59fff1aed872b5563aa6898171983973e0cdb02c
          test "$(git hash-object RAG.md)" = f04668be3a19606abba0eb67a4a40c4e62c564f6
          test "$(git hash-object docs/NCR_001_E_SPROCKET_MASKED2048_COLD.md)" = e19d678ed4702167fdb3d61284ee060cdbaf6692
          test "$(git hash-object scripts/ncr_001e_sprocket_masked_cold_2048.py)" = c92a410dc6605fa1878ded44265906e0a9769d08
          test "$(git hash-object tests/test_ncr_001e_sprocket_masked_cold_2048.py)" = e125e647544c80a58da14e85d5cf391640de82f6
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('experiments/ncr-001/protocol.json').read_text())
          s=json.loads(Path('experiments/ncr-001/source-pins.json').read_text())
          assert p['train_authorized'] is False
          assert set(p['models'])==set(s['models'])=={'smollm2','sprocket_chat','sprocket_instruct','void1'}
          assert p['conformance']['full_vs_cached_prefill_atol']==p['conformance']['full_vs_cached_prefill_rtol']==0.0005
          wf=Path('.github/workflows/ncr-001e-sprocket-masked2048-cold.yml').read_text()
          triggers=wf.split('permissions:',1)[0]
          assert '\n  workflow_dispatch:' in triggers
          assert '\n  pull_request:' not in triggers and '\n  push:' not in triggers
          assert 'explicit_manual_model_authorization' in wf
          assert 'if: inputs.explicit_manual_model_authorization == true' in wf
          assert 'NCR_EXPECTED_HEAD: '+chr(36)+'{{ github.sha }}' in wf
          print('PASS_ORIGINAL_BLOBS_AND_NO_AUTO_PHYSICAL_SOURCE_PINNED')
          PY
      - name: Install original CPU-only test packages (no checkpoint downloads)
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
          python3 -m pip install --disable-pip-version-check "transformers==4.57.6" "huggingface_hub==0.36.2" "safetensors==0.8.0" "sentencepiece>=0.2,<1"
      - name: Offline adversarial masking and source-only regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ncr_001e_sprocket_masked_cold_2048.py tests/test_ncr_001e_sprocket_masked_cold_2048.py
          python3 -m unittest discover -s tests -p 'test_ncr_001e_sprocket_masked_cold_2048.py' -v
