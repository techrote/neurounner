name: NCR-001E original PR205 all-2048 position physical ZIP/log custody BOOTSTRAP ONE SHOT
on:
  push:
    branches: [review/ncr001e-alltoken2048-original-custody-20261030]
permissions:
  actions: read
  contents: write
jobs:
  original-evidence-preservation:
    if: github.repository == 'techrote/neurounner'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_HEAD: 0c866f5b65380ef6629a5bf084d017e886b91e52
      DEST: experiments/ncr-001/evidence-review/pr205-alltoken2048-original
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Refuse any unrelated source, evaluation or training change
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "techrote/neurounner"
          test "$GITHUB_REF_NAME" = "review/ncr001e-alltoken2048-original-custody-20261030"
          git merge-base --is-ancestor "$ORIGINAL_HEAD" HEAD
          test "$(git diff --name-only "$ORIGINAL_HEAD" HEAD)" = ".github/workflows/ncr-001e-alltoken2048-original-bootstrap.yml"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = 14ce5fbaa38f8806c8c8738f19c01b91385eebaf
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = 59fff1aed872b5563aa6898171983973e0cdb02c
          test "$(git hash-object scripts/ncr_001_postlease_sprocket.py)" = 66e6b4d97eea5e917339b8e7bfb5d1c191db4a2d
          python3 - <<'PY'
          import json
          p=json.load(open('experiments/ncr-001/protocol.json'))
          assert p['train_authorized'] is False
          assert set(p['models']) == {'smollm2','sprocket_chat','sprocket_instruct','void1'}
          assert p['conformance']['full_vs_cached_prefill_atol'] == p['conformance']['full_vs_cached_prefill_rtol'] == 0.0005
          print('PASS_ORIGINAL_PR205_SHA_PROTOCOL_AND_NO_TRAIN')
          PY
      - name: Verify exact original physical run, three completed jobs and three artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEST" /tmp/pr205-custody
          api() {
            curl --fail --silent --show-error --location --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/techrote/neurounner/$1" -o "$2"
          }
          api actions/runs/40987371706 /tmp/pr205-custody/run.json
          api 'actions/runs/40987371706/jobs?per_page=100' /tmp/pr205-custody/jobs.json
          api 'actions/runs/40987371706/artifacts?per_page=100' /tmp/pr205-custody/artifacts.json
          python3 - <<'PY'
          import json,pathlib
          d=pathlib.Path('/tmp/pr205-custody')
          run=json.loads((d/'run.json').read_text())
          assert run['id']==40987371706 and run['head_sha']=='0c866f5b65380ef6629a5bf084d017e886b91e52'
          assert run['status']=='completed' and run['conclusion']=='success'
          jobs={j['id']:j for j in json.loads((d/'jobs.json').read_text())['jobs']}
          assert all(jobs[j]['conclusion']=='success' for j in (123841492749,123841738132,123841738103))
          artifacts={a['id']:a for a in json.loads((d/'artifacts.json').read_text())['artifacts']}
          expected={
            12947388112:'0d5b5a8c99d701a1b6c1df6234a36912c979fd52939b29332542509ed4170c69',
            12947358773:'05d4b24909d612f08abf6dd65f498f71f31daab53b4c3cc3cfc8d0d881a40f36',
            12947986971:'6d519ff309f81dfd805cfc108c926d22eafaebd12a2854fc8fba4377ca199b32'}
          for aid,sha in expected.items():
            a=artifacts[aid]
            assert a['digest']=='sha256:'+sha and a['workflow_run']['id']==40987371706 and not a['expired']
          print('PASS_ORIGINAL_THREE_JOB_THREE_ARTIFACT_LEDGER')
          PY
      - name: Download and SHA-256 verify original three whole ZIPs and full API-decoded job logs
        shell: bash
        run: |
          set -euo pipefail
          api() {
            curl --fail --silent --show-error --location --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/techrote/neurounner/$1" -o "$DEST/$2"
          }
          api actions/artifacts/12947388112/zip original-source-12947388112.zip
          api actions/artifacts/12947358773/zip original-chat-12947358773.zip
          api actions/artifacts/12947986971/zip original-instruct-12947986971.zip
          api actions/jobs/123841492749/logs original-source-job-123841492749.log
          api actions/jobs/123841738132/logs original-chat-job-123841738132.log
          api actions/jobs/123841738103/logs original-instruct-job-123841738103.log
          printf '%s\n' \
            "0d5b5a8c99d701a1b6c1df6234a36912c979fd52939b29332542509ed4170c69  $DEST/original-source-12947388112.zip" \
            "05d4b24909d612f08abf6dd65f498f71f31daab53b4c3cc3cfc8d0d881a40f36  $DEST/original-chat-12947358773.zip" \
            "6d519ff309f81dfd805cfc108c926d22eafaebd12a2854fc8fba4377ca199b32  $DEST/original-instruct-12947986971.zip" | sha256sum -c
      - name: Build source-bound manifest and refuse false scientific admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          dest=pathlib.Path(os.environ['DEST'])
          lanes={'source':(12947388112,123841492749),'chat':(12947358773,123841738132),'instruct':(12947986971,123841738103)}
          expected_max={'chat':0.00026702880859375,'instruct':0.000110626220703125}
          expected_weight={'chat':('chat/model.safetensors','551c6e262ec4561dda7c74c9ef7cb73bd1a555ad1e05e37e6600c84a5acefe97'),'instruct':('model.safetensors','1a9fd1066f3f0873c4f5ae99b75beab3b0721100f45b036f9e255611b220d864')}
          out={'schema':'ncr001-pr205-original-alltoken2048-github-actions-custody-v1','source_pr':205,'source_sha':'0c866f5b65380ef6629a5bf084d017e886b91e52','source_run':40987371706,'original_parent_sha':'b085d0cec41473b33d844acbf644b57304526779','protocol_blob':'14ce5fbaa38f8806c8c8738f19c01b91385eebaf','pins_blob':'59fff1aed872b5563aa6898171983973e0cdb02c','postlease_blob':'66e6b4d97eea5e917339b8e7bfb5d1c191db4a2d','train_authorized':False,'full_72_conformance_pass':False,'actual_compute_budget_qualified':False,'optimizer_steps':0,'original_files':{}}
          for lane,(aid,jid) in lanes.items():
            zp=dest/f'original-{lane}-{aid}.zip'
            lp=dest/f'original-{lane}-job-{jid}.log'
            with zipfile.ZipFile(zp) as z:
              assert z.testzip() is None
              members={m.filename:{'bytes':m.file_size,'sha256':hashlib.sha256(z.read(m)).hexdigest()} for m in z.infolist()}
              if lane=='source':
                tests=z.read('tests.log').decode()
                assert 'Ran 12 tests' in tests and '\nOK' in tests
              else:
                r=json.loads(z.read('report.json'))
                assert r['schema']=='ncr001-sprocket-alltoken-stream-2048-v1'
                assert r['lane']=='sprocket_'+lane and r['status']=='PASS_2048_EVERY_TOKEN_TRUE_KV_STREAM__FINAL_72_BLOCKED'
                assert r['runner']['head_sha']==out['source_sha'] and str(r['runner']['run_id'])=='40987371706'
                assert r['original_frozen_model_executed'] is True and r['optimizer_steps']==0
                assert r['train_authorized'] is r['full_72_conformance_pass'] is r['actual_compute_budget_qualified'] is False
                assert r['all_prefixes_run_without_cache'] is False and r['batch_size']==1 and r['context_units']==2048
                assert r['frozen_backbone_before']==r['frozen_backbone_after']
                c=r['all_token_check']
                assert c['tokens_compared']==2048 and c['all_real_token_positions']==2048 and c['cached_step_size']==1
                assert c['all_steps_past_key_values_returned'] and c['all_steps_depth_field_per_current_token']
                assert c['numeric_atol']==c['numeric_rtol']==0.0005
                assert c['max_abs']==expected_max[lane] and c['max_abs_position']==0
                assert c['uncached_prefix_checkpoint_positions']==[1,2,16,64,128,256,512,1024,1536,2048]
                assert len(c['uncached_prefix_max_abs'])==10 and len(c['bucket_max_abs'])==4
                assert r['checks']['altered_future_suffix_max_abs']==0
                assert r['checks']['native_zero_logit_parity']==r['checks']['native_disabled_logit_parity']==0
                assert r['checks']['manual_intervention_learned'] is False
                name,sha=expected_weight[lane]
                assert r['frozen_source_files'][name]['sha256']==sha and r['frozen_source_files'][name]['bytes']==1002207984
            log=lp.read_bytes().decode('utf-8-sig')
            assert str(out['source_run']) in log
            if lane!='source':
              assert r['status'] in log and f'NCR001_ALL_TOKEN_PROGRESS {lane} 2048' in log
            for p in (zp,lp):
              b=p.read_bytes()
              assert len(b)>100
              out['original_files'][p.name]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob_sha1':subprocess.check_output(['git','hash-object',str(p)],text=True).strip()}
            out['original_files'][zp.name]['members']=members
          (dest/'manifest.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print('PASS_ALL_2048_EVERY_TOKEN_TWO_DISTINCT_FROZEN_LANES_AND_ORIGINAL_6_FILES')
          PY
      - name: Commit seven raw evidence files to branch once
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git commit -m "NCR-001E: preserve original PR205 full 3 ZIPs, 3 decoded jobs and provenance"
          git push origin HEAD:refs/heads/review/ncr001e-alltoken2048-original-custody-20261030
          echo PASS_ORIGINAL_PR205_RAW_ZIPS_AND_LOGS_PERMANENT_GIT
