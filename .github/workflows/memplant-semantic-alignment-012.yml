name: DREAMGRAFT DG012 donor semantic alignment
on:
  pull_request:
    branches: [research/memplant-dg011-heterogeneous-donors-20261116]
    paths:
      - '.github/workflows/memplant-semantic-alignment-012.yml'
      - 'experiments/memplant/semantic_alignment_012/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dg012-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
jobs:
  donor-private-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [26011620, 26011621]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install CPU training dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python3 -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
      - name: Verify disjoint data, private feature transforms and legality
        run: |
          python3 -m py_compile experiments/memplant/semantic_alignment_012/experiment.py
          python3 -m experiments.memplant.semantic_alignment_012.experiment --selftest
      - name: Train 18 specialists and paired, raw, blind receivers
        run: |
          OUT=runtime/memplant/dg012/${{ matrix.seed }}
          mkdir -p "$OUT"
          sha256sum experiments/memplant/semantic_alignment_012/experiment.py > "$OUT/source.sha256"
          timeout --signal=INT --kill-after=20s 18m python3 -m experiments.memplant.semantic_alignment_012.experiment \
            --seed ${{ matrix.seed }} --donor-steps 220 --receiver-steps 900 \
            --train-cases 5200 --sealed-cases 900 --out "$OUT"
      - name: Preserve trained weights, controls, decisions and source identities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dg012-${{ matrix.seed }}-a${{ github.run_attempt }}
          path: runtime/memplant/dg012/${{ matrix.seed }}
          retention-days: 30
          if-no-files-found: warn
