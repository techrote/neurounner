name: NCR-001E void1 four original physical cohorts scientific boundary (NO MODEL)
on:
  push:
    branches: [review/ncr001e-void-fourcohort-science-20261030]
    paths:
      - ".github/workflows/ncr-001-void-fourcohort-science.yml"
      - "scripts/ncr_001_void_fourcohort_scientific_delta.py"
      - "tests/test_ncr_001_void_fourcohort_scientific_delta.py"
      - "experiments/ncr-001/adjudication/void1-fourcohort-scientific-boundary-20261030.json"
      - "docs/NCR_001_VOID_FOURCOHORT_SCIENCE.md"
      - "RAG.md"
  pull_request:
    branches: [review/ncr001e-void-poststep-original-custody-20261030]
    paths:
      - ".github/workflows/ncr-001-void-fourcohort-science.yml"
      - "scripts/ncr_001_void_fourcohort_scientific_delta.py"
      - "tests/test_ncr_001_void_fourcohort_scientific_delta.py"
      - "experiments/ncr-001/adjudication/void1-fourcohort-scientific-boundary-20261030.json"
      - "docs/NCR_001_VOID_FOURCOHORT_SCIENCE.md"
      - "RAG.md"
permissions:
  contents: read
concurrency:
  group: ncr001-void-fourcohort-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-zip-log-scientific-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse original physical provenance, protocol or issue boundary drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 0c1a47c4d562a24c7d5a81305affb4a2501fd80e HEAD
          test "$(git hash-object experiments/ncr-001/protocol.json)" = 14ce5fbaa38f8806c8c8738f19c01b91385eebaf
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = 59fff1aed872b5563aa6898171983973e0cdb02c
          test "$(git hash-object experiments/ncr-001/adjudication/void1-postlease-pretrain.json)" = 81c0c7239e64fab8d6d077978a1591f3458c0367
          test "$(git hash-object experiments/ncr-001/adjudication/void1-postdiagnostic-review-pending.json)" = 9fdccd13aa4ec679b943e3c30b565d5cdc10061c
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          permitted={
            ".github/workflows/ncr-001-void-fourcohort-science.yml",
            "scripts/ncr_001_void_fourcohort_scientific_delta.py",
            "tests/test_ncr_001_void_fourcohort_scientific_delta.py",
            "experiments/ncr-001/adjudication/void1-fourcohort-scientific-boundary-20261030.json",
            "docs/NCR_001_VOID_FOURCOHORT_SCIENCE.md",
            "RAG.md",
          }
          changed=set(subprocess.check_output([
            "git","diff","--name-only",
            "0c1a47c4d562a24c7d5a81305affb4a2501fd80e","HEAD"
          ],text=True).splitlines())
          assert changed and changed<=permitted,changed
          p=json.loads(Path("experiments/ncr-001/protocol.json").read_text())
          assert p["train_authorized"] is False and set(p["models"])=={
              "smollm2","sprocket_chat","sprocket_instruct","void1"}
          print("PASS_EXACT_HEAD_ORIGINAL_COHORTS_PROTOCOL_AND_NO_TRAIN_POLICY")
          PY
      - name: Re-audit all four original physical ZIP cohorts and run false-promotion tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-void-fourcohort
          python3 -m py_compile scripts/ncr_001_void_fourcohort_scientific_delta.py tests/test_ncr_001_void_fourcohort_scientific_delta.py
          python3 -m unittest discover -s tests -p "test_ncr_001_void_fourcohort_scientific_delta.py" -v \
            2>&1 | tee runtime/ncr001-void-fourcohort/tests.log
          python3 scripts/ncr_001_void_fourcohort_scientific_delta.py \
            --out runtime/ncr001-void-fourcohort/source-bound-scientific-decision.json \
            2>&1 | tee runtime/ncr001-void-fourcohort/audit.log
          if test -f experiments/ncr-001/adjudication/void1-fourcohort-scientific-boundary-20261030.json; then
            python3 scripts/ncr_001_void_fourcohort_scientific_delta.py --check \
              > runtime/ncr001-void-fourcohort/committed-decision-readback.log
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("runtime/ncr001-void-fourcohort/source-bound-scientific-decision.json").read_text())
          assert x["status"]=="SOURCE_BOUND_FOUR_DISTINCT_VOID1_COHORTS__SCIENTIFIC_72_UNADMITTED"
          assert len(x["original_four_physical_cohorts"])==4
          assert len(x["nine_required_checks"])==9
          assert len(x["scope_limits_still_unproven"])==7
          assert x["poststep_2048_full_KV_measured"] is False
          assert x["full_72_conformance_pass"] is False
          assert x["train_authorized"] is False
          assert x["fresh_physical_model_execution"] is False
          assert x["new_optimizer_steps"]==0
          print("PASS_NO_FALSE_CROSSCOHORT_2048_POSTSTEP_OR_ADMISSION")
          PY
      - name: Retain CI source-runner identity even when prior source tests fail
        if: always()
        shell: bash
        run: |
          mkdir -p runtime/ncr001-void-fourcohort
          git rev-parse HEAD > runtime/ncr001-void-fourcohort/head.txt
          uname -a > runtime/ncr001-void-fourcohort/runner.txt
          python3 --version > runtime/ncr001-void-fourcohort/python.txt 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ncr001-void-fourcohort-scientific-source-replay
          path: runtime/ncr001-void-fourcohort/
          retention-days: 30
          if-no-files-found: warn
