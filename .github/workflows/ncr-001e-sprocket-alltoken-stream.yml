name: NCR-001E Sprocket 2048 all-token true KV streaming (NO TRAIN)
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [review/ncr001e-integrated-main-pin-20261030]
    paths:
      - ".github/workflows/ncr-001e-sprocket-alltoken-stream.yml"
      - "scripts/ncr_001e_sprocket_alltoken_stream.py"
      - "tests/test_ncr_001e_sprocket_alltoken_stream.py"
      - "docs/NCR_001_E_SPROCKET_ALLTOKEN_STREAM.md"
      - "RAG.md"
permissions:
  contents: read
concurrency:
  group: ncr001-alltoken-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  HF_HOME: /tmp/ncr001-sprocket-alltoken
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  PYTHONDONTWRITEBYTECODE: "1"
  NCR_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
jobs:
  source-tests:
    if: github.event.pull_request.head.repo.full_name == 'techrote/neurounner' && github.event.pull_request.head.ref == 'review/ncr001e-sprocket-alltoken-streaming-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Fail closed on original base and source/protocol modifications
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "techrote/neurounner"
          test "$GITHUB_HEAD_REF" = "review/ncr001e-sprocket-alltoken-streaming-20261030"
          test "$(git rev-parse HEAD)" = "$NCR_EXPECTED_HEAD"
          git merge-base --is-ancestor b085d0cec41473b33d844acbf644b57304526779 HEAD
          test "$(git hash-object experiments/ncr-001/protocol.json)" = 14ce5fbaa38f8806c8c8738f19c01b91385eebaf
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = 59fff1aed872b5563aa6898171983973e0cdb02c
          test "$(git hash-object scripts/ncr_001_postlease_sprocket.py)" = 66e6b4d97eea5e917339b8e7bfb5d1c191db4a2d
          python3 - <<'PY'
          import json,subprocess
          p=json.load(open("experiments/ncr-001/protocol.json"))
          s=json.load(open("experiments/ncr-001/source-pins.json"))
          assert p["train_authorized"] is False
          assert set(p["models"]) == set(s["models"]) == {"smollm2","sprocket_chat","sprocket_instruct","void1"}
          assert p["conformance"]["full_vs_cached_prefill_atol"] == p["conformance"]["full_vs_cached_prefill_rtol"] == .0005
          changed=set(subprocess.check_output(["git","diff","--name-only","b085d0cec41473b33d844acbf644b57304526779","HEAD"],text=True).splitlines())
          allowed={".github/workflows/ncr-001e-sprocket-alltoken-stream.yml",
                   "scripts/ncr_001e_sprocket_alltoken_stream.py",
                   "tests/test_ncr_001e_sprocket_alltoken_stream.py",
                   "docs/NCR_001_E_SPROCKET_ALLTOKEN_STREAM.md","RAG.md"}
          assert changed and changed<=allowed,changed
          print("PASS_PINNED_MAIN_SOURCE_PINS_NO_TRAIN")
          PY
      - name: Install original CPU-only packages
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
          python3 -m pip install --disable-pip-version-check "transformers==4.57.6" "huggingface_hub==0.36.2" "safetensors==0.8.0" "sentencepiece>=0.2,<1"
      - name: Twelve offline negative/source and numeric sentinels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-alltoken-source
          python3 -m py_compile scripts/ncr_001e_sprocket_alltoken_stream.py tests/test_ncr_001e_sprocket_alltoken_stream.py
          python3 -m unittest discover -s tests -p 'test_ncr_001e_sprocket_alltoken_stream.py' -v 2>&1 | tee runtime/ncr001-alltoken-source/tests.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-alltoken-source-a${{ github.run_attempt }}
          path: runtime/ncr001-alltoken-source/
          if-no-files-found: warn
          retention-days: 30
  original-frozen-matrix:
    needs: source-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        variant: [chat, instruct]
    env:
      NCR_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2271218d625e1462b2cf218445da975efe17fe32
          path: format-authority
          persist-credentials: false
      - name: Capture source checkout, runner and exact immutable protocol
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "runtime/ncr001-sprocket-alltoken2048/$NCR_VARIANT"
          { git rev-parse HEAD; git -C format-authority rev-parse HEAD; uname -a; lscpu; python3 --version; } > "runtime/ncr001-sprocket-alltoken2048/$NCR_VARIANT/runner-and-source.txt"
          test "$(git rev-parse HEAD)" = "$NCR_EXPECTED_HEAD"
          test "$(git -C format-authority rev-parse HEAD)" = 2271218d625e1462b2cf218445da975efe17fe32
          test "$(git hash-object experiments/ncr-001/protocol.json)" = 14ce5fbaa38f8806c8c8738f19c01b91385eebaf
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = 59fff1aed872b5563aa6898171983973e0cdb02c
      - name: Install pinned original full-frozen-host packages
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
          python3 -m pip install --disable-pip-version-check "transformers==4.57.6" "huggingface_hub==0.36.2" "safetensors==0.8.0" "sentencepiece>=0.2,<1"
          python3 -m pip freeze > "runtime/ncr001-sprocket-alltoken2048/$NCR_VARIANT/pip-freeze.txt"
      - name: Fetch exact pinned original weight and tokenizer bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "runtime/ncr001-sprocket-alltoken2048/$NCR_VARIANT/prefetch.log"
          import json,os
          from huggingface_hub import hf_hub_download
          variant=os.environ["NCR_VARIANT"]
          p=json.load(open("experiments/ncr-001/source-pins.json"))["models"]["sprocket_"+variant]
          assert p["revision"]=="eb157d4ddddc4619e661d4a2426bb2dd000fc668"
          assert p["hf_weight_file"]==({"chat":"chat/model.safetensors","instruct":"model.safetensors"}[variant])
          names={"chat":["chat/config.json","chat/tokenizer.json","chat/tokenizer_config.json"],
                 "instruct":["config.json","tokenizer.json","tokenizer_config.json","special_tokens_map.json"]}
          for name in ["README.md",*names[variant],p["hf_weight_file"]]:
              path=hf_hub_download(p["repo_id"],name,revision=p["revision"])
              print("FETCHED_PINNED_SOURCE",variant,name,path,flush=True)
          PY
      - name: Actual source-matched frozen Chat/root 2048 every-token true KV stream
        shell: bash
        run: |
          set -euo pipefail
          HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 python3 scripts/ncr_001e_sprocket_alltoken_stream.py --variant "$NCR_VARIANT" 2>&1 | tee "runtime/ncr001-sprocket-alltoken2048/$NCR_VARIANT/model.log"
      - name: Preserve complete source, partial 128-step progress, successes and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-alltoken-${{ matrix.variant }}-raw-a${{ github.run_attempt }}
          path: runtime/ncr001-sprocket-alltoken2048/${{ matrix.variant }}/
          if-no-files-found: warn
          retention-days: 30
