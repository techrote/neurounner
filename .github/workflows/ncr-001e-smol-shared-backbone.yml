name: NCR-001E SmolLM2 shared frozen-backbone isolation

on:
  pull_request:
    branches: [research/ncr-001c-smollm2-hook-conformance]
    paths:
      - ".github/workflows/ncr-001e-smol-shared-backbone.yml"
      - "scripts/ncr_001_smollm2.py"
      - "tests/test_ncr_001e_smollm2_shared_backbone.py"
      - "docs/NCR_001_E_SMOL_SHARED_BACKBONE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncr001e-smol-shared-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frozen-toy-refusal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm immutable source fixtures and closed training gate
        env:
          NCR_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$NCR_EXPECTED_HEAD"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = "dddfb416b765ef6cf23e1cdd326f8834f9f1417c"
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = "59fff1aed872b5563aa6898171983973e0cdb02c"
          python3 - <<'PY'
          import json
          p=json.load(open("experiments/ncr-001/protocol.json"))
          assert p["train_authorized"] is False
          assert set(p["models"])=={"smollm2","sprocket_chat","sprocket_instruct","void1"}
          print("Source and four-model protocol pins unchanged; training forbidden")
          PY
      - name: Install pinned CPU-only PyTorch (no models)
        run: |
          python3 -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
      - name: Exercise real overlapping synthetic hook-window and negative guards
        shell: bash
        run: |
          set -o pipefail
          mkdir -p runtime/ncr-001e-smol-shared-backbone
          python3 -m py_compile scripts/ncr_001_core.py scripts/ncr_001_smollm2.py tests/test_ncr_001e_smollm2_shared_backbone.py
          python3 -m unittest discover -s tests -p "test_ncr_001e_smollm2_shared_backbone.py" -v 2>&1 | tee runtime/ncr-001e-smol-shared-backbone/tests.log
      - name: Fail-closed readback of the previous original exact-source CI
        run: |
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          root=Path("experiments/ncr-001/evidence-review/smollm2-shared-backbone")
          p=json.loads((root/"provenance.json").read_text())
          assert p["original_actions_run"]==40666558184
          assert p["original_job_id"]==122742418162
          assert p["original_job_conclusion"]=="success"
          assert p["original_artifact"]["digest"]=="sha256:21f7644d26440461358675dbb4d54c6537dbfd81f013f486ec7b3f49a7c8e2e5"
          assert p["tested_exact_head_sha"]=="a6476e12220b4aa38040c6c73a1ed1982dc066c1"
          logpath=Path(p["archived_original_job_log"]["path"])
          def git_blob_sha(path):
              raw=Path(path).read_bytes()
              return hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          assert git_blob_sha(logpath)==p["archived_original_job_log"]["git_blob_sha1"]
          raw=logpath.read_text(encoding="utf-8-sig")
          assert "ref: a6476e12220b4aa38040c6c73a1ed1982dc066c1" in raw
          assert "Ran 7 tests in" in raw and re.search(r"\bOK\b",raw)
          assert len(re.findall(r"test_[a-z_]+ .* \.\.\. ok",raw))==7
          for src in ("scripts/ncr_001_smollm2.py","tests/test_ncr_001e_smollm2_shared_backbone.py","experiments/ncr-001/protocol.json","experiments/ncr-001/source-pins.json"):
              assert git_blob_sha(src)==p["tested_file_blobs"][src],src
          assert p["training"]["train_authorized"] is False
          assert p["training"]["frozen_model_executed"] is False
          assert p["training"]["optimizer_steps_in_new_test_suite"]==0
          assert p["tests_passed"]==7 and p["tests_failed"]==0
          print("Prior original CI archival provenance, seven refusal tests and source byte identities verified")
          PY
      - name: Preserve original test log on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr-001e-smol-shared-backbone-a${{ github.run_attempt }}
          path: runtime/ncr-001e-smol-shared-backbone/tests.log
          if-no-files-found: warn
          retention-days: 30
