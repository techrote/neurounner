name: NCR-001E Sprocket Chat original generate receipt audit (no model)

on:
  pull_request:
    branches:
      - review/ncr001e-pr102-independent-masked-batch-20261027
    paths:
      - '.github/workflows/ncr-001e-sprocket-chat-generate-audit.yml'
      - 'scripts/ncr_001e_sprocket_chat_generate_audit.py'
      - 'tests/test_ncr_001e_sprocket_chat_generate_audit.py'
      - 'experiments/ncr-001/evidence-review/sprocket-chat-generate/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Re-read exact original Chat evidence and fail closed on semantic promotion
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ncr_001e_sprocket_chat_generate_audit.py
          python3 scripts/ncr_001e_sprocket_chat_generate_audit.py
          python3 -m unittest discover -s tests \
            -p 'test_ncr_001e_sprocket_chat_generate_audit.py' -v
      - name: Reassert four-model no-training protocol
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('experiments/ncr-001/protocol.json'))
          assert p['train_authorized'] is False
          assert set(p['models']) == {'smollm2','sprocket_chat','sprocket_instruct','void1'}
          assert p['conformance']['full_vs_cached_prefill_atol'] == p['conformance']['full_vs_cached_prefill_rtol'] == .0005
          print('CHAT_ARCHIVE_READBACK_ONLY no model rerun; optimizer_steps=0')
          PY
