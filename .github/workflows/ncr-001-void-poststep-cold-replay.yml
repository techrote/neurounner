name: NCR-001E void1 poststep separate-Python cold and KV diagnostic (NO COMPARISON)

on:
  pull_request:
    branches: [review/ncr001-void-postdiagnostic-reconciliation-20261028]
    paths:
      - ".github/workflows/ncr-001-void-poststep-cold-replay.yml"
      - "scripts/ncr_001_void_poststep_cold_replay.py"
      - "tests/test_ncr_001_void_poststep_cold_replay.py"
      - "docs/NCR_001_VOID_POSTSTEP_COLD_REPLAY.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncr001-void-poststep-cold-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NCR_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  HF_HOME: /tmp/ncr001-void-poststep-cold-hf
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  no-model-sentinels:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Refuse protocol, four-variant and source-pin drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NCR_EXPECTED_HEAD"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = "14ce5fbaa38f8806c8c8738f19c01b91385eebaf"
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = "59fff1aed872b5563aa6898171983973e0cdb02c"
          test "$(git hash-object scripts/ncr_001_void_nca_learning_gate.py)" = "672fede7cb488bb33315b067bba5292678435644"
          test "$(git hash-object scripts/ncr_001_void_eos_postlease.py)" = "45d170472f3b37c6e13088212deab60bf2b223d7"
          python3 - <<'PY'
          import json
          p=json.load(open("experiments/ncr-001/protocol.json"))
          assert p["train_authorized"] is False
          assert set(p["models"]) == {"smollm2","sprocket_chat","sprocket_instruct","void1"}
          PY
      - name: Pure stdlib source and adversarial checks, no optimizer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-void-poststep-cold/source
          python3 -m py_compile scripts/ncr_001_void_poststep_cold_replay.py tests/test_ncr_001_void_poststep_cold_replay.py
          python3 -m unittest discover -s tests -p "test_ncr_001_void_poststep_cold_replay.py" -v \
            2>&1 | tee runtime/ncr001-void-poststep-cold/source/tests.log
      - name: Preserve original source-level logs including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-void-poststep-source-a${{ github.run_attempt }}
          path: runtime/ncr001-void-poststep-cold/source/
          if-no-files-found: warn
          retention-days: 30

  physical-public-sample-cold:
    needs: no-model-sentinels
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9fbdee880697903aaf5b91cc29442c9e53479e50
          path: byte-eos-authority
          persist-credentials: false
      - name: Enforce original #172 diagnostic and #163 EOS source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NCR_EXPECTED_HEAD"
          test "$(git -C byte-eos-authority rev-parse HEAD)" = "9fbdee880697903aaf5b91cc29442c9e53479e50"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = "14ce5fbaa38f8806c8c8738f19c01b91385eebaf"
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = "59fff1aed872b5563aa6898171983973e0cdb02c"
          test "$(git hash-object scripts/ncr_001_void_nca_learning_gate.py)" = "672fede7cb488bb33315b067bba5292678435644"
      - name: Install exact original frozen CPU runtime
        run: |
          python3 -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
          python3 -m pip install --disable-pip-version-check \
            "transformers==4.57.6" "huggingface_hub==0.36.2" \
            "safetensors==0.8.0" "sentencepiece>=0.2,<1"
      - name: Independently prefetch and hash original pinned Qwen3/ByteTokenizer source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-void-poststep-cold
          python3 - <<'PY' 2>&1 | tee runtime/ncr001-void-poststep-cold/prefetch.log
          import hashlib,json
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          p=json.load(open("experiments/ncr-001/source-pins.json"))["models"]["void1"]
          assert p["repo_id"] == "dotlabs/void.1"
          assert p["revision"] == "9c2be5087772867d45961abd11f6b35110617563"
          for name,key in {
              "model.safetensors":"weight_declared_lfs_sha256_not_downloaded",
              "config.json":"config_sha256",
              "tokenization_byte.py":"tokenization_byte_py_sha256",
              "byte_vocab.json":"byte_vocab_sha256",
              "tokenizer_config.json":"tokenizer_config_sha256",
              "special_tokens_map.json":"special_tokens_map_sha256",
          }.items():
              f=Path(hf_hub_download(p["repo_id"],name,revision=p["revision"]))
              h=hashlib.sha256(f.read_bytes()).hexdigest()
              assert h == p[key], (name,h,p[key])
              if name == "model.safetensors":
                  assert f.stat().st_size == 360622744
              print("SOURCE_SHA256",name,h,f.stat().st_size,flush=True)
          PY
      - name: Produce one-step NCA-only public synthetic state (no MLP update)
        shell: bash
        run: |
          set -o pipefail
          HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
            python3 scripts/ncr_001_void_poststep_cold_replay.py --phase producer \
            2>&1 | tee runtime/ncr001-void-poststep-cold/producer.log
      - name: Independently cold-reload after update in a new Python interpreter
        shell: bash
        run: |
          set -o pipefail
          HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
            python3 scripts/ncr_001_void_poststep_cold_replay.py --phase consumer \
            2>&1 | tee runtime/ncr001-void-poststep-cold/consumer.log
      - name: Destroy ephemeral diagnostic adapter state; keep raw evidence
        if: always()
        shell: bash
        run: |
          rm -rf runtime/ncr001-void-poststep-cold/nca-after-one-public-synthetic-step
          test ! -e runtime/ncr001-void-poststep-cold/nca-after-one-public-synthetic-step
      - name: Archive complete raw receipts, including negative runs, without adapter weights
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-void-poststep-host-a${{ github.run_attempt }}
          path: |
            runtime/ncr001-void-poststep-cold/
            runtime/ncr001-void-nca-learning/receipt.json
            runtime/ncr001-void-postlease/poststep-cold.json
          if-no-files-found: warn
          retention-days: 30
