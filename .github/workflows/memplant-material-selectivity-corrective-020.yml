name: DREAMGRAFT DG020 corrective material-law selectivity
on:
  pull_request:
    branches: [research/memplant-dg018-sequence-value-20261116]
    paths:
      - '.github/workflows/memplant-material-selectivity-corrective-020.yml'
      - 'experiments/memplant/material_causal_gate_020/selectivity_retrain.py'
      - 'experiments/memplant/material_causal_gate_020/experiment.py'
      - 'experiments/memplant/material_causal_gate_020/h6_experiment.py'
      - 'experiments/memplant/material_causal_gate_020/h7_experiment.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal-selectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [26011639, 26011640, 26011641]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned CPU-only dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python3 -m pip install --disable-pip-version-check 'numpy==1.26.4'
      - name: Verify research-only sources
        run: |
          python3 -m py_compile experiments/memplant/material_causal_gate_020/{experiment,selectivity_retrain}.py
      - name: Train 4 independent neural donors and 2 receivers; seal matched causal receipts
        env:
          SEED: ${{ matrix.seed }}
        run: |
          OUT="runtime/memplant/dg020-selectivity/$SEED"
          mkdir -p "$OUT"
          sha256sum experiments/memplant/material_causal_gate_020/{experiment,selectivity_retrain}.py > "$OUT/source-files.sha256"
          timeout --signal=INT --kill-after=15s 35m python3 \
            experiments/memplant/material_causal_gate_020/selectivity_retrain.py \
            --seed "$SEED" --out "$OUT" --train-each 600 \
            --eval-each 160 --updates 700 --donor-steps 400
      - name: Independently audit oracle, hashes, raw paired decisions and replay trained checkpoints
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys
          import numpy as np
          import torch
          root=pathlib.Path('experiments/memplant/material_causal_gate_020')
          sys.path.insert(0,str(root.resolve()))
          from experiment import oracle, Donor, Receiver, TILES
          from selectivity_retrain import FAMILIES, BUCKETS, THRESHOLDS, verdict
          out=pathlib.Path('runtime/memplant/dg020-selectivity')/os.environ['SEED']
          source=root/'selectivity_retrain.py'
          h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          rep=json.loads((out/'report.json').read_text())
          assert rep['seed']==int(os.environ['SEED'])
          assert rep['source_sha256']==h(source)
          assert rep['heldout_families']==list(FAMILIES)
          assert rep['training_buckets']==list(BUCKETS)
          assert rep['training_worlds']==3600
          assert max(rep['donor_mse'].values())<THRESHOLDS['donor_mse_max']
          assert rep['verdict']==verdict(rep['evaluation'])
          manifest=json.loads((out/'sha256.json').read_text())
          assert len(manifest)>=13
          for filename,expected in manifest.items():
              assert h(out/filename)==expected,filename
          donors={}
          for law in (0,1):
              m=Donor().eval()
              m.load_state_dict(torch.load(out/f'donor-{law}-replica-0.pt',map_location='cpu',weights_only=True))
              donors[law]=m
          receiver=Receiver().eval()
          receiver.load_state_dict(torch.load(out/'receiver-cost-calibrated.pt',map_location='cpu',weights_only=True))
          receipts_seen=0
          for family in FAMILIES:
              for bucket in BUCKETS:
                  path=out/f'receipts-{family}-{bucket}.jsonl'
                  receipts=[json.loads(line) for line in path.read_text().splitlines()]
                  assert len(receipts)==THRESHOLDS['pairs_per_bucket']
                  x=np.asarray([r['observation'] for r in receipts],dtype=np.float32)
                  with torch.no_grad():
                      forecasts=[donors[k](torch.from_numpy(x).reshape(-1,4)).reshape(-1,2,TILES) for k in (0,1)]
                      logits=[receiver(torch.from_numpy(x),c) for c in forecasts]
                  for i,r in enumerate(receipts):
                      w=x[i]
                      assert hashlib.sha256(w.tobytes()).hexdigest()==r['observation_sha256']
                      assert r['same_observation_both_laws'] and r['legal_mask']==[1,1]
                      actions=[]
                      for law in (0,1):
                          oa,gap,costs=oracle(w,law)
                          assert oa==r['oracle_actions'][law]
                          assert abs(gap-r['oracle_gaps'][law])<1e-4
                          assert gap>=THRESHOLDS['min_oracle_gap']
                          assert np.allclose(costs,r['oracle_costs'][law],rtol=1e-5,atol=1e-4)
                          assert np.allclose(forecasts[law][i].numpy(),r['donor_tile_forecasts'][law],rtol=1e-5,atol=2e-5)
                          assert np.allclose(logits[law][i].numpy(),r['logits'][law],rtol=1e-5,atol=2e-4)
                          actions.append(int(logits[law][i].argmax()))
                      assert actions==r['actions']
                      assert (r['oracle_actions'][0]!=r['oracle_actions'][1])==(bucket=='divergent')
                      assert bool(actions==r['oracle_actions'])==r['both_correct']
                      receipts_seen+=1
          assert receipts_seen==960
          (out/'independent-audit.json').write_text(json.dumps(dict(
              seed=int(os.environ['SEED']),receipts_replayed=receipts_seen,
              checksums_verified=len(manifest),scientific_verdict=rep['verdict'],
              source_sha256=rep['source_sha256']),indent=2)+'\n')
          print('DG020 independent audit PASS; SCIENTIFIC VERDICT:',rep['verdict'])
          PY
      - name: Upload genuine trained checkpoints, all decisions and failed cases
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dg020-selectivity-corrective-${{ matrix.seed }}
          path: runtime/memplant/dg020-selectivity/${{ matrix.seed }}
          if-no-files-found: warn
          retention-days: 30

  near-tie-h6-frozen-donor-retrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { seed: 26011639, artifact: 14288351242 }
          - { seed: 26011640, artifact: 14287683493 }
          - { seed: 26011641, artifact: 14288072802 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned CPU-only dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python3 -m pip install --disable-pip-version-check 'numpy==1.26.4'
      - name: Download immutable original neural donor checkpoints (no retraining donors)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ matrix.artifact }}
          run-id: 43991959674
          github-token: ${{ github.token }}
          path: runtime/memplant/h6-checkpoints/${{ matrix.seed }}
          merge-multiple: true
      - name: Retrain same-size receiver with route-difference supervision; record scientific FAIL/PASS
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python3 -m py_compile experiments/memplant/material_causal_gate_020/{experiment,h6_experiment}.py
          OUT="runtime/memplant/h6/$SEED"
          mkdir -p "$OUT"
          sha256sum experiments/memplant/material_causal_gate_020/{experiment,h6_experiment}.py > "$OUT/source-files.sha256"
          sha256sum runtime/memplant/h6-checkpoints/"$SEED"/*.pt > "$OUT/original-checkpoint-files.sha256"
          timeout --signal=INT --kill-after=15s 35m python3 experiments/memplant/material_causal_gate_020/h6_experiment.py \
            --seed "$SEED" --checkpoint-root runtime/memplant/h6-checkpoints --out "$OUT" \
            --train-each 320 --eval-each 160 --updates 1000
      - name: Independently audit model replay, oracle, source/checkpoint hashes and all 1600 receipts
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,sys
          import numpy as np,torch
          root=pathlib.Path('experiments/memplant/material_causal_gate_020')
          sys.path.insert(0,str(root.resolve()))
          from experiment import oracle,Receiver,TILES
          from h6_experiment import load_donors,HELDOUT_FAMILIES,BUCKETS,THRESHOLDS
          seed=int(os.environ['SEED'])
          out=pathlib.Path('runtime/memplant/h6')/str(seed)
          rootcp=pathlib.Path('runtime/memplant/h6-checkpoints')
          h=lambda p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          rep=json.loads((out/'report.json').read_text())
          assert rep['seed']==seed and rep['source_sha256']==h(root/'h6_experiment.py')
          manifest=json.loads((out/'sha256.json').read_text())
          assert all(h(out/name)==sha for name,sha in manifest.items())
          donors,_=load_donors(seed,rootcp)
          model=Receiver().eval()
          model.load_state_dict(torch.load(out/'receiver-route-difference.pt',map_location='cpu',weights_only=True))
          count=0
          for fam in HELDOUT_FAMILIES:
              for bucket in BUCKETS:
                  rows=[json.loads(line) for line in (out/f'receipts-{fam}-{bucket}.jsonl').read_text().splitlines()]
                  assert len(rows)==THRESHOLDS['n']
                  x=np.asarray([r['observation'] for r in rows],dtype='f4')
                  tx=torch.from_numpy(x)
                  with torch.no_grad():
                      forecasts=[donors[k][0](tx.reshape(-1,4)).reshape(len(x),2,TILES) for k in (0,1)]
                      logits=[model(tx,forecasts[k]) for k in (0,1)]
                  for i,row in enumerate(rows):
                      assert hashlib.sha256(x[i].tobytes()).hexdigest()==row['observation_sha256']
                      assert row['legal_mask']==[1,1] and row['identical_observation_both_laws']
                      actions=[]
                      for k in (0,1):
                          action,gap,costs=oracle(x[i],k)
                          assert action==row['oracle_actions'][k]
                          assert abs(gap-row['oracle_gaps'][k])<1e-4
                          assert np.allclose(costs,row['oracle_route_costs'][k],atol=5e-5,rtol=1e-6)
                          assert np.allclose(forecasts[k][i].numpy(),row['donor_forecasts'][k],atol=5e-5)
                          assert np.allclose(logits[k][i].numpy(),row['logits'][k],atol=5e-5)
                          actions.append(int(logits[k][i].argmax()))
                      assert actions==row['actions']
                      assert (row['oracle_actions'][0]!=row['oracle_actions'][1])==bucket.endswith('divergent')
                      count+=1
          assert count==1600
          (out/'independent-audit.json').write_text(json.dumps(dict(seed=seed,source_verified=True,receipts_replayed=count,manifest_verified=len(manifest),scientific_verdict=rep['scientific_verdict']),indent=2)+'\n')
          print('Independent replay/oracle audit PASS; scientific verdict:',rep['scientific_verdict'])
          PY
      - name: Preserve actual trained receiver, controls, near-tie raw decisions and negative results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dg020-h6-neartie-${{ matrix.seed }}
          path: runtime/memplant/h6/${{ matrix.seed }}
          if-no-files-found: warn
          retention-days: 30

  near-tie-h7-donor-replica-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { seed: 26011639, artifact: 14288351242 }
          - { seed: 26011640, artifact: 14287683493 }
          - { seed: 26011641, artifact: 14288072802 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned CPU-only dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python3 -m pip install --disable-pip-version-check 'numpy==1.26.4'
      - name: Download immutable original neural donor checkpoints (no retraining donors)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ matrix.artifact }}
          run-id: 43991959674
          github-token: ${{ github.token }}
          path: runtime/memplant/h7-checkpoints/${{ matrix.seed }}
          merge-multiple: true
      - name: Retrain unchanged receiver on both same-law donor replicas; record scientific FAIL/PASS
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python3 -m py_compile experiments/memplant/material_causal_gate_020/{experiment,h6_experiment,h7_experiment}.py
          OUT="runtime/memplant/h7/$SEED"
          mkdir -p "$OUT"
          sha256sum experiments/memplant/material_causal_gate_020/{experiment,h6_experiment,h7_experiment}.py > "$OUT/source-files.sha256"
          sha256sum runtime/memplant/h7-checkpoints/"$SEED"/*.pt > "$OUT/original-checkpoint-files.sha256"
          timeout --signal=INT --kill-after=15s 35m python3 experiments/memplant/material_causal_gate_020/h7_experiment.py \
            --seed "$SEED" --checkpoint-root runtime/memplant/h7-checkpoints --out "$OUT" \
            --train-each 320 --eval-each 160 --updates 1000
      - name: Independently audit model replay, oracle, source/checkpoint hashes and all 1600 receipts
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,sys
          import numpy as np,torch
          root=pathlib.Path('experiments/memplant/material_causal_gate_020')
          sys.path.insert(0,str(root.resolve()))
          from experiment import oracle,Receiver,TILES
          from h6_experiment import load_donors
          from h7_experiment import HELDOUT_FAMILIES,BUCKETS,THRESHOLDS
          seed=int(os.environ['SEED'])
          out=pathlib.Path('runtime/memplant/h7')/str(seed)
          rootcp=pathlib.Path('runtime/memplant/h7-checkpoints')
          h=lambda p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          rep=json.loads((out/'report.json').read_text())
          assert rep['seed']==seed and rep['source_sha256']==h(root/'h7_experiment.py')
          assert rep['train_test_collisions']==0 and rep['training_worlds']==4000
          assert rep['heldout_families']==list(HELDOUT_FAMILIES)
          manifest=json.loads((out/'sha256.json').read_text())
          assert all(h(out/name)==sha for name,sha in manifest.items())
          donors,_=load_donors(seed,rootcp)
          model=Receiver().eval()
          model.load_state_dict(torch.load(out/'receiver-replica-consistent.pt',map_location='cpu',weights_only=True))
          count=0
          for fam in HELDOUT_FAMILIES:
              for bucket in BUCKETS:
                  rows=[json.loads(line) for line in (out/f'receipts-{fam}-{bucket}.jsonl').read_text().splitlines()]
                  assert len(rows)==THRESHOLDS['n']
                  x=np.asarray([r['observation'] for r in rows],dtype='f4')
                  tx=torch.from_numpy(x)
                  with torch.no_grad():
                      forecasts=[donors[k][0](tx.reshape(-1,4)).reshape(len(x),2,TILES) for k in (0,1)]
                      logits=[model(tx,forecasts[k]) for k in (0,1)]
                  for i,row in enumerate(rows):
                      assert hashlib.sha256(x[i].tobytes()).hexdigest()==row['observation_sha256']
                      assert row['legal_mask']==[1,1] and row['identical_observation_both_laws']
                      actions=[]
                      for k in (0,1):
                          action,gap,costs=oracle(x[i],k)
                          assert action==row['oracle_actions'][k]
                          assert abs(gap-row['oracle_gaps'][k])<1e-4
                          assert np.allclose(costs,row['oracle_route_costs'][k],atol=5e-5,rtol=1e-6)
                          assert np.allclose(forecasts[k][i].numpy(),row['donor_forecasts'][k],atol=5e-5)
                          assert np.allclose(logits[k][i].numpy(),row['logits'][k],atol=5e-5)
                          actions.append(int(logits[k][i].argmax()))
                      assert actions==row['actions']
                      assert row['legal_mask']==[1,1]
                      assert all(a in (0,1) for a in actions)
                      assert (row['oracle_actions'][0]!=row['oracle_actions'][1])==bucket.endswith('divergent')
                      count+=1
          assert count==1600
          (out/'independent-audit.json').write_text(json.dumps(dict(seed=seed,source_verified=True,receipts_replayed=count,manifest_verified=len(manifest),scientific_verdict=rep['scientific_verdict']),indent=2)+'\n')
          print('Independent replay/oracle audit PASS; scientific verdict:',rep['scientific_verdict'])
          PY
      - name: Preserve H7 trained receiver, controls, untouched-holdout decisions and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dg020-h7-replica-${{ matrix.seed }}
          path: runtime/memplant/h7/${{ matrix.seed }}
          if-no-files-found: warn
          retention-days: 30
