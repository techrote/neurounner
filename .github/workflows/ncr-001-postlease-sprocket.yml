name: NCR-001 post-lease original Sprocket NCA/MLP qualification (no train)

on:
  pull_request:
    branches: [review/ncr001-cross-adapter-decoder-lease-20261028]
    paths:
      - ".github/workflows/ncr-001-postlease-sprocket.yml"
      - "scripts/ncr_001_postlease_sprocket.py"
      - "tests/test_ncr_001_postlease_sprocket.py"
      - "docs/NCR_001_POSTLEASE_SPROCKET.md"
      - "scripts/ncr_001_backbone_lease.py"
      - "scripts/ncr_001_sprocket_chat.py"
      - "scripts/ncr_001_sprocket_instruct.py"
      - "scripts/ncr_001f_frozen_hooks.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncr001-postlease-sprocket-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HF_HOME: /tmp/ncr001-postlease-sprocket
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  PYTHONDONTWRITEBYTECODE: "1"
  NCR_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-and-negative-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable four-model protocol, exact head, training closed
        run: |
          test "$(git rev-parse HEAD)" = "$NCR_EXPECTED_HEAD"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = "14ce5fbaa38f8806c8c8738f19c01b91385eebaf"
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = "59fff1aed872b5563aa6898171983973e0cdb02c"
          python3 - <<'PY'
          import json
          p=json.load(open("experiments/ncr-001/protocol.json"))
          assert p["train_authorized"] is False
          assert set(p["models"])=={"smollm2","sprocket_chat","sprocket_instruct","void1"}
          print("NCR-001: no optimizer, no heldout, no admission",flush=True)
          PY
      - name: Install pinned CPU-only qualification dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
          python3 -m pip install --disable-pip-version-check \
            "transformers==4.57.6" "huggingface_hub==0.36.2" \
            "safetensors==0.8.0" "sentencepiece>=0.2,<1"
      - name: Syntax and source-identity adversarial tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p runtime/ncr001-postlease-sprocket
          python3 -m py_compile scripts/ncr_001_postlease_sprocket.py tests/test_ncr_001_postlease_sprocket.py
          python3 -m unittest discover -s tests -p "test_ncr_001_postlease_sprocket.py" -v 2>&1 | tee runtime/ncr001-postlease-sprocket/source-tests.log
          python3 -m unittest discover -s tests -p "test_ncr_001_cross_decoder_lease.py" -v 2>&1 | tee runtime/ncr001-postlease-sprocket/shared-lease-tests.log
      - name: Retain source failures as well as passes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-postlease-source-a${{ github.run_attempt }}
          path: runtime/ncr001-postlease-sprocket/*.log
          if-no-files-found: warn
          retention-days: 30

  actual-sprocket-frozen-host:
    needs: source-and-negative-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: chat
            weight: chat/model.safetensors
          - variant: instruct
            weight: model.safetensors
    env:
      NCR_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2271218d625e1462b2cf218445da975efe17fe32
          path: format-authority
          persist-credentials: false
      - name: Verify PR head, source-formatter checkout and no training authorization
        run: |
          test "$(git rev-parse HEAD)" = "$NCR_EXPECTED_HEAD"
          test "$(git -C format-authority rev-parse HEAD)" = "2271218d625e1462b2cf218445da975efe17fe32"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = "14ce5fbaa38f8806c8c8738f19c01b91385eebaf"
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = "59fff1aed872b5563aa6898171983973e0cdb02c"
          python3 - <<'PY'
          import json
          p=json.load(open("experiments/ncr-001/protocol.json"))
          assert p["train_authorized"] is False
          assert set(p["models"])=={"smollm2","sprocket_chat","sprocket_instruct","void1"}
          PY
      - name: Install pinned actual HF CPU dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
          python3 -m pip install --disable-pip-version-check \
            "transformers==4.57.6" "huggingface_hub==0.36.2" \
            "safetensors==0.8.0" "sentencepiece>=0.2,<1"
      - name: Prefetch and independently SHA-256 check entire original pinned checkpoint
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          variant=os.environ["NCR_VARIANT"]
          p=json.load(open("experiments/ncr-001/source-pins.json"))["models"]["sprocket_"+variant]
          assert p["repo_id"] == "kandivault/sprocket-500m"
          assert p["revision"] == "eb157d4ddddc4619e661d4a2426bb2dd000fc668"
          names={"chat":["chat/config.json","chat/tokenizer.json","chat/tokenizer_config.json"],
                 "instruct":["config.json","tokenizer.json","tokenizer_config.json","special_tokens_map.json"]}[variant]
          keys={"config.json":"config_sha256","tokenizer.json":"tokenizer_sha256",
                "tokenizer_config.json":"tokenizer_config_sha256",
                "special_tokens_map.json":"special_tokens_map_sha256"}
          for name in ["README.md",*names,p["hf_weight_file"]]:
              path=Path(hf_hub_download(p["repo_id"],name,revision=p["revision"]))
              digest=hashlib.sha256()
              with path.open("rb") as f:
                  for b in iter(lambda:f.read(4*1024*1024),b""): digest.update(b)
              got=digest.hexdigest()
              if name=="README.md": expected="09aec879dc5b387bdc031dc3c74d77a9ba44362a55163f9a8b456761b68142c9"
              elif name==p["hf_weight_file"]: expected=p["weight_declared_lfs_sha256_not_downloaded"]
              else: expected=p[("chat_" if variant=="chat" else "")+keys[name.split("/")[-1]]]
              assert got==expected,(variant,name,got,expected)
              if name==p["hf_weight_file"]:
                  assert path.stat().st_size==p["weight_bytes"]==1002207984
              print("VERIFIED_FULL_SOURCE",variant,name,got,path.stat().st_size,flush=True)
          PY
      - name: Fresh source-matched actual frozen host and cross-wrapper cache probes
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "runtime/ncr001-postlease-sprocket/$NCR_VARIANT"
          HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
            python3 scripts/ncr_001_postlease_sprocket.py \
              --variant "$NCR_VARIANT" --phase producer 2>&1 | tee "runtime/ncr001-postlease-sprocket/$NCR_VARIANT/producer.log"
      - name: Fresh independent Python interpreter cold NCA+MLP adapter reload
        shell: bash
        run: |
          set -o pipefail
          HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
            python3 scripts/ncr_001_postlease_sprocket.py \
              --variant "$NCR_VARIANT" --phase consumer 2>&1 | tee "runtime/ncr001-postlease-sprocket/$NCR_VARIANT/consumer.log"
      - name: Preserve complete original positive/negative receipts and source logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-postlease-${{ matrix.variant }}-a${{ github.run_attempt }}
          path: runtime/ncr001-postlease-sprocket/${{ matrix.variant }}/
          if-no-files-found: warn
          retention-days: 30
