name: NCR-001E Sprocket Chat original HF.generate cache on/off (no training)

on:
  pull_request:
    branches:
      - review/ncr001e-pr102-independent-masked-batch-20261027
    paths:
      - '.github/workflows/ncr-001e-sprocket-chat-generate.yml'
      - 'scripts/ncr_001e_sprocket_chat_generate_review.py'
      - 'tests/test_ncr_001e_sprocket_chat_generate_review.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncr001e-chat-generate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  HF_HOME: /tmp/ncr001e-chat-generate-hf
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  source:
    name: Exact Chat source/ordinary-role/no-tool-semantics sentinels
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Refuse Chat/Instruct source substitution and protocol drift
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/ncr_001e_sprocket_format.py)" = "39cf015735e74a1d1e08682b623404bc1e600b9b"
          python3 - <<'PY'
          import json
          p=json.load(open('experiments/ncr-001/protocol.json'))
          pins=json.load(open('experiments/ncr-001/source-pins.json'))
          assert p['train_authorized'] is False
          assert set(p['models']) == set(pins['models']) == {'smollm2','sprocket_chat','sprocket_instruct','void1'}
          assert p['conformance']['full_vs_cached_prefill_atol'] == p['conformance']['full_vs_cached_prefill_rtol'] == .0005
          c=pins['models']['sprocket_chat'];i=pins['models']['sprocket_instruct']
          assert c['variant']=='chat' and c['hf_weight_file']=='chat/model.safetensors'
          assert i['variant']=='instruct' and i['hf_weight_file']=='model.safetensors'
          assert c['weight_declared_lfs_sha256_not_downloaded'] != i['weight_declared_lfs_sha256_not_downloaded']
          print('CHAT_SOURCE_ONLY ordinary roles; no Instruct tool/memory semantics; no training')
          PY
      - name: Pure Python right-gap and false-admission tests
        run: |
          python3 -m py_compile scripts/ncr_001e_sprocket_chat_generate_review.py
          python3 scripts/ncr_001e_sprocket_chat_generate_review.py --source-test
          python3 -m unittest discover -s tests \
            -p 'test_ncr_001e_sprocket_chat_generate_review.py' -v

  actual-chat:
    needs: source
    name: Actual original Chat full checkpoint + right-gap + HF GenerationMixin
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 83a56835a7476f17a17980d28dd1a7c14bb6f2f6
          path: implementation
          persist-credentials: false
      - name: Verify exact original Chat hook and no-training protocol
        run: |
          set -euo pipefail
          test "$(git -C implementation rev-parse HEAD)" = "83a56835a7476f17a17980d28dd1a7c14bb6f2f6"
          test "$(git -C implementation hash-object scripts/ncr_001_sprocket_chat.py)" = "82192acf80ba2ddfe9db9e34eaa5259c657847a8"
          test "$(git hash-object scripts/ncr_001e_sprocket_format.py)" = "39cf015735e74a1d1e08682b623404bc1e600b9b"
          python3 - <<'PY'
          import json
          p=json.load(open('experiments/ncr-001/protocol.json'))
          pins=json.load(open('experiments/ncr-001/source-pins.json'))
          assert p['train_authorized'] is False
          assert p['models']['sprocket_chat']['weight_file']=='chat/model.safetensors'
          assert pins['models']['sprocket_chat']['weight_declared_lfs_sha256_not_downloaded']=='551c6e262ec4561dda7c74c9ef7cb73bd1a555ad1e05e37e6600c84a5acefe97'
          assert pins['models']['sprocket_instruct']['weight_declared_lfs_sha256_not_downloaded']=='1a9fd1066f3f0873c4f5ae99b75beab3b0721100f45b036f9e255611b220d864'
          print('EXACT_CHAT_HOOK_AND_WEIGHT; train_authorized=false')
          PY
      - name: Install qualified CPU runtime
        run: |
          python3 -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.1+cpu'
          python3 -m pip install --disable-pip-version-check \
            'transformers==4.57.6' 'huggingface_hub==0.36.2' \
            'safetensors==0.8.0' 'sentencepiece>=0.2,<1'
          mkdir -p runtime/ncr-001
          python3 -m pip freeze > runtime/ncr-001/sprocket-chat-generate-packages.txt
      - name: Prefetch and independently hash complete Chat source files
        run: |
          python3 - <<'PY'
          import hashlib,json,os,platform
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          pin=json.load(open('experiments/ncr-001/source-pins.json'))['models']['sprocket_chat']
          report={'status':'RUNNING','variant':'chat','train_authorized':False,
                  'optimizer_steps':0,'files':{},
                  'runner':{'github_run_id':os.getenv('GITHUB_RUN_ID'),
                            'github_sha':os.getenv('GITHUB_SHA'),
                            'runner_name':os.getenv('RUNNER_NAME'),
                            'python':platform.python_version()}}
          out=Path('runtime/ncr-001/sprocket-chat-generate-prefetch.json')
          out.write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          files=[
            ('README.md',None,None),
            ('model.safetensors','weight_declared_lfs_sha256_not_downloaded','chat'),
            ('config.json','chat_config_sha256','chat'),
            ('tokenizer.json','chat_tokenizer_sha256','chat'),
            ('tokenizer_config.json','chat_tokenizer_config_sha256','chat'),
          ]
          try:
              for name,key,subfolder in files:
                  kw={'revision':pin['revision']}
                  if subfolder: kw['subfolder']=subfolder
                  path=Path(hf_hub_download(pin['repo_id'],name,**kw))
                  h=hashlib.sha256()
                  with path.open('rb') as f:
                      for chunk in iter(lambda:f.read(4*1024*1024),b''):h.update(chunk)
                  digest=h.hexdigest()
                  if key: assert digest==pin[key],f'Chat pinned source SHA changed: {name}'
                  if name=='model.safetensors': assert path.stat().st_size==1002207984
                  report['files'][('chat/' if subfolder else '')+name]={'sha256':digest,'bytes':path.stat().st_size}
                  out.write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
                  print('CHAT_ORIGINAL_SOURCE',name,digest,path.stat().st_size,flush=True)
              assert report['files']['README.md']['sha256']=='09aec879dc5b387bdc031dc3c74d77a9ba44362a55163f9a8b456761b68142c9'
              report['status']='PASS_CHAT_FULL_SOURCE_PREFETCH'
          except BaseException as exc:
              report['status']='FAIL_CHAT_FULL_SOURCE_PREFETCH'
              report['error']=type(exc).__name__+': '+str(exc)
              raise
          finally:
              out.write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          PY
      - name: Actual frozen Chat right-padding KV and real HF generate cache on/off
        run: |
          HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
            python3 scripts/ncr_001e_sprocket_chat_generate_review.py
      - name: Preserve exact source identity and complete PASS/FAIL partial evidence
        if: always()
        run: |
          git rev-parse HEAD > runtime/ncr-001/sprocket-chat-generate-source-commit.txt
          sha256sum scripts/ncr_001e_sprocket_chat_generate_review.py \
            scripts/ncr_001e_sprocket_format.py \
            experiments/ncr-001/protocol.json \
            experiments/ncr-001/source-pins.json \
            > runtime/ncr-001/sprocket-chat-generate-source-hashes.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ncr001e-sprocket-chat-generate-a${{ github.run_attempt }}
          path: runtime/ncr-001/sprocket-chat-generate-*
          if-no-files-found: warn
          retention-days: 30
