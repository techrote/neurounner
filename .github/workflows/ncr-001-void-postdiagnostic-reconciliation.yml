name: NCR-001 void1 post-diagnostic reconciliation (NO ADMISSION)

on:
  pull_request:
    branches: [review/ncr001-void-nca-learning-original-custody-20261028]
    paths:
      - ".github/workflows/ncr-001-void-postdiagnostic-reconciliation.yml"
      - "scripts/ncr_001_void_postdiagnostic_reconciliation.py"
      - "tests/test_ncr_001_void_postdiagnostic_reconciliation.py"
      - "experiments/ncr-001/adjudication/void1-postdiagnostic-review-pending.json"
      - "docs/NCR_001_VOID_POSTDIAGNOSTIC_RECONCILIATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-evidence-postdiagnostic-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      OUT: runtime/ncr001-void-postdiagnostic-reconciliation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact source head and unchanged original evidence / four-lane protocol
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = "14ce5fbaa38f8806c8c8738f19c01b91385eebaf"
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = "59fff1aed872b5563aa6898171983973e0cdb02c"
          test "$(git hash-object scripts/ncr_001e_void1_postlease_adjudication.py)" = "fe3bb9587487b6c14c161f3020c73df0d3bb0cb6"
          test "$(git hash-object experiments/ncr-001/adjudication/void1-postlease-pretrain.json)" = "81c0c7239e64fab8d6d077978a1591f3458c0367"
          test "$(git hash-object scripts/ncr_001_void_nca_original_custody.py)" = "07e64baf4559a5e7b60c8a82d462405242b7b6b8"
          test "$(git hash-object experiments/ncr-001/controls-evidence/void-nca-learning-20261028/manifest.json)" = "33dc325239f4518a21679dd746ce2d4b5030e489"
          python3 - <<'PY'
          import json
          p=json.load(open("experiments/ncr-001/protocol.json", encoding="utf-8"))
          assert p["train_authorized"] is False
          assert set(p["models"]) == {"smollm2","sprocket_chat","sprocket_instruct","void1"}
          assert p["models"]["sprocket_chat"]["weight_file"] == "chat/model.safetensors"
          assert p["models"]["sprocket_instruct"]["weight_file"] == "model.safetensors"
          assert p["models"]["void1"]["weight_file"] == "model.safetensors"
          PY
      - name: Rebuild pretraining and post-diagnostic matrices from original ZIPs; falsify 18 mutations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 -m py_compile scripts/ncr_001_void_postdiagnostic_reconciliation.py tests/test_ncr_001_void_postdiagnostic_reconciliation.py
          python3 -m unittest discover -s tests -p 'test_ncr_001_void_postdiagnostic_reconciliation.py' -v 2>&1 | tee "$OUT/tests.log"
          python3 scripts/ncr_001_void_postdiagnostic_reconciliation.py --check | tee "$OUT/report-readback.json"
      - name: Preserve check output including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-void-postdiagnostic-readback-a${{ github.run_attempt }}
          path: runtime/ncr001-void-postdiagnostic-reconciliation/
          if-no-files-found: warn
          retention-days: 30
