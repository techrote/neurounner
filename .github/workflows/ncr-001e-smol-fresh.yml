name: NCR-001E fresh frozen SmolLM2 cold-cache source review

on:
  pull_request:
    branches: [main, review/ncr-001e-four-model-prepass-readback]
    paths:
      - ".github/workflows/ncr-001e-smol-fresh.yml"
      - "scripts/ncr_001e_smol_fresh.py"
      - "experiments/ncr-001/protocol.json"
      - "experiments/ncr-001/source-pins.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncr001e-smol-fresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: /tmp/ncr-001e-smol-fresh-hf
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  fresh-smolllm2:
    name: Fresh actual pinned frozen model / longer cache / cold adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out separately pinned accepted integration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ec0d4a80e15f203a06c26ee9c23858f78976370b
          path: implementation
          persist-credentials: false
      - name: Refuse unexpected implementation commit or missing no-training gate
        run: |
          test "$(git -C implementation rev-parse HEAD)" = "ec0d4a80e15f203a06c26ee9c23858f78976370b"
          python3 - <<'PY'
          import json
          p=json.load(open("experiments/ncr-001/protocol.json"))
          assert p["train_authorized"] is False
          assert set(p["models"])=={"smollm2","sprocket_chat","sprocket_instruct","void1"}
          print("NCR-001E reviewer binds PR #83 implementation exactly; no model training")
          PY
      - name: Compile independent reviewer script
        run: |
          python3 -m py_compile scripts/ncr_001e_smol_fresh.py
      - name: Install CPU-only frozen host dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
          python3 -m pip install --disable-pip-version-check \
            "transformers==4.57.6" "huggingface_hub==0.36.2" \
            "safetensors==0.8.0" "sentencepiece>=0.2,<1"
      - name: Independently execute model/checkpoint/masks/KV-cache and cold adapter
        run: |
          python3 scripts/ncr_001e_smol_fresh.py
      - name: Preserve source-bound fresh run or partial failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr-001e-smol-fresh-frozen-cold-cache-a${{ github.run_attempt }}
          path: runtime/ncr-001/smol-independent-fresh.json
          if-no-files-found: warn
          retention-days: 30
