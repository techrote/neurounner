name: NCR-001F original adapter-only CPU ZIP and source custody (READ ONLY, NO MODEL)
on:
  push:
    branches: [review/ncr-001f-sprocket-real-mlp-20261027]
    paths:
      - ".github/workflows/ncr-001f-adapter-cpu-original-zip-bootstrap.yml"
      - "scripts/ncr_001f_sprocket_adapter_cpu_custody.py"
      - "tests/test_ncr_001f_sprocket_adapter_cpu_custody.py"
      - "experiments/ncr-001/controls-evidence/sprocket-adapter-cpu-microbench-20261029/**"
      - "docs/NCR_001_F_SPROCKET_ADAPTER_CPU_MICROBENCH.md"
      - "RAG.md"
permissions:
  contents: read
  actions: read
concurrency:
  group: ncr001f-cpu-original-archive-readonly
  cancel-in-progress: true
jobs:
  original-zip-readonly:
    if: github.repository == 'techrote/neurounner' && github.ref == 'refs/heads/review/ncr-001f-sprocket-real-mlp-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      DEST: experiments/ncr-001/controls-evidence/sprocket-adapter-cpu-microbench-20261029
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact checkout, frozen sources and original immutable ZIP blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "review/ncr-001f-sprocket-real-mlp-20261027"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = 14ce5fbaa38f8806c8c8738f19c01b91385eebaf
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = 59fff1aed872b5563aa6898171983973e0cdb02c
          test "$(git hash-object scripts/ncr_001_core.py)" = 0427ad0b0f1fc68199369d5094952017bc70f503
          test "$(git hash-object scripts/ncr_001f_controls.py)" = b4d486c6d9f8c8d37fd2205b0381db9ef4ae9c22
          git ls-files --error-unmatch "$DEST/original-actions-40867677298.zip"
          test "$(git hash-object "$DEST/original-actions-40867677298.zip")" = 38a428b1a0fae2c7b9163f200a2b83f37f369add
      - name: Re-download ORIGINAL GitHub artifact and independently byte-compare to committed Git object
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001f-original-zip-readonly
          curl -fSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/techrote/neurounner/actions/artifacts/12895070216/zip" \
            -o runtime/ncr001f-original-zip-readonly/redownloaded-original.zip
          cmp runtime/ncr001f-original-zip-readonly/redownloaded-original.zip "$DEST/original-actions-40867677298.zip"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          root=Path("experiments/ncr-001/controls-evidence/sprocket-adapter-cpu-microbench-20261029")
          raw=(root/"original-actions-40867677298.zip").read_bytes()
          assert len(raw)==5589
          assert hashlib.sha256(raw).hexdigest()=="d5bad11d2e28a6b40aa9717046464f9436a5e07ef800559f8044e494c826eea0"
          expected={
            "lscpu.txt":(3189,"4476e601951bb5e5dc85ca4b9d2e3bc795bb83c0d4e62b8d9f2bdec6659b0e7a"),
            "pip-freeze.txt":(1551,"ea4b616e5ccd392060001737203319bf998f7cc3308f775e18289b02a7ebe050"),
            "report.json":(5282,"efd79fb2419c7d8ee98e3b4be4d24bce79b74bc323858f644ed4bafb8603def4"),
            "runner.log":(307,"9adf3a63a06a7d7d6ad7c016b7365dc3a14ecb8c6d90832a341216075786807b"),
            "source-head.txt":(41,"f12bec081902a93826dc95c49bb7317814b99cc23589e385356ce815d8ad5b24"),
            "tests.log":(1718,"e45cffb4274d9135cd3cd7c1bb00331eba7831dc448d52a1c550288a74307eb2"),
            "uname.txt":(128,"a64b6d81308dc728b286592ae78f6594e185e6db8c474be3c8886f7694f38bb7")
          }
          with zipfile.ZipFile(root/"original-actions-40867677298.zip") as z:
            assert len(z.namelist())==len(expected)==len(set(z.namelist()))
            assert set(z.namelist())==set(expected)
            for name,(length,digest) in expected.items():
              b=z.read(name)
              assert len(b)==length and hashlib.sha256(b).hexdigest()==digest
            r=json.loads(z.read("report.json"))
            assert r["runner"]["github_sha"]=="1f44c775c392cea430457c86253c1f00deea4e70"
            assert r["status"]=="ADAPTER_ONLY_CPU_FORWARD_MICROBENCH__FROZEN_HOST_NOT_EXECUTED__NO_TRAIN"
            assert r["train_authorized"] is False and r["full_72_conformance_pass"] is False
            assert r["actual_matched_frozen_host_budget_pass"] is False
            assert r["frozen_model_inference_executed"] is False
          print("ORIGINAL-RAW-ACTIONS-ZIP-GIT-CUSTODY-VERIFIED__FULL_HOST_NOT_RUN")
          PY
      - name: Retain read-only original evidence verifier log and partial failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001f-original-cpu-zip-readonly
          path: runtime/ncr001f-original-zip-readonly/
          retention-days: 30
          if-no-files-found: warn
