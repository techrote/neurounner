name: Qwen2.5-Omni startup retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omni-startup-retry.yml'

permissions:
  contents: read
  actions: read

jobs:
  omni:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch runtime
        run: |
          python3 -m py_compile scripts/startup_smoke.py
          bash scripts/bootstrap.sh runtime
      - name: Resolve model
        id: model
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          s=json.load(open("config/candidates.json"))["qwen25-omni-7b"]
          print("url="+s["url"]); print("file="+s["file"]); print("sha256="+s["sha256"])
          PY
      - name: Download and verify
        env:
          MODEL_URL: ${{ steps.model.outputs.url }}
          MODEL_FILE: ${{ steps.model.outputs.file }}
          MODEL_SHA256: ${{ steps.model.outputs.sha256 }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 -o "$RUNNER_TEMP/$MODEL_FILE.part" "$MODEL_URL"
          echo "$MODEL_SHA256  $RUNNER_TEMP/$MODEL_FILE.part" | sha256sum -c -
          mv "$RUNNER_TEMP/$MODEL_FILE.part" "$RUNNER_TEMP/$MODEL_FILE"
          end=$(date +%s)
          echo "download_bytes=$(stat -c %s "$RUNNER_TEMP/$MODEL_FILE")"
          echo "download_seconds=$((end-start))"
      - name: Start server and smoke inference
        env:
          MODEL_FILE: ${{ steps.model.outputs.file }}
        run: python3 scripts/startup_smoke.py qwen25-omni-7b "$RUNNER_TEMP/$MODEL_FILE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: startup8-qwen25-omni-7b-retry
          path: |
            results/startup8-qwen25-omni-7b.json
            logs/startup8-qwen25-omni-7b.log
          if-no-files-found: warn
          retention-days: 7
