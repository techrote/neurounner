name: NCR-001E ONE-SHOT original masked-KV ZIP/full-log Git custody
on:
  push:
    branches: [review/ncr001e-void-poststep2048-masked-kv-custody-20261030]
    paths:
      - ".github/workflows/ncr-001-void-poststep2048-masked-kv-bootstrap-custody.yml"
permissions:
  contents: write
  actions: read
concurrency:
  group: ncr001-void-masked-kv-original-once
  cancel-in-progress: false
jobs:
  archive-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/ncr001e-void-poststep2048-masked-kv-custody-20261030
          persist-credentials: true
          fetch-depth: 0
      - name: Refuse source/ancestry/protocol or duplicate archive
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "techrote/neurounner"
          git merge-base --is-ancestor b3e9e6a05e007297de19f3955b59e2a9eb118996 HEAD
          test "$(git hash-object experiments/ncr-001/protocol.json)" = "14ce5fbaa38f8806c8c8738f19c01b91385eebaf"
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = "59fff1aed872b5563aa6898171983973e0cdb02c"
          test ! -e experiments/ncr-001/controls-evidence/void-poststep2048-masked-kv-20261030/manifest.json
      - name: Fetch and stage complete original Actions streams
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-void-masked-kv-custody-bootstrap
          python3 scripts/ncr_001_void_poststep2048_masked_kv_bootstrap_custody.py \
            2>&1 | tee runtime/ncr001-void-masked-kv-custody-bootstrap/archive.log
      - name: Commit only permanent exact original evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/ncr-001/controls-evidence/void-poststep2048-masked-kv-20261030/
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git diff --cached --name-only | grep -v '^experiments/ncr-001/controls-evidence/void-poststep2048-masked-kv-20261030/' && exit 1 || :
          git commit -m "NCR-001E: permanently preserve original poststep B2 masked-KV ZIPs/logs"
          git push origin HEAD:review/ncr001e-void-poststep2048-masked-kv-custody-20261030
      - name: Preserve bootstrap log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-void-masked-kv-original-bootstrap-a${{ github.run_attempt }}
          path: runtime/ncr001-void-masked-kv-custody-bootstrap/
          if-no-files-found: warn
          retention-days: 30
