name: DREAMGRAFT H26 original frozen-checkpoint replay (restricted gate)
on:
  pull_request:
    branches: [research/memplant-dg018-sequence-value-20261116]
    paths:
      - '.github/workflows/memplant-h26-frozen-replay-020.yml'
      - 'experiments/memplant/material_causal_gate_020/h26_git_custody_replay.py'
      - 'experiments/memplant/material_causal_gate_020/h26_original_checkpoints.py'
      - 'experiments/memplant/material_causal_gate_020/evidence/h22_capsule.part*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-frozen-h26:
    name: Exact-HEAD H26 genuine-donor & original-receiver replay
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout exact PR HEAD rather than synthetic merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert actual checked-out commit
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "Exact source: $EXPECTED_HEAD"
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: experiments/memplant/material_causal_gate_020/h26_git_custody_replay.py
      - name: Install pinned CPU-only neural replay libraries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install --disable-pip-version-check 'numpy==2.3.5'
          python - <<'PY'
          import sys,numpy,torch
          assert sys.version_info[:2] == (3,13),sys.version
          assert torch.__version__.startswith('2.10.0'),torch.__version__
          assert torch.version.cuda is None and not torch.cuda.is_available()
          assert numpy.__version__=='2.3.5',numpy.__version__
          PY
      - name: Assert all three original preregistered H26 checkpoint identities
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/memplant/material_causal_gate_020
          python - <<'PY'
          from h26_original_checkpoints import checkpoint_bytes
          import hashlib
          expected={
            26011639:'55427ff362e971603414ff2883cfe203a99fa5fe739c531042cff4477c6a8bd6',
            26011640:'dbc83bad61db889966bf233276dab6f817aa71ed316b19173384ff5cf7e8aff7',
            26011641:'d8b4c691cb3e490907036d8f9225f315102aee114e0270d60b262fdcc64338ad'}
          for seed,digest in expected.items():
              b=checkpoint_bytes(seed)
              assert len(b)==4029 and hashlib.sha256(b).hexdigest()==digest
          print('Exactly original H26 receiver serialized checkpoint bytes: 3/3')
          PY
      - name: Reconstruct H26 exposed worlds, replay genuine H21R donor features & original H26 receivers
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=10s 8m \
            python -B experiments/memplant/material_causal_gate_020/h26_git_custody_replay.py \
              --out "$RUNNER_TEMP/dg020-h26-replay"
          python - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'dg020-h26-replay/h26-ci-replay-report.json').read_text())
          assert r['status']=='PASS' and len(r['nonpooled_cells'])==30
          assert r['unique_worlds']==4800
          assert r['divergent_both_correct']==1920 and r['invariant_both_correct']==2880
          assert r['necessary_action_flips']==1920 and r['incorrect_invariant_flips']==0
          assert r['same_law_sham_changes']==0
          print('Retrospective frozen H26 PASS; no new prospective holdout or broad memory-transfer claim.')
          PY
      - name: Retain reconstructed raw decisions, logits, source identity and comparison receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dg020-h26-reconstructed-frozen-neural-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dg020-h26-replay/
          if-no-files-found: warn
          retention-days: 90
