name: NCR-001 Sprocket original wire shifted-loss/padding source replay (NO TRAIN)

on:
  pull_request:
    branches:
      - review/ncr001-sprocket-wire-fullmask-custody-20261028
    paths:
      - ".github/workflows/ncr-001-sprocket-wire-shifted-loss.yml"
      - "scripts/ncr_001_sprocket_wire_shifted_loss.py"
      - "tests/test_ncr_001_sprocket_wire_shifted_loss.py"
      - "docs/NCR_001_SPROCKET_WIRE_SHIFTED_LOSS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncr001-sprocket-wire-shift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NCR_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_PARENT_HEAD: 8ca28b8aa8c43f97795d1149a7563bee9444763b
  HF_HOME: /tmp/ncr001-sprocket-wire-shifted-tokenizer
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  original-source-and-shifted-mask:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact-head stacked source, immutable four-model pins, no-training gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_BASE_REF" = review/ncr001-sprocket-wire-fullmask-custody-20261028
          test "$(git rev-parse HEAD)" = "$NCR_EXPECTED_HEAD"
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_PARENT_HEAD"
          git merge-base --is-ancestor "$EXPECTED_PARENT_HEAD" "$NCR_EXPECTED_HEAD"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = 14ce5fbaa38f8806c8c8738f19c01b91385eebaf
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = 59fff1aed872b5563aa6898171983973e0cdb02c
          python3 - <<'PY'
          import json
          p=json.load(open("experiments/ncr-001/protocol.json"))
          q=json.load(open("experiments/ncr-001/source-pins.json"))
          names={"smollm2","sprocket_chat","sprocket_instruct","void1"}
          assert p["train_authorized"] is False
          assert set(p["models"])==set(q["models"])==names
          assert p["models"]["sprocket_chat"]["weight_file"]=="chat/model.safetensors"
          assert p["models"]["sprocket_instruct"]["weight_file"]=="model.safetensors"
          PY
      - name: Run offline fail-closed tests and original custody readback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-sprocket-wire-shifted-loss
          python3 -m py_compile scripts/ncr_001_sprocket_wire_shifted_loss.py tests/test_ncr_001_sprocket_wire_shifted_loss.py
          python3 -m unittest discover -s tests -p test_ncr_001_sprocket_wire_shifted_loss.py -v \
            2>&1 | tee runtime/ncr001-sprocket-wire-shifted-loss/source-tests.log
          python3 scripts/ncr_001_sprocket_wire_fullmask_custody.py \
            2>&1 | tee runtime/ncr001-sprocket-wire-shifted-loss/original-custody-readback.json
      - name: Install pinned tokenizer-only dependencies (no model weights)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            "transformers==4.57.6" "huggingface_hub==0.36.2" \
            "tokenizers==0.22.1" "safetensors==0.8.0" "sentencepiece>=0.2,<1" \
            2>&1 | tee runtime/ncr001-sprocket-wire-shifted-loss/install.log
      - name: Actual root tokenizer against original frozen-host tokens and causal targets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ncr_001_sprocket_wire_shifted_loss.py \
            2>&1 | tee runtime/ncr001-sprocket-wire-shifted-loss/real-tokenizer.log
      - name: Retain complete positive/negative logs and receipt even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-wire-shifted-loss-a${{ github.run_attempt }}
          path: runtime/ncr001-sprocket-wire-shifted-loss/
          if-no-files-found: warn
          retention-days: 30
