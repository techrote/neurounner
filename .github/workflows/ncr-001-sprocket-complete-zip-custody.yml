name: NCR-001 exact original Sprocket diagnostic ZIP custody (NO TRAIN)
on:
  pull_request:
    branches: [review/ncr001-sprocket-learning-original-readback-20261028]
    paths:
      - ".github/workflows/ncr-001-sprocket-complete-zip-custody.yml"
      - "scripts/ncr_001_sprocket_original_zip_custody.py"
      - "tests/test_ncr_001_sprocket_original_zip_custody.py"
      - "experiments/ncr-001/controls-evidence/sprocket-learning-20261028/**"
      - "docs/NCR_001_SPROCKET_COMPLETE_ORIGINAL_ZIPS.md"
      - "RAG.md"
permissions:
  contents: read
  actions: read
concurrency:
  group: ncr001-complete-original-zips-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-custody-readonly:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'techrote/neurounner' && github.event.pull_request.head.ref == 'review/ncr001-sprocket-complete-original-zips-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_PARENT: d168fa41ae35536e893a5bc548a7b21965c45999
      EVIDENCE: experiments/ncr-001/controls-evidence/sprocket-learning-20261028
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse unexpected source/protocol/parent or edited original evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "techrote/neurounner"
          test "$GITHUB_BASE_REF" = "review/ncr001-sprocket-learning-original-readback-20261028"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_PARENT"
          git merge-base --is-ancestor "$EXPECTED_PARENT" "$EXPECTED_HEAD"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = 14ce5fbaa38f8806c8c8738f19c01b91385eebaf
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = 59fff1aed872b5563aa6898171983973e0cdb02c
          test "$(git hash-object "$EVIDENCE/manifest.json")" = afd9fec5a60702ed6a99274470125e52f2c9c38c
          test "$(git hash-object "$EVIDENCE/actions-decoded/source-original-job-122892989282.log")" = 9c968cbed65ceaef92127d12dec8aaba74b7f181
          test "$(git hash-object "$EVIDENCE/actions-decoded/chat-original-job-122893504080.log")" = 20dd75820ed8fe7bb491a229321bc8b9d18fe9cf
          test "$(git hash-object "$EVIDENCE/actions-decoded/instruct-original-job-122893504180.log")" = a1bb8e45dcdeaf9f2fc8d984feed5de679231ef7
          test "$(git hash-object "$EVIDENCE/actions-decoded/initial-readback-formatter-hash-failure-job-122910071921.log")" = 8da1661f51dc2b682db2d012bb63983c13776965
          python3 - <<'PY'
          import json
          p=json.load(open("experiments/ncr-001/protocol.json"))
          assert p["train_authorized"] is False
          assert set(p["models"]) == {"smollm2","sprocket_chat","sprocket_instruct","void1"}
          PY
      - name: Audit three Git-preserved complete ZIPs and eight offline adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-complete-original-zips
          python3 -m py_compile scripts/ncr_001_sprocket_original_zip_custody.py tests/test_ncr_001_sprocket_original_zip_custody.py
          python3 scripts/ncr_001_sprocket_original_zip_custody.py | tee runtime/ncr001-complete-original-zips/audit.json
          python3 -m unittest discover -s tests -p test_ncr_001_sprocket_original_zip_custody.py -v 2>&1 | tee runtime/ncr001-complete-original-zips/adversarial-tests.log
      - name: Independently re-download exact originals and compare whole ZIP bytes
        shell: bash
        run: |
          set -euo pipefail
          for entry in source:12826525345 chat:12826246889 instruct:12825942600; do
            lane="${entry%%:*}"
            id="${entry##*:}"
            curl --retry 2 --connect-timeout 20 --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/techrote/neurounner/actions/artifacts/${id}/zip" \
              -o "runtime/ncr001-complete-original-zips/${lane}-original.zip"
          done
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import sys
          sys.path.insert(0,"scripts")
          import ncr_001_sprocket_original_zip_custody as c
          for lane in c.ORIGINALS:
              original=Path(f"runtime/ncr001-complete-original-zips/{lane}-original.zip").read_bytes()
              committed=base64.b64decode((c.EVIDENCE/c.b64_path(lane)).read_bytes().strip(),validate=True)
              assert original==committed, f"Original downloaded ZIP differs from committed bytes: {lane}"
              c.check_zip(lane,original)
              print("ORIGINAL_COMPLETE_ZIP_BYTE_COMPARISON_PASS",lane,len(original))
          PY
          test -z "$(git status --porcelain -- "$EVIDENCE")"
          echo "PASS_THREE_ORIGINAL_SPROCKET_ZIP_CONTAINERS__READ_ONLY__FINAL_72_BLOCKED"
      - name: Retain current audit and comparison records including failed jobs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-complete-original-zips-a${{ github.run_attempt }}
          path: runtime/ncr001-complete-original-zips/
          if-no-files-found: warn
          retention-days: 30
