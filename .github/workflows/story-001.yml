name: STORY-001 Sprocket autofactory memory

on:
  workflow_dispatch:
  push:
    branches:
      - story-001-autofactory-kickoff
    paths:
      - '.github/workflows/story-001.yml'
      - 'scripts/story_001.py'
      - 'experiments/story-001/**'
      - 'config/candidates.json'
      - 'datasets/README.md'
      - 'RAG.md'

permissions:
  contents: write
  actions: read

concurrency:
  group: neurounner-story-001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[story001-evidence]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Offline contract checks
        run: |
          python3 -m py_compile scripts/story_001.py
          python3 scripts/story_001.py --config experiments/story-001/config.json self-test
      - name: Record M0 local-runner preflight
        run: |
          python3 scripts/story_001.py \
            --config experiments/story-001/config.json \
            preflight --out results/story001
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: story001-preflight
          path: results/story001
          if-no-files-found: error
          retention-days: 14

  sprocket:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/neurounner
          key: ubuntu-neurounner-v1-b11852-edc2ac32-story001
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: story001-preflight
          path: results/story001
      - name: Fetch and verify pinned Sprocket runtime/model
        run: bash scripts/bootstrap.sh sprocket
      - name: Generate three independent Sprocket memory fragments
        run: |
          python3 scripts/story_001.py \
            --config experiments/story-001/config.json \
            sprocket --out results/story001
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: story001-sprocket
          path: results/story001
          if-no-files-found: error
          retention-days: 14

  local_models:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STORY001_RESUME_RUN_ID: '40240476201'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/neurounner
          key: ubuntu-neurounner-runtime-v1-b11852
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: story001-preflight
          path: results/story001

      - name: Recover latest M3/M4/M5 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/resume
          gh run download "${STORY001_RESUME_RUN_ID}"             --repo "${GITHUB_REPOSITORY}"             --name story001-complete-evidence             --dir results/resume
          test -f results/resume/local-models/derived/storyboard.md
          test -f results/resume/sprocket/summary.json
          test -f results/resume/local-models/raw/m3-normalize-01.json
          test -f results/resume/local-models/raw/m3-balance-3-part-08.json
          test -f results/resume/local-models/derived/draft.md
          test -f results/resume/local-models/derived/review.md
          test -f results/resume/local-models/derived/draft-sections/part-08.md

      - name: Fetch pinned llama.cpp runtime
        run: bash scripts/bootstrap.sh runtime

      - name: Resolve M5 planner and renderer pins
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          c=json.load(open("config/candidates.json"))
          for cid,prefix in (
              ("lfm25-8b-a1b","LFM8B"),
              ("qwen35-4b","QWEN35"),
          ):
              spec=c[cid]
              print(f"STORY001_{prefix}_URL={spec['url']}")
              print(f"STORY001_{prefix}_FILE={spec['file']}")
              print(f"STORY001_{prefix}_SHA={spec['sha256']}")
          PY

      - name: Download and SHA-verify LFM2.5-8B-A1B planner
        run: |
          mkdir -p "$RUNNER_TEMP/story001-models"
          dest="$RUNNER_TEMP/story001-models/$STORY001_LFM8B_FILE"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30             -o "$dest.part" "$STORY001_LFM8B_URL"
          echo "$STORY001_LFM8B_SHA  $dest.part" | sha256sum -c -
          mv "$dest.part" "$dest"
          echo "STORY001_LFM8B=$dest" >> "$GITHUB_ENV"

      - name: Download and SHA-verify Qwen3.5-4B renderer
        run: |
          mkdir -p "$RUNNER_TEMP/story001-models"
          dest="$RUNNER_TEMP/story001-models/$STORY001_QWEN35_FILE"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30             -o "$dest.part" "$STORY001_QWEN35_URL"
          echo "$STORY001_QWEN35_SHA  $dest.part" | sha256sum -c -
          mv "$dest.part" "$dest"
          echo "STORY001_QWEN35_4B=$dest" >> "$GITHUB_ENV"

      - name: Reuse qualified M3/M4 and perform planned bounded M5 edits
        run: |
          python3 scripts/story_001.py             --config experiments/story-001/config.json             provider --out results/story001 --resume-root results/resume

      - name: Show qualification metadata
        if: success()
        run: |
          python3 - <<'PY'
          import json
          q=json.load(open("results/story001/local-models/qualification.json"))
          print("run:",q["github_run_id"])
          print("recovered from:",q.get("recovered_from_run_id"))
          print("final stage:",q["final_stage"])
          print("words:",q["final_word_count"])
          print("word gate:",q["word_gate"])
          print("models:",q["models"])
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: story001-complete-evidence
          path: results/story001
          if-no-files-found: error
          retention-days: 14

  promote:
    needs: local_models
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: story001-complete-evidence
          path: results/story001
      - name: Promote durable archive and independently read back hashes
        run: |
          python3 scripts/story_001.py \
            --config experiments/story-001/config.json \
            promote --source results/story001 --dest datasets/story-001
          python3 - <<'PY'
          import json, pathlib
          m=json.load(open("datasets/story-001/manifest.json"))
          assert 2700 <= m["word_count"] <= 3300
          assert all(v.startswith("qualified") for v in m["milestones"].values())
          story=pathlib.Path("datasets/story-001/compiled/story.md")
          assert story.stat().st_size > 1000
          assert m.get("remote_provider_used") is False
          print("archive readback:",m["word_count"],m["final_story_sha256"])
          PY
      - name: Commit durable STORY-001 evidence
        run: |
          git config user.name "neurounner experiment bot"
          git config user.email "261801702+techrote@users.noreply.github.com"
          git add datasets/story-001
          git diff --cached --exit-code && {
            echo "No new STORY-001 evidence to commit."
            exit 0
          }
          git commit -m "Archive STORY-001 Sprocket/local-model evidence [story001-evidence]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Record workflow summary
        run: |
          {
            echo "## STORY-001"
            echo
            echo "Durable Sprocket/local-model evidence promoted to datasets/story-001."
            python3 - <<'PY'
          import json
          m=json.load(open("datasets/story-001/manifest.json"))
          print(f"- final words: {m['word_count']}")
          print(f"- final sha256: {m['final_story_sha256']}")
          print(f"- local models: {m['local_models']}")
          print(f"- milestones: {m['milestones']}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
