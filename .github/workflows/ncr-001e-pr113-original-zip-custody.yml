name: NCR-001E PR113 complete original ZIP and job-log custody (NO TRAIN)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ncr-001e-pr113-original-zip-custody.yml"
      - "scripts/ncr_001e_pr113_original_zip_custody.py"
      - "tests/test_ncr_001e_pr113_original_zip_custody.py"
      - "experiments/ncr-001/evidence-review/pr113-rightpad-generation/**"
      - "docs/NCR_001_PR113_ORIGINAL_ZIP_CUSTODY.md"
      - "RAG.md"
permissions:
  contents: read
  actions: read
concurrency:
  group: ncr-pr113-original-zip-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  original-artifact-readonly:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'techrote/neurounner' && github.event.pull_request.head.ref == 'review/ncr001-pr113-original-actions-custody-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_HEAD: a7391683478968301301959c100576b2a4cbf2a8
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EVIDENCE: experiments/ncr-001/evidence-review/pr113-rightpad-generation
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact-source checkout and immutable committed original ZIP/job bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "techrote/neurounner"
          test "$GITHUB_HEAD_REF" = "review/ncr001-pr113-original-actions-custody-20261029"
          test "$GITHUB_BASE_REF" = "main"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "${{ github.event.pull_request.base.sha }}" = "a4a4ac41fb164675430679ccfb4ca544b7772ab8"
          git merge-base --is-ancestor "$SOURCE_HEAD" "$EXPECTED_HEAD"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = 14ce5fbaa38f8806c8c8738f19c01b91385eebaf
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = 59fff1aed872b5563aa6898171983973e0cdb02c
          git ls-files --error-unmatch -- "$EVIDENCE/original-actions-40598034739.zip" "$EVIDENCE/original-actions-custody.json" "$EVIDENCE/original-source-job-122518832102.log" "$EVIDENCE/original-physical-job-122518920068.log" >/dev/null
          test "$(git hash-object "$EVIDENCE/original-actions-40598034739.zip")" = 6e231bf8cfc909bb943ab3807cc4d2b4f7ad5413
          test "$(git hash-object "$EVIDENCE/original-actions-custody.json")" = ecff0787c849428e788d3d8a2401792c2c8b12c2
          test "$(git hash-object "$EVIDENCE/original-source-job-122518832102.log")" = 072ad20c4be7622f31d252bf836e5e1ab26fc269
          test "$(git hash-object "$EVIDENCE/original-physical-job-122518920068.log")" = c8e2846a1539a4aaede774861c9a41429c1d6394
      - name: Independently re-download original physical Actions ZIP without rewriting archived bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/pr113-original
          curl --fail --show-error --silent --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/techrote/neurounner/actions/artifacts/12777685787/zip \
            -o runtime/pr113-original/original.zip
          python3 scripts/ncr_001e_pr113_original_zip_custody.py --verify-external-zip runtime/pr113-original/original.zip
          cmp runtime/pr113-original/original.zip "$EVIDENCE/original-actions-40598034739.zip"
          echo "IMMUTABLE_PR113_ORIGINAL_ACTIONS_ZIP__READ_ONLY"
      - name: Independently audit original member/decoded job bytes and adversarial tamper refusals
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ncr_001e_pr113_original_zip_custody.py tests/test_ncr_001e_pr113_original_zip_custody.py
          python3 -m unittest discover -s tests -p test_ncr_001e_pr113_original_zip_custody.py -v
          python3 scripts/ncr_001e_pr113_original_zip_custody.py
          git diff --exit-code
          git diff --cached --exit-code
      - name: Preserve read-only verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-pr113-original-zip-readonly-a${{ github.run_attempt }}
          path: runtime/pr113-original/
          retention-days: 30
          if-no-files-found: warn
