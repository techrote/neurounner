name: NCR-001 original frozen root CE ZIP and job-log custody (NO TRAIN)
on:
  pull_request:
    branches: [review/ncr001-root-instruct-native-masked-ce-20261028]
    paths:
      - ".github/workflows/ncr-001-root-native-ce-original-custody.yml"
      - "scripts/ncr_001_root_native_ce_original_custody.py"
      - "tests/test_ncr_001_root_native_ce_original_custody.py"
      - "experiments/ncr-001/controls-evidence/root-native-ce-20261029/**"
      - "docs/NCR_001_ROOT_NATIVE_CE_ORIGINAL_CUSTODY.md"
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: ncr001-native-original-archive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-original-source-and-custody:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'techrote/neurounner' && github.event.pull_request.head.ref == 'review/ncr001-root-native-ce-original-custody-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_ORIGINAL: 1178b896848df0984a0670180c62d6f8e9b9a512
      EVIDENCE: experiments/ncr-001/controls-evidence/root-native-ce-20261029
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Verify immutable source, official PR base and no-training four-lane protocol
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "techrote/neurounner"
          test "$GITHUB_HEAD_REF" = "review/ncr001-root-native-ce-original-custody-20261029"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_ORIGINAL"
          git merge-base --is-ancestor "$EXPECTED_ORIGINAL" "$SOURCE_HEAD"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = "14ce5fbaa38f8806c8c8738f19c01b91385eebaf"
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = "59fff1aed872b5563aa6898171983973e0cdb02c"
          test "$(git hash-object "$EVIDENCE/decoded-job-123178045642.log")" = "43ffa04c411f4672ed04c693cab5ece36a462f69"
          python3 - <<'PY'
          import json
          p=json.load(open("experiments/ncr-001/protocol.json"))
          assert p["train_authorized"] is False
          assert set(p["models"])=={"smollm2","sprocket_chat","sprocket_instruct","void1"}
          assert p["models"]["sprocket_chat"]["weight_file"]=="chat/model.safetensors"
          assert p["models"]["sprocket_instruct"]["weight_file"]=="model.safetensors"
          PY
      - name: Re-download the ORIGINAL GitHub Actions ZIP by artifact ID (never synthesize)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-root-original-custody
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/techrote/neurounner/actions/artifacts/12861059281/zip" \
            -o runtime/ncr001-root-original-custody/original-actions.zip
          test -s runtime/ncr001-root-original-custody/original-actions.zip
      - name: Stage fixed archive and verify original 6 ZIP members, CE, loss, model and negatives
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ncr_001_root_native_ce_original_custody.py tests/test_ncr_001_root_native_ce_original_custody.py
          python3 scripts/ncr_001_root_native_ce_original_custody.py \
            --stage runtime/ncr001-root-original-custody/original-actions.zip \
            2>&1 | tee runtime/ncr001-root-original-custody/staged-original.json
          python3 -m unittest discover -s tests -p test_ncr_001_root_native_ce_original_custody.py -v \
            2>&1 | tee runtime/ncr001-root-original-custody/negative-tests.log
          python3 scripts/ncr_001_root_native_ce_original_custody.py \
            2>&1 | tee runtime/ncr001-root-original-custody/verified-git-readback.json
      - name: Commit only the two new immutable original-archive files on this dedicated PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git add -- "$EVIDENCE/original-actions-zip.xz.base64" "$EVIDENCE/manifest.json"
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()
          approved={
            "experiments/ncr-001/controls-evidence/root-native-ce-20261029/original-actions-zip.xz.base64",
            "experiments/ncr-001/controls-evidence/root-native-ce-20261029/manifest.json",
          }
          assert set(paths)<=approved,paths
          PY
          if git diff --cached --quiet; then
            echo "PREVIOUS EXACT ORIGINAL ARCHIVE ALREADY COMMITTED"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "NCR-001E: permanently promote the original exact frozen-root native CE ZIP"
            git push origin HEAD:refs/heads/review/ncr001-root-native-ce-original-custody-20261029
          fi
      - name: Preserve original source, raw ZIP, positive and negative logs even upon failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-root-native-ce-original-custody-a${{ github.run_attempt }}
          path: runtime/ncr001-root-original-custody/
          if-no-files-found: warn
          retention-days: 30
