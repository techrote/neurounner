name: NCR-001 Sprocket postwarmup diagnostic reconciliation (NO TRAIN)
on:
  pull_request:
    branches: [review/ncr001-sprocket-learning-original-readback-20261028]
    paths:
      - "scripts/ncr_001_sprocket_postwarmup_reconcile.py"
      - "tests/test_ncr_001_sprocket_postwarmup_reconcile.py"
      - "docs/NCR_001_SPROCKET_POSTWARMUP_RECONCILIATION.md"
      - "RAG.md"
      - ".github/workflows/ncr-001-sprocket-postwarmup-reconcile.yml"
      - "experiments/ncr-001/controls-evidence/sprocket-learning-20261028/**"
      - "experiments/ncr-001/protocol.json"
      - "experiments/ncr-001/source-pins.json"
permissions:
  contents: read
concurrency:
  group: ncr001-postwarmup-reconcile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  reconcile-original:
    if: github.event.pull_request.head.repo.full_name == 'techrote/neurounner' && github.event.pull_request.head.ref == 'review/ncr001-sprocket-postwarmup-diag-reconciliation-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PARENT_HEAD: d168fa41ae35536e893a5bc548a7b21965c45999
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse changed source, protocol, evidence and stack
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "techrote/neurounner"
          test "$GITHUB_BASE_REF" = "review/ncr001-sprocket-learning-original-readback-20261028"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "${{ github.event.pull_request.base.sha }}" = "$PARENT_HEAD"
          git merge-base --is-ancestor "$PARENT_HEAD" "$EXPECTED_HEAD"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = 14ce5fbaa38f8806c8c8738f19c01b91385eebaf
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = 59fff1aed872b5563aa6898171983973e0cdb02c
          python3 - <<'PY'
          import json
          p=json.load(open("experiments/ncr-001/protocol.json"))
          assert p["train_authorized"] is False
          assert set(p["models"])=={"smollm2","sprocket_chat","sprocket_instruct","void1"}
          PY
      - name: Independently replay original postwarmup evidence only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ncr_001_sprocket_postwarmup_reconcile.py tests/test_ncr_001_sprocket_postwarmup_reconcile.py
          python3 scripts/ncr_001_sprocket_postwarmup_reconcile.py --output runtime/ncr-001/sprocket-postwarmup-diagnostic-reconciliation.json
          python3 -m unittest discover -s tests -p test_ncr_001_sprocket_postwarmup_reconcile.py -v 2>&1 | tee runtime/ncr-001/sprocket-postwarmup-negative-tests.log
          python3 - <<'PY'
          import json
          r=json.load(open("runtime/ncr-001/sprocket-postwarmup-diagnostic-reconciliation.json"))
          assert r["status"] == "BLOCKED_INDEPENDENT_FULL_72_SCIENTIFIC_ADJUDICATION__NO_TRAIN"
          assert set(r["lanes"]) == {"sprocket_chat","sprocket_instruct"}
          assert not any(r[key] for key in ("train_authorized","full_72_conformance_pass","comparative_nca_mlp_training","new_physical_model_execution","heldouts_opened"))
          assert r["new_optimizer_steps"] == 0
          assert all(x["full_72_per_model_gate"] is False for x in r["lanes"].values())
          print("PASS_SOURCE_BOUND_POSTWARMUP_RECONCILIATION__FINAL_72_BLOCKED")
          PY
      - name: Preserve generated diagnostic readback and test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-sprocket-postwarmup-reconciliation
          path: runtime/ncr-001/sprocket-postwarmup-*
          retention-days: 30
          if-no-files-found: warn
