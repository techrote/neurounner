name: MEMPLANT DREAMGRAFT-002 real two-rule imprint

on:
  pull_request:
    branches: [main, research/memplant-g1c-frozen-postcard-audit]
    paths:
      - '.github/workflows/memplant-dg002.yml'
      - 'experiments/memplant/dreamgraft002/**'
      - 'tests/test_memplant_dg002.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memplant-dg002-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_DOWNLOAD_TIMEOUT: '120'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'

jobs:
  donor:
    name: Real Qwen KV, hidden and token-embedding sources
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Syntax and synthetic counterfactual contracts
        run: |
          python3 -m py_compile experiments/memplant/dreamgraft002/*.py tests/test_memplant_dg002.py
          python3 -m experiments.memplant.dreamgraft002.source --help
      - name: Install pinned CPU model environment
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python3 -m pip install --disable-pip-version-check 'transformers==4.57.6' 'huggingface_hub>=0.36,<1' 'psutil>=7,<8' 'safetensors>=0.6,<1' 'numpy>=1.26,<3'
      - name: Torch gradient and likelihood regression checks
        run: python3 -m unittest discover -s tests -p 'test_memplant_dg002.py' -v
      - name: Read REAL Qwen K/V for all factorial worlds
        run: |
          mkdir -p runtime/memplant/dg002/source
          timeout --signal=INT --kill-after=15s 16m python3 -m experiments.memplant.dreamgraft002.source --out runtime/memplant/dg002/source
      - name: Retain donor source and provenance even if blocked
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: memplant-dg002-source-a${{ github.run_attempt }}
          path: runtime/memplant/dg002/source
          if-no-files-found: warn
          retention-days: 30

  prefixes:
    name: Four frozen-receiver native continuous prefix carriers
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned CPU receiver stack
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python3 -m pip install --disable-pip-version-check 'transformers==4.57.6' 'huggingface_hub>=0.36,<1' 'psutil>=7,<8' 'safetensors>=0.6,<1'
      - name: Optimize four target-native prefix states (no donor data)
        run: |
          mkdir -p runtime/memplant/dg002/prototypes
          timeout --signal=INT --kill-after=15s 16m python3 -m experiments.memplant.dreamgraft002.prefixes --out runtime/memplant/dg002/prototypes --updates 160
      - name: Preserve trained prefixes and all losses
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: memplant-dg002-prefixes-a${{ github.run_attempt }}
          path: runtime/memplant/dg002/prototypes
          if-no-files-found: warn
          retention-days: 30

  evaluate:
    name: Frozen B / ${{ matrix.method }} donor causal interventions
    needs: [donor, prefixes]
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    strategy:
      fail-fast: false
      matrix:
        method: [v, hidden, embedding]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned CPU receiver environment
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python3 -m pip install --disable-pip-version-check 'transformers==4.57.6' 'huggingface_hub>=0.36,<1' 'psutil>=7,<8' 'safetensors>=0.6,<1' 'numpy>=1.26,<3'
      - name: Recover exact source features
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memplant-dg002-source-a${{ github.run_attempt }}
          path: runtime/memplant/dg002/source
      - name: Recover exact recipient prototype carriers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memplant-dg002-prefixes-a${{ github.run_attempt }}
          path: runtime/memplant/dg002/prototypes
      - name: Test heat-only and vibration-only donor swaps
        run: |
          mkdir -p runtime/memplant/dg002/results/${{ matrix.method }}
          timeout --signal=INT --kill-after=15s 23m python3 -m experiments.memplant.dreamgraft002.evaluate \
            --method '${{ matrix.method }}' \
            --source runtime/memplant/dg002/source \
            --prefix runtime/memplant/dg002/prototypes \
            --out runtime/memplant/dg002/results/${{ matrix.method }}
      - name: Report all scored outcomes (including negative)
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          for p in Path('runtime/memplant/dg002/results').glob('*/report.json'):
              o=json.loads(p.read_text())
              a=o.get('evaluation') or {}
              print('METHOD',o.get('method'),'STATUS',o.get('status'),'ERROR',o.get('error'))
              print('RIDGE',(a.get('ridge') or {}).get('sealed'))
              print('SCORES',a.get('conditions'))
              print('SWAPS',{k:{s:v for s,v in row.items() if s!='paired'} for k,row in (a.get('paired_edits') or {}).items()})
          PY
      - name: Retain all raw predictions and generated artefacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: memplant-dg002-${{ matrix.method }}-a${{ github.run_attempt }}
          path: runtime/memplant/dg002/results/${{ matrix.method }}
          if-no-files-found: warn
          retention-days: 30
