name: NCR-001F four frozen-model source MAC and absent training-phase account (NO TRAIN)
on:
  push:
    branches: [review/ncr001f-fourlane-phase-budget-preflight-20261030]
    paths:
      - "scripts/ncr_001f_fourlane_phase_budget.py"
      - "tests/test_ncr_001f_fourlane_phase_budget.py"
      - "docs/NCR_001_F_FOURLANE_PHASE_BUDGET_PREFLIGHT.md"
      - ".github/workflows/ncr-001f-fourlane-phase-budget.yml"
      - "RAG.md"
  pull_request:
    branches: [review/ncr001f-corrected-samehost-budget-interpretation-20261030]
    paths:
      - "scripts/ncr_001f_fourlane_phase_budget.py"
      - "tests/test_ncr_001f_fourlane_phase_budget.py"
      - "docs/NCR_001_F_FOURLANE_PHASE_BUDGET_PREFLIGHT.md"
      - ".github/workflows/ncr-001f-fourlane-phase-budget.yml"
      - "RAG.md"
permissions:
  contents: read
concurrency:
  group: ncr001f-fourlane-source-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-custody-and-fourlane-source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact-head dependency and frozen source/fixture refusal
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 28353d042fe479589e04fc7a85fbc56a90fb7707 HEAD
          test "$(git hash-object experiments/ncr-001/protocol.json)" = 14ce5fbaa38f8806c8c8738f19c01b91385eebaf
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = 59fff1aed872b5563aa6898171983973e0cdb02c
          python3 - <<'PY'
          import subprocess
          allowed={
              "scripts/ncr_001f_fourlane_phase_budget.py",
              "tests/test_ncr_001f_fourlane_phase_budget.py",
              "docs/NCR_001_F_FOURLANE_PHASE_BUDGET_PREFLIGHT.md",
              ".github/workflows/ncr-001f-fourlane-phase-budget.yml",
              "RAG.md",
          }
          changed=set(subprocess.check_output([
              "git","diff","--name-only",
              "28353d042fe479589e04fc7a85fbc56a90fb7707","HEAD"
          ],text=True).splitlines())
          assert changed and changed <= allowed, changed
          print("PASS_ORIGINAL_PHYSICAL_ZIPS_LOGS_FOUR_MODEL_PROTOCOL_AND_FIXTURES_UNCHANGED")
          PY
      - name: Source-only original archive replay and four-model negative tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001f-fourlane-budget
          python3 -m py_compile scripts/ncr_001f_fourlane_phase_budget.py tests/test_ncr_001f_fourlane_phase_budget.py
          python3 -m unittest discover -s tests -p 'test_ncr_001f_fourlane_phase_budget.py' -v \
            2>&1 | tee runtime/ncr001f-fourlane-budget/tests.log
          python3 scripts/ncr_001f_fourlane_phase_budget.py \
            --out runtime/ncr001f-fourlane-budget/source-only-fourlane.json \
            2>&1 | tee runtime/ncr001f-fourlane-budget/audit.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("runtime/ncr001f-fourlane-budget/source-only-fourlane.json").read_text())
          assert r["status"]=="FOUR_LANE_SOURCE_MAC_ACCOUNT__ACTUAL_TRAINING_BUDGET_UNQUALIFIED"
          assert set(r["lanes"])=={"smollm2","sprocket_chat","sprocket_instruct","void1"}
          assert r["train_authorized"] is False
          assert r["full_72_conformance_pass"] is False
          assert r["actual_compute_budget_qualified"] is False
          assert r["no_actual_training_phase_receipts_present"] is True
          assert r["actual_optimizer_updates_in_this_run"] == 0
          assert r["original_physical_execution_in_this_run"] is False
          assert r["reported_source_mac_are_measured_flops"] is False
          print("PASS_SOURCE_ONLY_ACCOUNT__NO_MATCHED_TRAINING_COMPUTE_CLAIM")
          PY
      - name: Complete job/source environment evidence, including failures
        if: always()
        shell: bash
        run: |
          mkdir -p runtime/ncr001f-fourlane-budget
          git rev-parse HEAD > runtime/ncr001f-fourlane-budget/head.txt
          uname -a > runtime/ncr001f-fourlane-budget/host.txt
          python3 --version > runtime/ncr001f-fourlane-budget/python.txt 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ncr001f-fourlane-source-account-original-custody
          path: runtime/ncr001f-fourlane-budget/
          retention-days: 30
          if-no-files-found: warn
