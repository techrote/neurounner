name: NCR-001D frozen Sprocket Chat hook qualification

on:
  pull_request:
    branches: [main, research/ncr-001b-pure-torch-core]
    paths:
      - ".github/workflows/ncr-001d.yml"
      - "scripts/ncr_001_sprocket_chat.py"
      - "scripts/ncr_001d_sprocket_chat_preflight.py"
      - "tests/test_ncr_001_sprocket_chat.py"
      - "scripts/ncr_001_core.py"
      - "experiments/ncr-001/protocol.json"
      - "experiments/ncr-001/source-pins.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neurounner-ncr-001d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: /tmp/ncr-001d-hf
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  frozen-hook-toy:
    name: Local hook lifecycle + frozen toy gradients
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned CPU torch
        run: |
          python3 -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
      - name: Compile and test hook lifecycle without external model
        run: |
          python3 -m py_compile scripts/ncr_001_core.py \
            scripts/ncr_001_sprocket_chat.py scripts/ncr_001d_sprocket_chat_preflight.py \
            tests/test_ncr_001_sprocket_chat.py
          python3 -m unittest discover -s tests -p "test_ncr_001_sprocket_chat.py" -v

      - name: Independently check promoted Chat raw source evidence
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("experiments/ncr-001/sprocket-chat-preflight")
          receipt=root/"receipt.json"
          provenance=json.loads((root/"provenance.json").read_text())
          actual=hashlib.sha256(receipt.read_bytes()).hexdigest()
          expected=provenance["source_run"]["original_report_sha256"]
          assert actual==expected,(actual,expected)
          d=json.loads(receipt.read_text())
          assert d["status"]=="PASS_PRELIMINARY_SOURCE_BOUND_SPROCKET_CHAT_HOOK_CONFORMANCE"
          assert d["model_variant"]=="chat"
          assert d["weight_path"]=="chat/model.safetensors"
          assert d["optimizer_steps"]==0 and not d["model_training_performed"]
          assert d["source_files"]["chat/model.safetensors"]["sha256"]==provenance["model"]["actual_full_safetensors_sha256"]
          assert d["checks"]["nonzero_nca_full_vs_incremental_cache"]["close"] is True
          print("NCR Chat original source SHA verified",actual)
          PY

  pinned-real-model:
    name: Pinned frozen 500M checkpoint + KV-cache prepass
    needs: frozen-hook-toy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact training-precedent CPU model stack
        run: |
          python3 -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
          python3 -m pip install --disable-pip-version-check \
            "transformers==4.57.6" "huggingface_hub==0.36.2" \
            "safetensors==0.8.0" "sentencepiece>=0.2,<1"
      - name: Pin files, prove zero-init parity and run no-train decoder conformance
        run: |
          python3 scripts/ncr_001d_sprocket_chat_preflight.py
      - name: Preserve partial or successful independent source receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr-001d-sprocket-chat-source-conformance-a${{ github.run_attempt }}
          path: runtime/ncr-001/sprocket-chat-preflight.json
          if-no-files-found: warn
          retention-days: 30
