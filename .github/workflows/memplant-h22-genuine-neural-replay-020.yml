name: DREAMGRAFT H22 genuine frozen-checkpoint replay (sealed evidence)
on:
  pull_request:
    branches: [research/memplant-dg018-sequence-value-20261116]
    paths:
      - '.github/workflows/memplant-h22-genuine-neural-replay-020.yml'
      - 'experiments/memplant/material_causal_gate_020/h22_compact_reproduce.py'
      - 'experiments/memplant/material_causal_gate_020/h22_posthoc_additive_margin_audit.py'
      - 'experiments/memplant/material_causal_gate_020/evidence/h22_capsule.part*'
      - 'experiments/memplant/material_causal_gate_020/H22_COMPACT_REPLAY_CAPSULE_2026-11-18.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-frozen-h22:
    name: Exact-HEAD H22 original genuine neural replay
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout exact PR HEAD, not synthetic merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "Exact source: $EXPECTED_HEAD"
      - name: Set pinned Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: experiments/memplant/material_causal_gate_020/h22_compact_reproduce.py
      - name: Install pinned CPU-only neural checkpoint dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install --disable-pip-version-check 'numpy==2.3.5'
          python - <<'PY'
          import sys, numpy, torch
          assert sys.version_info[:2] == (3,13), sys.version
          assert torch.__version__.startswith('2.10.0'), torch.__version__
          assert torch.version.cuda is None and not torch.cuda.is_available(), torch.__version__
          assert numpy.__version__ == '2.3.5', numpy.__version__
          print('Frozen environment:',sys.version,torch.__version__,numpy.__version__)
          PY
      - name: Reassemble sealed exact original 4,240,821-byte capsule from Git-tracked chunks
        shell: bash
        env:
          CAPSULE: ${{ runner.temp }}/DG020-H22-exact-original-capsule.zip
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          root = Path('experiments/memplant/material_causal_gate_020/evidence')
          parts = sorted(root.glob('h22_capsule.part??'))
          expected = [root / f'h22_capsule.part{i:02d}' for i in range(11)]
          assert parts == expected, 'missing, reordered, or extra evidence chunk'
          out = Path(os.environ['CAPSULE'])
          with out.open('wb') as target:
              for i, part in enumerate(parts):
                  raw = part.read_bytes()
                  assert len(raw) == (393216 if i < 10 else 308661), (part, len(raw))
                  target.write(raw)
          assert out.stat().st_size == 4240821, 'wrong original capsule length'
          sha = hashlib.sha256(out.read_bytes()).hexdigest()
          assert sha == '47546540b96ae0800697e8a729c169e1191f111cec8c09f704c99a8843568667', sha
          print('H22 original byte-identical archive:',sha,'size:',out.stat().st_size)
          PY
      - name: Replay all original genuine donors and frozen receivers; verify 4,800 pairs and 30 cell verdicts
        shell: bash
        env:
          CAPSULE: ${{ runner.temp }}/DG020-H22-exact-original-capsule.zip
          REPORT: ${{ runner.temp }}/DG020-H22-exact-HEAD-genuine-neural-replay.json
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=10s 7m \
            python -B experiments/memplant/material_causal_gate_020/h22_compact_reproduce.py "$CAPSULE" | tee "$REPORT"
          python - <<'PY'
          import json, os
          r=json.load(open(os.environ['REPORT']))
          assert r['archive_sha256']=='47546540b96ae0800697e8a729c169e1191f111cec8c09f704c99a8843568667'
          assert r['H22_original_evidence_hashes']==31
          assert r['replayed_counterfactual_pairs']==4800
          assert r['acceptance_cells_passed']==30
          assert r['wrong_invariant_flips_retained']==3
          assert r['neural_logit_max_abs_drift'] <= 0.00005
          assert r['scientific_verdict_original_replayed']=='PASS'
          print('Scientific boundary: replays original restricted H22 PASS; NOT a new prospective experiment.')
          PY
      - name: Replay additive-law margin diagnostic (post-hoc, original FAIL retained)
        shell: bash
        env:
          CAPSULE: ${{ runner.temp }}/DG020-H22-exact-original-capsule.zip
          DIAG: ${{ runner.temp }}/DG020-H22-posthoc-additive-margin.json
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=10s 7m \
            python -B experiments/memplant/material_causal_gate_020/h22_posthoc_additive_margin_audit.py \
              --capsule "$CAPSULE" --out "$DIAG"
          python - <<'PY'
          import json, os
          r=json.load(open(os.environ['DIAG']))
          assert r['status']=='POSTHOC_DIAGNOSTIC_ONLY'
          assert r['scientific_verdict_original']=='PASS_30_OF_30_UNCHANGED'
          assert r['diagnostic_verdict']=='FAIL_STRICT_ADDITIVE_ADVANTAGE_INVARIANCE'
          assert r['receipt_pairs']==4800 and r['cells']==30
          assert r['original_invariant_wrong_action_flips']==3
          assert r['max_neural_logit_drift'] <= 0.00005
          assert r['equal_wet_abs_spurious_law_response']['n']==960
          assert r['equal_wet_response_above_1e_4']==317
          assert r['exact_cost_diagnostic']['action_disagreements_from_original']==0
          print('Post-hoc residual failure preserved. No prospective scientific upgrade.')
          PY
      - name: Preserve exact-HEAD replay receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dg020-h22-exact-head-neural-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/DG020-H22-exact-HEAD-genuine-neural-replay.json
            ${{ runner.temp }}/DG020-H22-posthoc-additive-margin.json
          if-no-files-found: warn
          retention-days: 90
