name: NCR-001E original PR102 whole Actions ZIP and source TAR custody (NO TRAIN)
on:
  pull_request:
    branches: [review/ncr-001e-sprocket-publisher-wire-20261027]
    paths:
      - ".github/workflows/ncr-001e-pr102-original-zip-custody.yml"
      - "scripts/ncr_001e_pr102_original_zip_custody.py"
      - "tests/test_ncr_001e_pr102_original_zip_custody.py"
      - "experiments/ncr-001/evidence-review/pr102-publisher-original/**"
      - "docs/NCR_001_PR102_ORIGINAL_ZIP_CUSTODY.md"
      - "RAG.md"
permissions:
  contents: write # One-time original bytes bootstrap only; REVOKE after original ZIP/TAR/job enter Git.
  actions: read
concurrency:
  group: ncr-pr102-zip-custody-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  archive-bootstrap:
    if: github.event.pull_request.head.repo.full_name == 'techrote/neurounner' && github.event.pull_request.head.ref == 'review/ncr001-pr102-original-zip-source-custody-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      SOURCE_BASE: 3592841802d85c442ca2521479b5d8795bee7233
      DEST: experiments/ncr-001/evidence-review/pr102-publisher-original
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true # bootstrap only, remove after original bytes committed.
      - name: Fail closed on branch/base/protocol/source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "techrote/neurounner"
          test "$GITHUB_HEAD_REF" = "review/ncr001-pr102-original-zip-source-custody-20261029"
          test "$GITHUB_BASE_REF" = "review/ncr-001e-sprocket-publisher-wire-20261027"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "${{ github.event.pull_request.base.sha }}" = "$SOURCE_BASE"
          git merge-base --is-ancestor "$SOURCE_BASE" "$EXPECTED_HEAD"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = 14ce5fbaa38f8806c8c8738f19c01b91385eebaf
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = 59fff1aed872b5563aa6898171983973e0cdb02c
          test ! -f "$DEST/original-actions-40573188117.zip" || { echo "Already bootstrapped; revoke write capability"; exit 1; }
      - name: Retrieve and verify original complete Actions archive and decoded job log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/pr102-source "$DEST"
          curl -fSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/techrote/neurounner/actions/artifacts/12766071456/zip -o runtime/pr102-source/original.zip
          curl -fSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/techrote/neurounner/actions/jobs/122432551094/logs -o runtime/pr102-source/original-job.log
          python3 scripts/ncr_001e_pr102_original_zip_custody.py --verify-external-zip runtime/pr102-source/original.zip --extract-source-tar runtime/pr102-source/original-source-snapshot.tar.gz --verify-job runtime/pr102-source/original-job.log
          test "$(git hash-object runtime/pr102-source/original.zip)" = 4a54a61b56ad0dc326082a157974c0737f28a294
          test "$(git hash-object runtime/pr102-source/original-source-snapshot.tar.gz)" = f56ae18f10afbe1ae87f579f422ba8d302a8d25a
          cp runtime/pr102-source/original.zip "$DEST/original-actions-40573188117.zip"
          cp runtime/pr102-source/original-source-snapshot.tar.gz "$DEST/original-source-snapshot-40573188117.tar.gz"
          cp runtime/pr102-source/original-job.log "$DEST/original-job-122432551094.log"
      - name: Commit ONLY original immutable evidence bytes to this descendant PR
        shell: bash
        run: |
          set -euo pipefail
          git add -- "$DEST/original-actions-40573188117.zip" "$DEST/original-source-snapshot-40573188117.tar.gz" "$DEST/original-job-122432551094.log"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "NCR-001E: byte-preserve original PR102 ZIP, source TAR and decoded host log"
          git push origin HEAD:refs/heads/review/ncr001-pr102-original-zip-source-custody-20261029
          echo "BOOTSTRAP_ONLY__ORIGINAL_BYTES_COMMITTED__REVOKE_WRITE_AND_PIN_LOG_BLOB_NEXT"
