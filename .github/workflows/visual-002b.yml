name: Visual suite 002b cache-isolated retest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-002b.yml'

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        id: [d1-3b-q4, qwen3-vl-2b-q4, qwen3-vl-4b-q4, lfm25-vl-450m-q4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare runtime
        run: |
          python3 -m py_compile scripts/eval_wave_002.py
          bash scripts/bootstrap.sh runtime
      - name: Resolve model files
        id: model
        env:
          MODEL_ID: ${{ matrix.id }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          s=json.load(open("experiments/eval-wave-002/models.json"))[os.environ["MODEL_ID"]]
          for k in ("model_url","model_file","model_sha256","mmproj_url","mmproj_file","mmproj_sha256"):
              print(k+"="+str(s.get(k,"")))
          PY
      - name: Download and verify model
        env:
          URL: ${{ steps.model.outputs.model_url }}
          FILE: ${{ steps.model.outputs.model_file }}
          SHA: ${{ steps.model.outputs.model_sha256 }}
        run: |
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$FILE" "$URL"
          echo "$SHA  $RUNNER_TEMP/$FILE" | sha256sum -c -
      - name: Download and verify projector
        env:
          URL: ${{ steps.model.outputs.mmproj_url }}
          FILE: ${{ steps.model.outputs.mmproj_file }}
          SHA: ${{ steps.model.outputs.mmproj_sha256 }}
        run: |
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$FILE" "$URL"
          echo "$SHA  $RUNNER_TEMP/$FILE" | sha256sum -c -
      - name: Run cache-isolated visual suite
        env:
          MODEL_FILE: ${{ steps.model.outputs.model_file }}
          MMPROJ_FILE: ${{ steps.model.outputs.mmproj_file }}
        run: python3 scripts/eval_wave_002.py visual "${{ matrix.id }}" "$RUNNER_TEMP/$MODEL_FILE" "$RUNNER_TEMP/$MMPROJ_FILE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: visual002b-${{ matrix.id }}
          path: |
            results/wave002-${{ matrix.id }}.json
            logs/wave002-*
          if-no-files-found: warn
          retention-days: 7
