name: DREAMGRAFT H22 archive contract (not scientific replay)
on:
  pull_request:
    branches: [research/memplant-dg018-sequence-value-20261116]
    paths:
      - '.github/workflows/memplant-h22-archive-contract-020.yml'
      - 'experiments/memplant/material_causal_gate_020/h22_bundle_reproduce.py'
      - 'experiments/memplant/material_causal_gate_020/test_h22_bundle_reproduce.py'

permissions:
  contents: read

jobs:
  archive-contract:
    name: H22 sealed-bundle safety tests only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check exact checked-out PR source identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$EXPECTED_HEAD" ]; then
            test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          fi
          git rev-parse HEAD
      - name: Exercise fail-closed archive safety and provenance contract
        run: |
          python3 -B -m unittest discover -v \
            -s experiments/memplant/material_causal_gate_020 \
            -p test_h22_bundle_reproduce.py
      - name: Define qualification boundary
        run: |
          echo 'PASS means only that stdlib archive harness contract tests passed.'
          echo 'It does NOT mean the H22 donor/receiver checkpoints were replayed.'
          echo 'H22 true evidence custody and pinned exact-HEAD neural reproduction remain pending.'
