name: NCR-001 bounded original Sprocket diagnostic source and ZIP integration
on:
  push:
    branches: [integration/merge-down-foundations-20261029]
    paths: [.github/workflows/merge-down-foundations-20261029.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: ncr-001-sprocket-diagnostic-merge-down-20261029
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  BASE_SHA: 71239a4c134636f11d1d75920220029b18d0f057
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 71239a4c134636f11d1d75920220029b18d0f057
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact CPU synthetic source stack; do not load frozen models
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
          python3 -m pip install --disable-pip-version-check "transformers==4.57.6" "huggingface_hub==0.36.2" "safetensors==0.8.0" "sentencepiece>=0.2,<1"
          python3 -c 'import torch,transformers; assert torch.__version__=="2.14.1+cpu" and transformers.__version__=="4.57.6" and not torch.cuda.is_available()'
      - name: Compose three exact original PR sources and replay six original receipt members
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'Read-only original diagnostic source reviewer'
          git config user.email 'source-reviewer@example.invalid'
          mkdir -p "$RUNNER_TEMP/ncr-diagnostic-merge-down"
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,subprocess,sys,urllib.request,zipfile
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ncr-diagnostic-merge-down'
          def cmd(argv,name,fail=True):
              p=subprocess.run(argv,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              (out/name).write_text(p.stdout)
              print(name,p.returncode,p.stdout,flush=True)
              if fail and p.returncode:raise RuntimeError(f'{name}: status={p.returncode}')
              return p
          def api(path):
              req=urllib.request.Request('https://api.github.com/repos/techrote/neurounner'+path,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=45) as response:return json.load(response)
          plan=[(159,'df8479aae34550cba014d910a73e30e59cd493e2'),
                (160,'d168fa41ae35536e893a5bc548a7b21965c45999'),
                (195,'fc0df287a1b13ad0ca92513196c6cd66325ec981')]
          assert api('/branches/main')['commit']['sha']==os.environ['BASE_SHA'],'main moved'
          assert cmd(['git','rev-parse','HEAD'],'current-main.txt').stdout.strip()==os.environ['BASE_SHA']
          for number,head in plan:
              pr=api('/pulls/'+str(number))
              assert pr['state']=='open' and pr['head']['sha']==head,(number,pr['head']['sha'])
              (out/f'{number}-pr.json').write_text(json.dumps({'head':head,'base':pr['base']['ref'],'draft':pr['draft']},indent=2)+'\n')
          stages=[]
          for number,head in plan:
              result=cmd(['git','merge','--no-ff','--no-commit',head],f'{number}-merge.log',fail=False)
              conflicts=cmd(['git','diff','--name-only','--diff-filter=U'],f'{number}-conflicts.txt').stdout.splitlines()
              if conflicts==['RAG.md']:
                  ours=cmd(['git','show','HEAD:RAG.md'],f'{number}-rag-current.md').stdout
                  theirs=cmd(['git','show','MERGE_HEAD:RAG.md'],f'{number}-rag-original.md').stdout
                  new=[l for l in theirs.splitlines() if l.startswith('- **[NCR-001E ') and l not in ours]
                  assert len(new)==1,(number,new)
                  pathlib.Path('RAG.md').write_text(ours.rstrip()+'\n'+new[0]+'\n',encoding='utf-8')
                  cmd(['git','add','RAG.md'],f'{number}-rag-resolved.log')
              elif conflicts or result.returncode:
                  raise RuntimeError(f'Unreviewed merge conflict {number}: {conflicts}')
              # Original Actions logs / evidence text are immutable, including historical whitespace.
              cmd(['git','diff','--cached','--check','--','.',':(exclude,glob)**/*.md',':(exclude,glob)**/*.log'],f'{number}-nonarchive-whitespace.log')
              cmd(['git','commit','--no-edit'],f'{number}-merge-commit.log')
              tree=cmd(['git','rev-parse','HEAD^{tree}'],f'{number}-tree.txt').stdout.strip()
              (out/f'{number}-RAG.md').write_bytes(pathlib.Path('RAG.md').read_bytes())
              files=api(f'/pulls/{number}/files?per_page=100')
              for item in files:
                  path=item['filename']
                  if path=='RAG.md':continue
                  actual=cmd(['git','rev-parse','HEAD:'+path],f'{number}-blob-current.txt').stdout.strip()
                  original=cmd(['git','rev-parse',head+':'+path],f'{number}-blob-original.txt').stdout.strip()
                  assert actual==original,(number,path,'original source byte drift')
              env=dict(os.environ,PYTHONPATH=str(pathlib.Path('scripts').resolve()))
              def test(argv,label):
                  p=subprocess.run(argv,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,env=env,text=True)
                  (out/label).write_text(p.stdout)
                  print(label,p.returncode,p.stdout,flush=True)
                  if p.returncode:raise RuntimeError(f'{label}: failed')
              for pattern in ('test_ncr_001_sprocket_learning_gate.py','test_ncr_001_cross_decoder_lease.py'):
                  test([sys.executable,'-m','unittest','discover','-s','tests','-p',pattern,'-v'],f'{number}-{pattern}.log')
              if number>=160:
                  test([sys.executable,'scripts/ncr_001_sprocket_learning_git_custody.py'],f'{number}-original-six-member-audit.json')
              if number==195:
                  test([sys.executable,'scripts/ncr_001_sprocket_original_zip_custody.py'],f'{number}-original-full-zip-audit.json')
                  test([sys.executable,'-m','unittest','discover','-s','tests','-p','test_ncr_001_sprocket_original_zip_custody.py','-v'],f'{number}-9-adversarial-original-zip-tests.log')
                  import ncr_001_sprocket_original_zip_custody as audit
                  from ncr_001_sprocket_learning_git_custody import load_archive
                  _,original_members=load_archive()
                  metadata={r['id']:r for r in api('/actions/runs/40710171622/artifacts?per_page=100')['artifacts']}
                  class StripAuth(urllib.request.HTTPRedirectHandler):
                      def redirect_request(self,request,fp,code,msg,headers,newurl):
                          r=super().redirect_request(request,fp,code,msg,headers,newurl)
                          if r is not None:r.remove_header('Authorization')
                          return r
                  opener=urllib.request.build_opener(StripAuth())
                  verified={}
                  for lane,(artifact_id,size,expected,members) in audit.ORIGINALS.items():
                      orig=metadata[artifact_id]
                      assert not orig['expired'] and orig['workflow_run']['head_sha']==plan[0][1]
                      assert orig['digest']=='sha256:'+expected and orig['size_in_bytes']==size
                      req=urllib.request.Request('https://api.github.com/repos/techrote/neurounner/actions/artifacts/'+str(artifact_id)+'/zip',
                           headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
                      with opener.open(req,timeout=90) as response:raw=response.read(100000)
                      assert len(raw)==size and hashlib.sha256(raw).hexdigest()==expected,lane
                      assert audit.check_zip(lane,raw)==original_members[lane],lane
                      encoded=(audit.EVIDENCE / audit.b64_path(lane)).read_bytes()
                      import base64
                      assert base64.b64decode(encoded.strip(),validate=True)==raw
                      verified[lane]={'artifact_id':artifact_id,'whole_sha256':expected,'bytes':size,'members':sorted(members)}
                  (out/'original-zip-api-readback.json').write_text(json.dumps(verified,indent=2)+'\n')
              assert json.loads(pathlib.Path('experiments/ncr-001/protocol.json').read_text())['train_authorized'] is False
              stages.append({'pr':number,'head':head,'integration_tree':tree,
                  'source_and_original_evidence_blobs_unchanged':True,'training_authorized':False})
              (out/'stages.json').write_text(json.dumps(stages,indent=2)+'\n')
          test([sys.executable,'-m','unittest','discover','-s','tests','-p','test_ncr_001*.py','-v'],'complete-ncr-tests.log')
          test([sys.executable,'scripts/ncr_001_protocol.py','validate'],'protocol-validation.json')
          print('FINAL SOURCE TREE:',stages[-1]['integration_tree'])
          print('NO REAL FROZEN MODELS LOADED; NO NEW OPTIMIZER STEP; NO HELDOUT/COMPARISON')
          PY
      - name: Preserve original source, complete ZIPs, negative tests and exact staged Git trees
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr-original-diagnostic-merge-down-${{ github.run_id }}
          path: ${{ runner.temp }}/ncr-diagnostic-merge-down
          if-no-files-found: warn
          retention-days: 30
