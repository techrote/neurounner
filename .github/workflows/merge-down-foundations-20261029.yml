name: NCR-001 merge-down current-main source snapshot
on:
  push:
    branches: [integration/merge-down-foundations-20261029]
    paths: [.github/workflows/merge-down-foundations-20261029.yml]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ncr-merge-down-source-20261029
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2c4b89600c1de087e9a5658adc12dcedcc2fcd64
          fetch-depth: 0
          persist-credentials: false
      - name: Pin source refs and create read-only history bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ncr-merge-source"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "2c4b89600c1de087e9a5658adc12dcedcc2fcd64"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "2c4b89600c1de087e9a5658adc12dcedcc2fcd64"
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ncr-merge-source'
          nums=(83,84,85,86,89,95,96,151,153,154,155)
          rows={}
          for n in nums:
              r=urllib.request.Request(f'https://api.github.com/repos/techrote/neurounner/pulls/{n}',headers={
                'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(r,timeout=30) as response:p=json.load(response)
              assert p['state']=='open',n
              rows[n]={'head':p['head']['sha'],'base':p['base']['ref'],'draft':p['draft'],'mergeable':p['mergeable']}
          (out/'heads.json').write_text(json.dumps(rows,indent=2)+'\n')
          print(json.dumps(rows,indent=2))
          PY
          git for-each-ref --format='%(refname) %(objectname)' > "$RUNNER_TEMP/ncr-merge-source/refs.txt"
          git bundle create "$RUNNER_TEMP/ncr-merge-source/source.bundle" --all
          git bundle verify "$RUNNER_TEMP/ncr-merge-source/source.bundle"
          (cd "$RUNNER_TEMP/ncr-merge-source" && sha256sum source.bundle > SHA256SUMS)
      - name: Retain exact source bundle and branch heads
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr-merge-source-${{ github.run_id }}
          path: ${{ runner.temp }}/ncr-merge-source
          if-no-files-found: warn
          retention-days: 30
