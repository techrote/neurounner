name: Merge-down foundations 2026-10-29 (read-only)

on:
  push:
    branches: [integration/merge-down-foundations-20261029]
    paths: [.github/workflows/merge-down-foundations-20261029.yml]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merge-down-foundations-20261029
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  BASE_SHA: d7317379a3de925c3be3a2758f5da85fc2b80f1d

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read exact current-main baseline and public Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d7317379a3de925c3be3a2758f5da85fc2b80f1d
          fetch-depth: 0
          persist-credentials: false

      - name: Bind current main, original PR heads, reviews and source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/merge-down-source"
          mkdir -p "$out"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'merge-down-source'
          root = 'https://api.github.com/repos/techrote/neurounner'
          def read(path):
              request = urllib.request.Request(root + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)
          plan = [(77, 'a1b41c358d215974ea9ef2748baa13c3872b0fbb'),
                  (82, '815dadd101a66e07fb6c3df5bf65af7bfe30ceef')]
          main = read('/branches/main')
          assert main['commit']['sha'] == os.environ['BASE_SHA'], 'Main moved; re-audit'
          (out / 'main-before.json').write_text(json.dumps(main, indent=2) + '\n')
          opened = []
          page = 1
          while True:
              rows = read(f'/pulls?state=open&per_page=100&page={page}')
              opened.extend(rows)
              if len(rows) < 100:
                  break
              page += 1
          (out / 'open-pulls.json').write_text(json.dumps(opened, indent=2) + '\n')
          for number, expected in plan:
              pr = read(f'/pulls/{number}')
              assert pr['state'] == 'open' and pr['head']['sha'] == expected, (number, pr['head']['sha'])
              (out / f'pr-{number}.json').write_text(json.dumps(pr, indent=2) + '\n')
              for suffix in ('reviews', 'comments'):
                  rows = []
                  page = 1
                  while True:
                      batch = read(f'/pulls/{number}/{suffix}?per_page=100&page={page}')
                      rows.extend(batch)
                      if len(batch) < 100:
                          break
                      page += 1
                  (out / f'pr-{number}-{suffix}.json').write_text(json.dumps(rows, indent=2) + '\n')
          (out / 'plan.json').write_text(json.dumps({'base': os.environ['BASE_SHA'], 'heads': plan,
              'repository_writes': False, 'model_loading': False, 'scientific_admission': False}, indent=2) + '\n')
          print('Frozen integration plan:', plan, 'open PRs:', len(opened))
          PY
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.txt"
          git bundle create "$out/source.bundle" --all HEAD
          git bundle verify "$out/source.bundle"
          (cd "$out" && sha256sum source.bundle > SHA256SUMS)

      - name: Export source for same-run independent source inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: merge-down-source-${{ github.run_id }}
          path: ${{ runner.temp }}/merge-down-source
          if-no-files-found: error
          retention-days: 30

      - name: Install existing pinned synthetic CPU test dependency (no models)
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.1+cpu'
          python3 -c 'import torch; assert torch.__version__ == "2.14.1+cpu"; assert not torch.cuda.is_available(); print(torch.__version__)'

      - name: Merge existing foundations locally and test each resulting tree
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/merge-down-validation"
          mkdir -p "$out"
          git config user.name 'Read-only integration validation'
          git config user.email 'integration-validation@example.invalid'
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'merge-down-validation'
          plan = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'merge-down-source/plan.json').read_text())
          def run(args, name):
              result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              (out / name).write_text(result.stdout)
              print(result.stdout, flush=True)
              if result.returncode:
                  raise RuntimeError(f'{name}: exit {result.returncode}')
              return result.stdout.strip()
          stages = []
          try:
              for number, head in plan['heads']:
                  run(['git', 'merge', '--no-ff', '--no-edit', head], f'{number}-merge.log')
                  tree = run(['git', 'rev-parse', 'HEAD^{tree}'], f'{number}-tree.txt')
                  run(['git', 'diff', '--check', 'HEAD^1', 'HEAD'], f'{number}-diff-check.log')
                  run([sys.executable, 'scripts/ncr_001_protocol.py', 'validate'], f'{number}-protocol.json')
                  run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_ncr_001_protocol.py', '-v'], f'{number}-protocol-tests.log')
                  if number == 82:
                      run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_ncr_001_core.py', '-v'], f'{number}-core-tests.log')
                  source = {}
                  for name in ('experiments/ncr-001/protocol.json', 'experiments/ncr-001/source-pins.json', 'scripts/ncr_001_protocol.py', 'scripts/ncr_001_core.py'):
                      path = pathlib.Path(name)
                      if path.exists():
                          source[name] = hashlib.sha256(path.read_bytes()).hexdigest()
                  stages.append({'pr': number, 'original_head': head, 'integration_tree': tree, 'passed': True, 'sha256': source})
                  (out / 'stages.json').write_text(json.dumps(stages, indent=2) + '\n')
          except Exception:
              (out / 'failure-status.txt').write_text(subprocess.run(['git', 'status', '--porcelain'], capture_output=True, text=True).stdout)
              (out / 'failure-diff.txt').write_text(subprocess.run(['git', 'diff', '--cc'], capture_output=True, text=True).stdout)
              raise
          print('SOURCE INTEGRATION ONLY; no model loading, heldout evaluation, comparative training, or scientific admission.')
          PY

      - name: Retain integration success or failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: merge-down-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/merge-down-validation
          if-no-files-found: warn
          retention-days: 30
