name: Merge-down foundations 2026-10-29 (read-only)
on:
  push:
    branches: [integration/merge-down-foundations-20261029]
    paths: [.github/workflows/merge-down-foundations-20261029.yml]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: merge-down-foundations-20261029
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  BASE_SHA: 547c28bc6d16d306ef16a655e87fc8adff72ecce
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 547c28bc6d16d306ef16a655e87fc8adff72ecce
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned CPU test dependency without model libraries
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.1+cpu'
          python3 -c 'import torch; assert torch.__version__ == "2.14.1+cpu"; assert not torch.cuda.is_available()'
      - name: Verify current main and accepted head, then validate integrated archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'Read-only integration validation'
          git config user.email 'integration-validation@example.invalid'
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'merge-down-validation'
          out.mkdir()
          def run(args, name):
              p = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              (out / name).write_text(p.stdout)
              print(p.stdout, flush=True)
              if p.returncode:
                  raise RuntimeError(f'{name}: exit {p.returncode}')
              return p.stdout.strip()
          def read(path):
              r = urllib.request.Request('https://api.github.com/repos/techrote/neurounner' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(r, timeout=45) as response:
                  return json.load(response)
          head = '8a285193003627d83ab7938845f2714da852d528'
          main = read('/branches/main')
          assert main['commit']['sha'] == os.environ['BASE_SHA'], 'Main moved: re-audit'
          pr = read('/pulls/44')
          assert pr['state'] == 'open' and pr['head']['sha'] == head, 'PR moved: re-audit'
          (out / 'main-before.json').write_text(json.dumps(main, indent=2) + '\n')
          (out / '44-pr.json').write_text(json.dumps(pr, indent=2) + '\n')
          run(['git', 'merge', '--no-ff', '--no-edit', head], '44-merge.log')
          tree = run(['git', 'rev-parse', 'HEAD^{tree}'], '44-tree.txt')
          assert tree == 'e840da2d606a967d853830c67e908454a5a701a3', tree
          # Preserve archived Markdown's intentional two-space hard breaks.
          # Other files, including all source, workflows and JSON, retain whitespace checks.
          run(['git', 'diff', '--check', 'HEAD^1', 'HEAD', '--', '.', ':(exclude)*.md'], '44-nonmarkdown-diff-check.log')
          run([sys.executable, 'scripts/ncr_001_protocol.py', 'validate'], 'protocol.json')
          for group in ('ncr_001', 'detective_001', 'detective_005'):
              run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-p', f'test_{group}*.py', '-v'], f'{group}-tests.log')
          run([sys.executable, 'scripts/verify_story_001_v2.py'], '44-archive-verification.log')
          for variant in ('story_001', 'story_001_v2'):
              directory = variant.replace('_', '-')
              run([sys.executable, f'scripts/{variant}.py', '--config', f'experiments/{directory}/config.json', 'self-test'], f'44-{variant}-selftest.log')
          run([sys.executable, 'scripts/ncr_001f_plan.py', '--out', str(out / 'control-plan.json')], 'plan.log')
          run([sys.executable, 'scripts/ncr_001e_readback.py', '--out', str(out / 'readback.json')], 'readback.log')
          checks = [(out / 'control-plan.json', pathlib.Path('experiments/ncr-001/controls-evidence/provenance.json')),
                    (out / 'readback.json', pathlib.Path('experiments/ncr-001/evidence-review/audit-provenance.json'))]
          for report, source in checks:
              assert hashlib.sha256(report.read_bytes()).hexdigest() == json.loads(source.read_text())['source']['original_uncompressed_report_sha256']
          assert json.loads(pathlib.Path('experiments/ncr-001/protocol.json').read_text())['train_authorized'] is False
          (out / 'accepted.json').write_text(json.dumps({'pr': 44, 'head': head, 'base': os.environ['BASE_SHA'], 'tree': tree, 'passed': True, 'models_loaded': 0, 'provider_calls': 0}, indent=2) + '\n')
          print('No model loading, provider calls, comparative training, repository writes or scientific admission.')
          PY
      - name: Preserve success and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: merge-down-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/merge-down-validation
          if-no-files-found: warn
          retention-days: 30
