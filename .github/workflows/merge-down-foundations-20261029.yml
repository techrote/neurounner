name: Merge-down foundations 2026-10-29 (read-only)

on:
  push:
    branches: [integration/merge-down-foundations-20261029]
    paths: [.github/workflows/merge-down-foundations-20261029.yml]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merge-down-foundations-20261029
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  BASE_SHA: d9a9f5ee40f3601ff57087fc4fa1f66d1429a319

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d9a9f5ee40f3601ff57087fc4fa1f66d1429a319
          fetch-depth: 0
          persist-credentials: false
      - name: Install repository-pinned CPU test dependency, no model libraries
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.1+cpu'
          python3 -c 'import torch; assert torch.__version__ == "2.14.1+cpu"; assert not torch.cuda.is_available(); print(torch.__version__)'
      - name: Verify live heads and test each merged tree without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'Read-only integration validation'
          git config user.email 'integration-validation@example.invalid'
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'merge-down-validation'
          out.mkdir()
          def run(args, name):
              p = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              (out / name).write_text(p.stdout)
              print(p.stdout, flush=True)
              if p.returncode:
                  raise RuntimeError(f'{name}: exit {p.returncode}')
              return p.stdout.strip()
          def read(path):
              r = urllib.request.Request('https://api.github.com/repos/techrote/neurounner' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(r, timeout=45) as response:
                  return json.load(response)
          plan = [(88, '1f5919120f25545a812941c882566aa8b35d8ce9', '41a5f3df2bc7c9251bd81ae2f1976d0b11a0397f'),
                  (174, '3db74bd0bae6a9a64c3e3c69cfcae1c60b86ae0f', '9939e3d2a27ac731bcba1269b5ce73a9099fa1ec'),
                  (44, '8a285193003627d83ab7938845f2714da852d528', 'e840da2d606a967d853830c67e908454a5a701a3')]
          main = read('/branches/main')
          assert main['commit']['sha'] == os.environ['BASE_SHA'], 'Main moved: re-audit'
          (out / 'main-before.json').write_text(json.dumps(main, indent=2) + '\n')
          stages = []
          for number, head, expected_tree in plan:
              pr = read(f'/pulls/{number}')
              assert pr['state'] == 'open' and pr['head']['sha'] == head, 'PR moved: re-audit'
              (out / f'{number}-pr.json').write_text(json.dumps(pr, indent=2) + '\n')
              run(['git', 'merge', '--no-ff', '--no-edit', head], f'{number}-merge.log')
              tree = run(['git', 'rev-parse', 'HEAD^{tree}'], f'{number}-tree.txt')
              assert tree == expected_tree, (tree, expected_tree)
              run(['git', 'diff', '--check', 'HEAD^1', 'HEAD'], f'{number}-diff-check.log')
              run([sys.executable, 'scripts/ncr_001_protocol.py', 'validate'], f'{number}-protocol.json')
              for group in ('ncr_001', 'detective_001', 'detective_005'):
                  run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-p', f'test_{group}*.py', '-v'], f'{number}-{group}-tests.log')
              run([sys.executable, 'scripts/ncr_001f_plan.py', '--out', str(out / f'{number}-control-plan.json')], f'{number}-plan.log')
              run([sys.executable, 'scripts/ncr_001e_readback.py', '--out', str(out / f'{number}-readback.json')], f'{number}-readback.log')
              checks = [(out / f'{number}-control-plan.json', pathlib.Path('experiments/ncr-001/controls-evidence/provenance.json')),
                        (out / f'{number}-readback.json', pathlib.Path('experiments/ncr-001/evidence-review/audit-provenance.json'))]
              hashes = {}
              for report, source in checks:
                  got = hashlib.sha256(report.read_bytes()).hexdigest()
                  expected = json.loads(source.read_text())['source']['original_uncompressed_report_sha256']
                  assert got == expected, (report, got, expected)
                  hashes[report.name] = got
              if number == 44:
                  run([sys.executable, 'scripts/verify_story_001_v2.py'], '44-archive-verification.log')
                  for variant in ('story_001', 'story_001_v2'):
                      directory = variant.replace('_', '-')
                      run([sys.executable, f'scripts/{variant}.py', '--config', f'experiments/{directory}/config.json', 'self-test'], f'44-{variant}-selftest.log')
              stages.append({'pr': number, 'head': head, 'integration_tree': tree, 'passed': True, 'original_report_sha256': hashes})
              (out / 'stages.json').write_text(json.dumps(stages, indent=2) + '\n')
          assert json.loads(pathlib.Path('experiments/ncr-001/protocol.json').read_text())['train_authorized'] is False
          print('No model loading, heldout evaluation, comparative training, provider calls, repository writes or scientific admission.')
          PY
      - name: Preserve success and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: merge-down-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/merge-down-validation
          if-no-files-found: warn
          retention-days: 30
