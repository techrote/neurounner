name: VILLAGE-001 population preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/VILLAGE_001_CYBERGOBLIN_FOUNDRY.md'
      - 'experiments/village-001/**'
      - 'scripts/village_001_manifest.py'
      - '.github/workflows/village-001-preflight.yml'
      - 'RAG.md'
      - 'README.md'

permissions:
  contents: read

jobs:
  population-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Compile Python helper
        run: python3 -m py_compile scripts/village_001_manifest.py

      - name: Build and validate canonical member manifest
        run: |
          python3 scripts/village_001_manifest.py \
            --config experiments/village-001/config.json \
            --out /tmp/village-001-members.json \
            --check-sources

      - name: Verify population cardinality and identities
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest=json.loads(Path("/tmp/village-001-members.json").read_text())
          members=manifest["members"]
          ids=[x["member_id"] for x in members]
          seeds=[x["seed"] for x in members]

          assert manifest["member_count"] == 36
          assert manifest["expected_members"] == 36
          assert len(ids) == len(set(ids)) == 36
          assert len(seeds) == len(set(seeds)) == 36
          assert {x["lineage"] for x in members} == {f"G{i:02d}" for i in range(1,13)}
          assert {x["sibling"] for x in members} == {"A","B","C"}

          for lineage in sorted({x["lineage"] for x in members}):
              siblings={x["sibling"] for x in members if x["lineage"] == lineage}
              assert siblings == {"A","B","C"}, (lineage,siblings)

          print("member contract:",manifest["member_contract_sha256"])
          print("members:",len(members))
          print("unique seeds:",len(set(seeds)))
          PY
