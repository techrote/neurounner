name: NCR-001F corrected original CPU ZIP and log read-only custody (NO MODEL)
on:
  push:
    branches: [review/ncr001f-corrected-cpu-custody-20261029]
    paths:
      - ".github/workflows/ncr001f-corrected-cpu-archival-bootstrap.yml"
      - "scripts/ncr_001f_corrected_cpu_original_custody.py"
      - "tests/test_ncr_001f_corrected_cpu_original_custody.py"
      - "docs/NCR_001_F_CORRECTED_CPU_ORIGINAL_CUSTODY.md"
      - "experiments/ncr-001/controls-evidence/sprocket-adapter-cpu-corrected-20261029/**"
      - "RAG.md"
permissions:
  contents: read
  actions: read
concurrency:
  group: ncr001f-corrected-cpu-readonly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-custody-readonly:
    if: github.repository == 'techrote/neurounner' && github.ref == 'refs/heads/review/ncr001f-corrected-cpu-custody-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      DEST: experiments/ncr-001/controls-evidence/sprocket-adapter-cpu-corrected-20261029
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify actual exact-head checkout, four-lane immutable authority and Git object custody
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001f-corrected-cpu-readonly
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor c8139cc36b1105f6bcafd585b766ff470e8c9e1d HEAD
          test "$(git hash-object experiments/ncr-001/protocol.json)" = 14ce5fbaa38f8806c8c8738f19c01b91385eebaf
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = 59fff1aed872b5563aa6898171983973e0cdb02c
          test "$(git hash-object scripts/ncr_001_core.py)" = 0427ad0b0f1fc68199369d5094952017bc70f503
          test "$(git hash-object scripts/ncr_001f_controls.py)" = b4d486c6d9f8c8d37fd2205b0381db9ef4ae9c22
          git ls-files --error-unmatch "$DEST/original-actions-40870764754.zip" "$DEST/original-job-123436909436.log" "$DEST/original-corrected-cpu-provenance.json"
          test "$(git hash-object "$DEST/original-actions-40870764754.zip")" = c5f449fcf05df8c576ef10d25f1bada44655f2a8
          test "$(git hash-object "$DEST/original-job-123436909436.log")" = 669c7c73322673aef51c6929cf3ac961150a7d7c
          test "$(git hash-object "$DEST/original-corrected-cpu-provenance.json")" = 900b4053851d354862998d2dc73f0b92040cd838
          echo "SOURCE_AND_ALL_ORIGINAL_ARCHIVE_GIT_BLOBS_PINNED"
      - name: Run independent stdlib-only auditor and twelve adversarial/positive tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ncr_001f_corrected_cpu_original_custody.py tests/test_ncr_001f_corrected_cpu_original_custody.py
          python3 -m unittest discover -s tests -p test_ncr_001f_corrected_cpu_original_custody.py -v 2>&1 | tee runtime/ncr001f-corrected-cpu-readonly/tests.log
          python3 scripts/ncr_001f_corrected_cpu_original_custody.py | tee runtime/ncr001f-corrected-cpu-readonly/audit.json
          python3 - <<'PY'
          import json
          r=json.load(open("runtime/ncr001f-corrected-cpu-readonly/audit.json"))
          assert r["status"]=="PASS_ORIGINAL_CORRECTED_CPU_ZIP_AND_JOB_GIT_CUSTODY__MODEL_HOST_BLOCKED"
          assert r["original_run"]==40870764754 and r["members"]==7
          assert r["zip_git_blob"]=="c5f449fcf05df8c576ef10d25f1bada44655f2a8"
          assert r["decoded_job_log_git_blob"]=="669c7c73322673aef51c6929cf3ac961150a7d7c"
          assert r["train_authorized"] is False and r["full_72_conformance_pass"] is False
          assert r["actual_matched_frozen_host_budget_pass"] is False and r["optimizer_steps"]==0
          print("ORIGINAL_CORRECTED_SYNTHETIC_CPU_GIT_CUSTODY_PASS__FROZEN_HOST_NOT_TESTED")
          PY
      - name: Independently re-download original GitHub ZIP and decoded Actions job log while available
        shell: bash
        run: |
          set -euo pipefail
          curl -fSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/techrote/neurounner/actions/artifacts/12896225909/zip" -o runtime/ncr001f-corrected-cpu-readonly/redownloaded-original.zip
          cmp runtime/ncr001f-corrected-cpu-readonly/redownloaded-original.zip "$DEST/original-actions-40870764754.zip"
          curl -fSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/techrote/neurounner/actions/jobs/123436909436/logs" -o runtime/ncr001f-corrected-cpu-readonly/redownloaded-original.log
          cmp runtime/ncr001f-corrected-cpu-readonly/redownloaded-original.log "$DEST/original-job-123436909436.log"
          echo "ORIGINAL_WHOLE_ZIP_AND_DECODED_LOG_REDOWNLOAD_BYTE_IDENTICAL"
      - name: Retain auditor and negative-check logs on pass or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001f-corrected-cpu-original-readonly-qualification
          path: |
            runtime/ncr001f-corrected-cpu-readonly/tests.log
            runtime/ncr001f-corrected-cpu-readonly/audit.json
          retention-days: 30
          if-no-files-found: warn
