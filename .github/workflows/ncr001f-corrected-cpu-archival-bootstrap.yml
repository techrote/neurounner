name: NCR-001F corrected CPU original ZIP and job-log archival bootstrap (NO MODEL)
on:
  push:
    branches: [review/ncr001f-corrected-cpu-custody-20261029]
    paths:
      - ".github/workflows/ncr001f-corrected-cpu-archival-bootstrap.yml"
permissions:
  contents: write
  actions: read
concurrency:
  group: ncr001f-corrected-cpu-archival-bootstrap
  cancel-in-progress: false
jobs:
  archive-original:
    if: github.repository == 'techrote/neurounner' && github.ref == 'refs/heads/review/ncr001f-corrected-cpu-custody-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      DEST: experiments/ncr-001/controls-evidence/sprocket-adapter-cpu-corrected-20261029
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify source, original identifier, and exclusive archival branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "review/ncr001f-corrected-cpu-custody-20261029"
          git merge-base --is-ancestor c8139cc36b1105f6bcafd585b766ff470e8c9e1d HEAD
          test "$(git hash-object experiments/ncr-001/protocol.json)" = 14ce5fbaa38f8806c8c8738f19c01b91385eebaf
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = 59fff1aed872b5563aa6898171983973e0cdb02c
          test ! -e "$DEST/original-actions-40870764754.zip"
          test ! -e "$DEST/original-job-123436909436.log"
          mkdir -p "$DEST"
      - name: Download original Actions artifact and complete decoded job log, never reconstruct originals
        shell: bash
        run: |
          set -euo pipefail
          curl -fSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/techrote/neurounner/actions/artifacts/12896225909/zip" -o "$DEST/original-actions-40870764754.zip"
          curl -fSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/techrote/neurounner/actions/jobs/123436909436/logs" -o "$DEST/original-job-123436909436.log"
          python3 - <<'PY'
          import hashlib,zipfile,json
          from pathlib import Path
          p=Path("experiments/ncr-001/controls-evidence/sprocket-adapter-cpu-corrected-20261029")
          data=(p/"original-actions-40870764754.zip").read_bytes()
          assert len(data)==5696
          assert hashlib.sha256(data).hexdigest()=="fe1b04341ee5792ab316f7199fa2052163fb3fdc11241c5fe2e046012404f8c8"
          expected={"lscpu.txt":"4476e601951bb5e5dc85ca4b9d2e3bc795bb83c0d4e62b8d9f2bdec6659b0e7a","pip-freeze.txt":"ea4b616e5ccd392060001737203319bf998f7cc3308f775e18289b02a7ebe050","report.json":"ca89f5a6ab30ca857e0b97f54b7888229406ea74ec49ed277b49089acdb247a1","runner.log":"9adf3a63a06a7d7d6ad7c016b7365dc3a14ecb8c6d90832a341216075786807b","source-head.txt":"7a69d71287b66d1a59a457fcb78e61fa63178ff5672939a8d69e2b49cad8c937","tests.log":"0e040b2d63a985db15853730498636955a23f437856d9f85a1dfa4c54e99b7a2","uname.txt":"a64b6d81308dc728b286592ae78f6594e185e6db8c474be3c8886f7694f38bb7"}
          with zipfile.ZipFile(p/"original-actions-40870764754.zip") as z:
            names=z.namelist()
            assert len(names)==len(set(names))==7 and set(names)==set(expected)
            for name,digest in expected.items():
              assert hashlib.sha256(z.read(name)).hexdigest()==digest,name
            report=json.loads(z.read("report.json"))
          assert report["runner"]["github_sha"]=="c8139cc36b1105f6bcafd585b766ff470e8c9e1d"
          assert report["runner"]["github_run_id"]=="40870764754"
          assert report["train_authorized"] is False and report["full_72_conformance_pass"] is False
          assert report["frozen_model_inference_executed"] is False and report["optimizer_steps"]==0
          assert all(not c["timed_interval_includes_noop_or_finite_checks"] and c["warmup_and_postflight_noop_state_checks"] for c in report["synthetic_cases"])
          log=(p/"original-job-123436909436.log").read_bytes()
          assert len(log)>10000 and b"ADAPTER_ONLY_MEASURED__REAL_MODEL_BUDGET_UNQUALIFIED__NO_TRAIN" in log
          assert b"Ran 9 tests" in log and b"Failed to initialize NumPy: No module named" in log
          print("ORIGINAL_CORRECTED_CPU_ZIP_AND_DECODED_JOB_LOG_VERIFIED")
          PY
          git hash-object "$DEST/original-actions-40870764754.zip"
          git hash-object "$DEST/original-job-123436909436.log"
          sha256sum "$DEST/original-actions-40870764754.zip" "$DEST/original-job-123436909436.log"
      - name: Commit only original archive and complete original log to descendant branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DEST/original-actions-40870764754.zip" "$DEST/original-job-123436909436.log"
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "archive(ncr001f): preserve corrected original CPU ZIP and decoded host log"
          git push origin HEAD:refs/heads/review/ncr001f-corrected-cpu-custody-20261029
      - name: Preserve initial bootstrap failure details
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001f-corrected-cpu-archive-bootstrap-failure
          path: experiments/ncr-001/controls-evidence/sprocket-adapter-cpu-corrected-20261029/
          if-no-files-found: ignore
          retention-days: 30
