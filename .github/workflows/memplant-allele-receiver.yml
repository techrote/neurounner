name: MEMPLANT Counterfactual Allele -> frozen SmolLM2 recipient

on:
  pull_request:
    branches: [main, research/memplant-dg002-two-rule-transplant]
    paths:
      - '.github/workflows/memplant-allele-receiver.yml'
      - 'experiments/memplant/allele_receiver/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: memplant-recipient-allele-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_DOWNLOAD_TIMEOUT: '120'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'

jobs:
  recipient_allele:
    name: Real Qwen V additive edits survive frozen SmolLM2 native-prefix compilation?
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Syntax and immutable experiment contract
        run: |
          python3 -m py_compile experiments/memplant/allele_receiver/experiment.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('experiments/memplant/allele_receiver/experiment.py').read_text()
          assert 'new_training_updates":0' in s
          assert 'previously_inspected' in s
          assert 'source-state arithmetic' in s
          print('Frozen donor/recipient edit path, no optimisation')
          PY
      - name: Install pinned 1.7B CPU receiver stack
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python3 -m pip install --disable-pip-version-check \
            'transformers==4.57.6' 'huggingface_hub>=0.36,<1' 'psutil>=7,<8' \
            'safetensors>=0.6,<1' 'numpy>=1.26,<3'
      - name: Download genuine DG002 Qwen source state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memplant-dg002-source-a1
          repository: techrote/neurounner
          run-id: 43736088404
          github-token: ${{ github.token }}
          path: runtime/memplant/allele-b/source
      - name: Download unchanged four native SmolLM2 prefix carriers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memplant-dg002-prefixes-a1
          repository: techrote/neurounner
          run-id: 43736088404
          github-token: ${{ github.token }}
          path: runtime/memplant/allele-b/prefixes
      - name: Recipient readback of latent-only heat/vibration state edits
        run: |
          mkdir -p runtime/memplant/allele-b
          timeout --signal=INT --kill-after=15s 19m python3 -m experiments.memplant.allele_receiver.experiment \
            --source runtime/memplant/allele-b/source \
            --prefixes runtime/memplant/allele-b/prefixes \
            --out runtime/memplant/allele-b/report.json
      - name: Report all raw counts and negative controls
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('runtime/memplant/allele-b/report.json')
          if not p.exists():
              print('BLOCKED: no report written')
          else:
              x=json.loads(p.read_text())
              print('STATUS',x.get('status'),'COMPLETED CASES',x.get('completed_cases'))
              print('COUNTS',x.get('summary'))
              print('ERROR',x.get('error'))
          PY
      - name: Retain complete receiver edit evidence even if incomplete
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: memplant-recipient-allele-a${{ github.run_attempt }}
          path: runtime/memplant/allele-b/report.json
          if-no-files-found: warn
          retention-days: 30
