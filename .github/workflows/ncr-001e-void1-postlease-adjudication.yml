name: NCR-001E void1 postlease deterministic #72 adjudication

on:
  pull_request:
    branches: [review/ncr001-void-postlease-maxctx-original-custody-20261028]
    paths:
      - ".github/workflows/ncr-001e-void1-postlease-adjudication.yml"
      - "scripts/ncr_001e_void1_postlease_adjudication.py"
      - "scripts/ncr_001_void_postlease_original_audit.py"
      - "scripts/ncr_001_void_postlease_maxctx_original_audit.py"
      - "tests/test_ncr_001e_void1_postlease_adjudication.py"
      - "experiments/ncr-001/adjudication/void1-postlease-pretrain.json"
      - "experiments/ncr-001/controls-evidence/void-postlease-20261028/**"
      - "experiments/ncr-001/controls-evidence/void-postlease-maxctx-20261028/**"
      - "docs/NCR_001_E_VOID1_POSTLEASE_ADJUDICATION.md"
      - "experiments/ncr-001/protocol.json"
      - "experiments/ncr-001/source-pins.json"
      - "RAG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-postlease-adjudication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Refuse protocol, lane, source or training drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = "14ce5fbaa38f8806c8c8738f19c01b91385eebaf"
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = "59fff1aed872b5563aa6898171983973e0cdb02c"
          python3 - <<'PY'
          import json
          p=json.load(open("experiments/ncr-001/protocol.json"))
          s=json.load(open("experiments/ncr-001/source-pins.json"))
          assert p["train_authorized"] is False
          assert set(p["models"]) == set(s["models"]) == {"smollm2","sprocket_chat","sprocket_instruct","void1"}
          assert p["models"]["void1"]["revision"] == "9c2be5087772867d45961abd11f6b35110617563"
          assert p["models"]["void1"]["taps_after_block_zero_based"] == [7,15,23]
          assert p["conformance"]["full_vs_cached_prefill_atol"] == 0.0005
          assert p["conformance"]["full_vs_cached_prefill_rtol"] == 0.0005
          PY
          ! grep -Eq 'torch\.|transformers|huggingface_hub|optimizer\.step|\.backward\('             scripts/ncr_001e_void1_postlease_adjudication.py

      - name: Re-audit durable original receipts and regenerate adjudication
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             scripts/ncr_001_void_postlease_original_audit.py             scripts/ncr_001_void_postlease_maxctx_original_audit.py             scripts/ncr_001e_void1_postlease_adjudication.py
          mkdir -p runtime/ncr-001
          python3 scripts/ncr_001e_void1_postlease_adjudication.py             > runtime/ncr-001/void1-postlease-adjudication.stdout.json

      - name: Require exact machine-readable decision and seven fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected=json.loads(Path("experiments/ncr-001/adjudication/void1-postlease-pretrain.json").read_text())
          got=json.loads(Path("runtime/ncr-001/void1-postlease-adjudication.json").read_text())
          assert got == expected
          assert got["per_model_gate"] is False
          assert got["source_runtime_pretraining_subgate"] is True
          assert got["blocking_required_checks"] == [
              "base_weight_unchanged_after_step",
              "nonzero_adapter_gradient_after_warmup",
              "finite_state_and_loss",
          ]
          assert got["byte_eos_dependency"]["four_step_generation_emitted_eos"] is False
          assert got["train_authorized"] is False
          PY
          python3 -m unittest discover -s tests             -p 'test_ncr_001e_void1_postlease_adjudication.py' -v

      - name: Preserve deterministic adjudication output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001e-void1-postlease-adjudication-a${{ github.run_attempt }}
          path: |
            runtime/ncr-001/void1-postlease-adjudication.json
            runtime/ncr-001/void1-postlease-adjudication.stdout.json
          if-no-files-found: warn
          retention-days: 30
