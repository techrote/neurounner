name: NCR-001E pinned Sprocket separate-process cold restart (no training)

on:
  pull_request:
    branches:
      - review/ncr-001e-sprocket-source-formatter-cold-cache
    paths:
      - ".github/workflows/ncr-001e-sprocket-cross-process.yml"
      - "scripts/ncr_001e_sprocket_cross_process.py"
      - "tests/test_ncr_001e_sprocket_cross_process.py"
      - "docs/NCR_001_E_SPROCKET_CROSS_PROCESS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncr001e-cross-process-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HF_HOME: /tmp/ncr001e-sprocket-cross-process-hf
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  cold-restart:
    name: Frozen ${{ matrix.variant }} producer to fresh Python consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: chat
            original_commit: 83a56835a7476f17a17980d28dd1a7c14bb6f2f6
            weight: chat/model.safetensors
            config: chat/config.json
            tokenizer: chat/tokenizer.json
            tokenizer_config: chat/tokenizer_config.json
          - variant: instruct
            original_commit: b95c010f9b2ba3cbd9f81317981316bb9c8acd19
            weight: model.safetensors
            config: config.json
            tokenizer: tokenizer.json
            tokenizer_config: tokenizer_config.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retrieve original frozen model hook at exact independent commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.original_commit }}
          path: implementation
          persist-credentials: false
      - name: Refuse any unfrozen training admission or source substitution
        run: |
          test "$(git -C implementation rev-parse HEAD)" = "${{ matrix.original_commit }}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("experiments/ncr-001/protocol.json").read_text())
          assert p["train_authorized"] is False
          assert set(p["models"])=={"smollm2","sprocket_chat","sprocket_instruct","void1"}
          print("NCR-001E: pinned review-only, four separate model identities, training refused")
          PY
      - name: Install exact actual-host CPU dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
          python3 -m pip install --disable-pip-version-check \
            "transformers==4.57.6" "huggingface_hub==0.36.2" \
            "safetensors==0.8.0" "sentencepiece>=0.2,<1"
      - name: Compile and exercise source-bound manifest mutation refusals
        run: |
          python3 -m py_compile scripts/ncr_001e_sprocket_cross_process.py
          python3 -m unittest discover -s tests \
            -p "test_ncr_001e_sprocket_cross_process.py" -v
      - name: Fetch and actually rehash pinned original full model and tokenizer bytes
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          variant="${{ matrix.variant }}"
          pins=json.load(open("experiments/ncr-001/source-pins.json"))
          pin=pins["models"]["sprocket_"+variant]
          assert pin["repo_id"]=="kandivault/sprocket-500m"
          assert pin["revision"]=="eb157d4ddddc4619e661d4a2426bb2dd000fc668"
          assert pin["hf_weight_file"]=="${{ matrix.weight }}"
          paths=["README.md", "${{ matrix.config }}", "${{ matrix.tokenizer }}",
                 "${{ matrix.tokenizer_config }}", "${{ matrix.weight }}"]
          if variant=="instruct": paths.append("special_tokens_map.json")
          for item in paths:
              path=Path(hf_hub_download(pin["repo_id"],filename=item,revision=pin["revision"]))
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for b in iter(lambda:f.read(4*1024*1024),b""): h.update(b)
              digest=h.hexdigest()
              if item==pin["hf_weight_file"]:
                  assert digest==pin["weight_declared_lfs_sha256_not_downloaded"]
                  assert path.stat().st_size==pin["weight_bytes"]
              print("PINNED_SOURCE",variant,item,digest,path.stat().st_size,flush=True)
          PY
      - name: Process A - manual untrained residual 256-unit source-formatted cache witness
        run: |
          HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
            python3 scripts/ncr_001e_sprocket_cross_process.py \
              --variant ${{ matrix.variant }} --stage producer
      - name: Process B - independently load original frozen model and saved adapter
        run: |
          HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
            python3 scripts/ncr_001e_sprocket_cross_process.py \
              --variant ${{ matrix.variant }} --stage consumer
          python3 - <<'PY'
          import json
          from pathlib import Path
          variant="${{ matrix.variant }}"
          root=Path("runtime/ncr-001/sprocket-cross-process-"+variant)
          a=json.loads((root/"producer.json").read_text())
          b=json.loads((root/"consumer.json").read_text())
          assert a["status"]=="PASS_SOURCE_BOUND_PROCESS_PRODUCER"
          assert b["status"]=="PASS_FRESH_INTERPRETER_SPROCKET_ADAPTER_REPLAY"
          assert a["process_pid"]!=b["process_pid"]
          for d in (a,b):
              assert d["optimizer_steps"]==0 and d["actual_model_training"] is False
              assert d["tool_and_memory_behavior_qualified"] is False
              assert d["full_four_model_conformance_pass"] is False
              assert d["train_authorized"] is False and d["heldout_evaluation"] is False
          for name in ("restart_active_tail_exact","restart_disabled_tail_exact",
                       "restart_request_A_exact","restart_after_B_no_leak_exact"):
              assert b["checks"][name]["pass"] and b["checks"][name]["max_abs"]==0
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  import hashlib
                  print("PERSISTED_RESULT",str(path),
                        hashlib.sha256(path.read_bytes()).hexdigest(),path.stat().st_size)
          print("Separate-process frozen Sprocket PREPASS only:",variant)
          PY
      - name: Preserve original successful and failed receipts, adapter handoff and replay logits
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001e-sprocket-${{ matrix.variant }}-two-process-a${{ github.run_attempt }}
          path: runtime/ncr-001/sprocket-cross-process-${{ matrix.variant }}/
          if-no-files-found: warn
          retention-days: 30
