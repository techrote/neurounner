name: NCR-001 Sprocket original publisher-wire full-mask replay (NO TRAIN)
on:
  pull_request:
    branches:
      - review/ncr001-postlease-wire-original-readback-20261028
    paths:
      - ".github/workflows/ncr-001-sprocket-wire-fullmask.yml"
      - "scripts/ncr_001_sprocket_wire_fullmask.py"
      - "tests/test_ncr_001_sprocket_wire_fullmask.py"
      - "docs/NCR_001_SPROCKET_WIRE_FULLMASK.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncr001-wire-fullmask-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NCR_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  HF_HOME: /tmp/ncr001-wire-fullmask-tokenizer
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  original-archive-and-negative-source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact PR head, four separate pins and closed training gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NCR_EXPECTED_HEAD"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = "14ce5fbaa38f8806c8c8738f19c01b91385eebaf"
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = "59fff1aed872b5563aa6898171983973e0cdb02c"
          python3 - <<'PY'
          import json
          p=json.load(open("experiments/ncr-001/protocol.json"))
          q=json.load(open("experiments/ncr-001/source-pins.json"))
          keys={"smollm2","sprocket_chat","sprocket_instruct","void1"}
          assert p["train_authorized"] is False
          assert set(p["models"]) == set(q["models"]) == keys
          assert p["models"]["sprocket_chat"]["weight_file"] == "chat/model.safetensors"
          assert p["models"]["sprocket_instruct"]["weight_file"] == "model.safetensors"
          PY
      - name: Full-position source tests, original ZIP/log audit and adversarial swaps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-sprocket-wire-fullmask
          python3 -m py_compile scripts/ncr_001_sprocket_wire_fullmask.py tests/test_ncr_001_sprocket_wire_fullmask.py
          python3 -m unittest discover -s tests -p 'test_ncr_001_sprocket_wire_fullmask.py' -v \
            2>&1 | tee runtime/ncr001-sprocket-wire-fullmask/source-tests.log
          python3 scripts/ncr_001_postlease_wire_evidence_audit.py --json \
            2>&1 | tee runtime/ncr001-sprocket-wire-fullmask/original-archive-audit.json
      - name: Preserve source, negative and archive evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-wire-fullmask-source-a${{ github.run_attempt }}
          path: runtime/ncr001-sprocket-wire-fullmask/
          if-no-files-found: warn
          retention-days: 30

  pinned-original-tokenizer-vs-physical-receipt:
    needs: original-archive-and-negative-source-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: techrote/neurounner
          ref: 3592841802d85c442ca2521479b5d8795bee7233
          path: wire-authority
          persist-credentials: false
      - name: Verify exact checkout and reviewed publisher renderer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NCR_EXPECTED_HEAD"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = "14ce5fbaa38f8806c8c8738f19c01b91385eebaf"
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = "59fff1aed872b5563aa6898171983973e0cdb02c"
          test "$(git -C wire-authority rev-parse HEAD)" = "3592841802d85c442ca2521479b5d8795bee7233"
          test "$(git -C wire-authority hash-object scripts/ncr_001e_sprocket_publisher_wire.py)" = "4e558ae530a1b79050e22bee587b3caf056e4563"
      - name: Install pinned tokenizer-only dependencies (no model weights)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            "transformers==4.57.6" "huggingface_hub==0.36.2" \
            "tokenizers==0.22.1" "safetensors==0.8.0" "sentencepiece>=0.2,<1"
      - name: SHA-verified root tokenizer and independent all-token-mask replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-sprocket-wire-fullmask
          python3 scripts/ncr_001_sprocket_wire_fullmask.py \
            2>&1 | tee runtime/ncr001-sprocket-wire-fullmask/host-tokenizer-only.log
      - name: Preserve physical receipt cross-check, including any failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-wire-fullmask-tokenizer-a${{ github.run_attempt }}
          path: runtime/ncr001-sprocket-wire-fullmask/
          if-no-files-found: warn
          retention-days: 30
