name: NCR-001F immutable original Sprocket frozen MLP receipt readback

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ncr001f-sprocket-receipt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  immutable-originals-and-negative-controls:
    name: Four original source receipts, archive ZIP provenance and tamper sentinels
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test independent read-only exact original JSON custody and adversarial tampering
        run: |
          python3 -m py_compile scripts/ncr_001f_sprocket_mlp_receipt_audit.py \
            tests/test_ncr_001f_sprocket_mlp_receipt_audit.py
          python3 -m unittest discover -s tests \
            -p "test_ncr_001f_sprocket_mlp_receipt_audit.py" -v
      - name: Record complete independent source-bound readback result
        run: |
          python3 scripts/ncr_001f_sprocket_mlp_receipt_audit.py | tee ncr001f-original-readback.json
          python3 - <<'PY'
          import json
          d=json.load(open("ncr001f-original-readback.json"))
          assert d["status"]=="PASS_ORIGINAL_DUAL_SPROCKET_FROZEN_MLP_RAW_JSON_CUSTODY__FINAL_CONFORMANCE_BLOCKED"
          assert d["source_integrity_readback_pass"] is True
          assert d["independent_new_model_invocation"] is False
          assert d["train_authorized"] is False
          assert d["independent_ncr_001e_final_conformance_pass"] is False
          assert d["tool_memory_behavior_qualified"] is False
          assert d["optimizer_steps"]==0
          assert set(d["models"])=={"chat","instruct"}
          print("PASS: raw receipt byte integrity; actual Sprocket NCA/MLP comparison still blocked")
          PY
      - name: Preserve readback output even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001f-original-sprocket-mlp-readback-a${{ github.run_attempt }}
          path: ncr001f-original-readback.json
          retention-days: 30
          if-no-files-found: warn
