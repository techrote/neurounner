name: TRAIN-003 evidence promotion

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/promote-train-003.yml"

permissions:
  contents: write
  actions: read

jobs:
  promote:
    name: Promote qualification evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Recover TRAIN-003 qualification artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: techrote/neurounner
          run-id: 40145401600
          pattern: train003-*-evidence-a1
          path: recovered
          merge-multiple: false

      - name: Recover comparison artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: techrote/neurounner
          run-id: 40145401600
          name: train003-comparison-a1
          path: recovered/comparison

      - name: Publish durable evidence
        run: |
          find recovered -maxdepth 4 -type f -printf '%p %s bytes\n' | sort
          mkdir -p experiments/train-003/evidence
          cp recovered/train003-train001-evidence-a1/train001-heldout.json experiments/train-003/evidence/train001-heldout.json
          cp recovered/train003-candidate-evidence-a1/train003-heldout.json experiments/train-003/evidence/train003-heldout.json
          cp recovered/comparison/comparison.json experiments/train-003/evidence/comparison.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          record = {
            "schema_version": 1,
            "experiment": "TRAIN-003",
            "qualification_run_id": 40145401600,
            "qualification_source_sha": "46ce9068005f48fe791b589028373317c63e6cf8",
            "artifacts": {
              "baseline": {"id": 12581031568, "name": "train003-train001-evidence-a1", "digest": "sha256:77ce44e874fe2be5d1503e65b6cae2e7573bba7ec4fb4d59a85df3d9ce7f64a9"},
              "candidate": {"id": 12581298433, "name": "train003-candidate-evidence-a1", "digest": "sha256:69e1cf3df1b42bebccf68e8aefbe2b54feb6b5f56fef8a47b48a4d86209caff4"},
              "comparison": {"id": 12580734353, "name": "train003-comparison-a1", "digest": "sha256:3e9305632c3e2b6ec95e1e5b2ca02a91b6ba200685e0add1dfbce784cbc30721"}
            },
            "note": "Adapter weights remain in the candidate Actions artifact; durable repository evidence contains raw held-out responses and the direct comparison."
          }
          Path("experiments/train-003/evidence/provenance.json").write_text(json.dumps(record, indent=2, sort_keys=True) + "\n")
          PY
          git add experiments/train-003/evidence
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "evidence already promoted"
            exit 0
          fi
          git commit -m "Promote TRAIN-003 qualification evidence"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
