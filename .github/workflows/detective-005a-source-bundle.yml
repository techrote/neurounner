name: DETECTIVE-005A source-only private review preparation bundle

on:
  push:
    paths:
      - ".github/workflows/detective-005a-source-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Package public verified source only (NO MODEL / NO SECRET)
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/detective-005a-source.tar.gz" \
            scripts/detective_005a_blind.py \
            scripts/detective_005a_fun_screen.py \
            scripts/detective_005a_assemble.py \
            scripts/detective_005a_live.py \
            scripts/detective_005a_recover.py \
            tests/test_detective_005a_blind.py \
            tests/test_detective_005a_fun_screen.py \
            tests/test_detective_005a_recovery.py \
            experiments/detective-005/fun-screen.json \
            experiments/detective-005/FUN_SCREEN.md \
            experiments/village-001/sft-evidence/adapter-release.json
          cp "$RUNNER_TEMP/detective-005a-source.tar.gz" ./detective-005a-source.tar.gz
          sha256sum detective-005a-source.tar.gz
          echo "SOURCE ONLY: no model, no ratings, no private packet, no secret"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: detective-005a-source-only
          path: detective-005a-source.tar.gz
          if-no-files-found: error
          retention-days: 1
