name: NCR-001E original decoded job-log custody (NO MODEL)
on:
  pull_request:
    branches: [review/ncr001-sprocket-wire-fullmask-custody-20261028]
    paths:
      - ".github/workflows/ncr-001-postlease-decoded-log-failclosed.yml"
      - "scripts/ncr_001_postlease_wire_evidence_audit.py"
      - "tests/test_ncr_001_postlease_wire_evidence_audit.py"
      - "docs/NCR_001_POSTLEASE_WIRE_EVIDENCE.md"
      - "experiments/ncr-001/controls-evidence/postlease-wire-20261028/hardening-20261028/**"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  decoded-job-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate exact head, immutable source pins and no-training protocol
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = "14ce5fbaa38f8806c8c8738f19c01b91385eebaf"
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = "59fff1aed872b5563aa6898171983973e0cdb02c"
          test "$(git hash-object experiments/ncr-001/controls-evidence/postlease-wire-20261028/manifest.json)" = "6e11a7215b9c3618269693572ee57a5281e48286"
          python3 - <<'PY'
          import json
          p=json.load(open("experiments/ncr-001/protocol.json"))
          assert p["train_authorized"] is False
          assert set(p["models"]) == {"smollm2", "sprocket_chat", "sprocket_instruct", "void1"}
          PY
      - name: Assert exact archived ZIPs, all decoded job Git blobs and 20 tests
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-decoded-log
          python3 -m py_compile scripts/ncr_001_postlease_wire_evidence_audit.py tests/test_ncr_001_postlease_wire_evidence_audit.py
          python3 scripts/ncr_001_postlease_wire_evidence_audit.py --json 2>&1 | tee runtime/ncr001-decoded-log/audit.json
          python3 -m unittest discover -s tests -p 'test_ncr_001_postlease_wire_evidence_audit.py' -v 2>&1 | tee runtime/ncr001-decoded-log/tests.log
      - name: Fresh independent re-download and exact three original ZIP comparisons
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-decoded-log/original
          for id in 12829497410 12828893309 12829691760; do
            curl --fail --silent --show-error --location --retry 2 --connect-timeout 20 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              --output "runtime/ncr001-decoded-log/original/artifact-${id}.zip"
          done
          python3 - <<'PY' 2>&1 | tee runtime/ncr001-decoded-log/fresh-readback.log
          from pathlib import Path
          from scripts.ncr_001_postlease_wire_evidence_audit import audit, original_zip_bytes, ORIGINAL_ZIPS
          zips=original_zip_bytes()
          for name in ORIGINAL_ZIPS:
              downloaded=(Path("runtime/ncr001-decoded-log/original")/name).read_bytes()
              assert downloaded==zips[name],name+" original ZIP differs"
              print("EXACT ORIGINAL ZIP",name,len(downloaded))
          result=audit()
          assert result["decoded_git_blob_sha_verified"] is True
          assert result["original_decoded_job_logs_verified"] == 3
          assert result["archival_ci_decoded_job_logs_verified"] == 2
          assert result["training_authorized"] is False
          assert result["full_72_admitted"] is False
          print("NO MODEL; NO TRAINING; SOURCE CUSTODY ONLY")
          PY
      - name: Preserve complete source and negative evidence on pass or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-decoded-job-custody-a${{ github.run_attempt }}
          path: runtime/ncr001-decoded-log/
          if-no-files-found: warn
          retention-days: 30
