name: DETECTIVE-002C LFM v5 runtime compatibility

on:
  pull_request:
    paths:
      - "experiments/detective-002/lfm-v5-runtime.json"
      - "experiments/detective-002/LFM_V5_RUNTIME.md"
      - "experiments/detective-002/source-evidence/source-evidence.json"
      - "experiments/detective-002/runtime-smoke.json"
      - "datasets/detective-002b/raw/lfm25-350m.json"
      - "scripts/detective_002c_lfm_runtime.py"
      - "scripts/detective_002c_verify.py"
      - "tests/test_detective_002c_*.py"
      - "datasets/detective-002c/**"
      - ".github/workflows/detective-002c-lfm-v5.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detective-002c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      evidence_ready: ${{ steps.evidence.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile focused 002C source and tests
        run: |
          python3 -m py_compile scripts/detective_002c_lfm_runtime.py scripts/detective_002c_verify.py tests/test_detective_002c_lfm_runtime.py tests/test_detective_002c_verify.py
      - name: Run all DETECTIVE offline contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_detective_*.py' -v
      - name: Revalidate frozen Stage-A/battery/historical source authority
        run: |
          python3 - <<'PY'
          from scripts.detective_002c_lfm_runtime import load_contract
          cfg,candidate,battery=load_contract()
          assert candidate["candidate_id"]=="lfm25-350m"
          assert cfg["runtime"]["transformers"]=="5.20.1"
          assert cfg["runtime"]["optimizer_steps"]==0
          assert cfg["decisions"]["production_license_cleared"] is False
          assert len(battery["battery"])==4
          print("DETECTIVE-002C OFFLINE SOURCE CONTRACT: PASS")
          PY
      - name: Revalidate committed evidence if present
        id: evidence
        run: |
          if [ -e datasets/detective-002c/manifest.json ]; then
            python3 scripts/detective_002c_verify.py --evidence datasets/detective-002c
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  live-requalification:
    needs: offline-contract
    if: ${{ needs.offline-contract.outputs.evidence_ready != 'true' && github.event_name == 'pull_request' && github.head_ref == 'research/detective-002c-lfm-v5-runtime-20261028' && github.event.pull_request.head.repo.full_name == 'techrote/neurounner' && github.event.pull_request.user.login == 'techrote' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: /tmp/detective-002c-hf
      DETECTIVE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and verify exact Transformers 5.20.1 wheel before install
        run: |
          set -euo pipefail
          rm -rf /tmp/tfwheel
          mkdir /tmp/tfwheel
          python3 -m pip download --disable-pip-version-check --no-deps --only-binary=:all: --dest /tmp/tfwheel "transformers==5.20.1"
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          files=list(Path("/tmp/tfwheel").glob("transformers-5.20.1-*.whl"))
          assert len(files)==1,files
          h=hashlib.sha256(files[0].read_bytes()).hexdigest()
          expected="5f51ce444193e5d0a751e3fa489ddbc2224ff12f6675a5cfefd4044b09757c19"
          assert h==expected,(files[0],h,expected)
          print("TRANSFORMERS_5_20_1_WHEEL_SHA256_PASS",h)
          PY

      - name: Install pinned CPU Torch and verified local Transformers wheel
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
          python3 -m pip install --disable-pip-version-check /tmp/tfwheel/transformers-5.20.1-*.whl "safetensors==0.8.0" "sentencepiece>=0.2,<1"
          python3 - <<'PY'
          import transformers
          assert transformers.__version__=="5.20.1",transformers.__version__
          print("TRANSFORMERS_RUNTIME",transformers.__version__)
          PY

      - name: Run tokenizer-first exact LFM requalification
        run: |
          rm -rf runtime/detective-002c
          mkdir -p runtime/detective-002c
          python3 scripts/detective_002c_lfm_runtime.py             --out runtime/detective-002c/result.json

      - name: Assemble focused durable archive
        run: |
          rm -rf datasets/detective-002c
          python3 scripts/detective_002c_lfm_runtime.py             --archive-from runtime/detective-002c/result.json             --archive-out datasets/detective-002c             --source-head "$DETECTIVE_HEAD_SHA"             --run-id "$GITHUB_RUN_ID"             --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Independent source/tokenizer/model readback
        run: |
          python3 scripts/detective_002c_verify.py --evidence datasets/detective-002c

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: detective002c-lfm-v5-${{ github.run_id }}
          path: |
            runtime/detective-002c
            datasets/detective-002c
          if-no-files-found: warn
          retention-days: 30

      - name: Refuse stale source before evidence publication
        run: |
          remote_sha=$(git ls-remote --heads origin refs/heads/research/detective-002c-lfm-v5-runtime-20261028 | cut -f1)
          test "$remote_sha" = "$DETECTIVE_HEAD_SHA"

      - name: Commit exact requalification evidence to PR branch
        run: |
          git config user.name "neurounner experiment bot"
          git config user.email "261801702+techrote@users.noreply.github.com"
          git add datasets/detective-002c
          git diff --cached --quiet && { echo "expected DETECTIVE-002C evidence"; exit 1; }
          git commit -m "DETECTIVE-002C: record LFM Transformers-v5 compatibility evidence"
          git push origin HEAD:research/detective-002c-lfm-v5-runtime-20261028

  evidence-readback:
    needs: offline-contract
    if: ${{ needs.offline-contract.outputs.evidence_ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify committed requalification evidence only
        run: |
          python3 scripts/detective_002c_verify.py --evidence datasets/detective-002c
