name: NCR-001 root Sprocket Instruct original masked causal CE (NO TRAIN)
# Main-base integration: physical diagnostic semantics below are unchanged from reviewed #188 source.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ncr-001-sprocket-root-native-ce.yml"
      - "scripts/ncr_001_sprocket_wire_native_ce.py"
      - "tests/test_ncr_001_sprocket_wire_native_ce.py"
      - "docs/NCR_001_SPROCKET_ROOT_NATIVE_CE.md"
      - "RAG.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ncr001-root-native-ce-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NCR_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  NCR_EXPECTED_BASE: 936df464f37c25516bcea981bf22780627a41499
  HF_HOME: /tmp/ncr001-root-native-ce-hf
  TOKENIZERS_PARALLELISM: "false"
  HF_HUB_DISABLE_TELEMETRY: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
jobs:
  frozen-root-native-ce:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: techrote/neurounner
          ref: 2271218d625e1462b2cf218445da975efe17fe32
          path: format-authority
          persist-credentials: false
      - name: Exact original source, four-variant pins, protocol and training lock
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_BASE_REF" = main
          test "${{ github.event.pull_request.base.sha }}" = "$NCR_EXPECTED_BASE"
          test "$(git rev-parse HEAD)" = "$NCR_EXPECTED_HEAD"
          test "$(git -C format-authority rev-parse HEAD)" = "2271218d625e1462b2cf218445da975efe17fe32"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = "14ce5fbaa38f8806c8c8738f19c01b91385eebaf"
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = "59fff1aed872b5563aa6898171983973e0cdb02c"
          python3 - <<'PY'
          import json
          p=json.load(open("experiments/ncr-001/protocol.json"))
          pins=json.load(open("experiments/ncr-001/source-pins.json"))
          assert p["train_authorized"] is False
          assert set(p["models"])==set(pins["models"])=={"smollm2","sprocket_chat","sprocket_instruct","void1"}
          assert pins["models"]["sprocket_chat"]["hf_weight_file"] == "chat/model.safetensors"
          assert pins["models"]["sprocket_instruct"]["hf_weight_file"] == "model.safetensors"
          PY
      - name: Install pinned CPU native runtime (no CUDA, no optimizer)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-root-instruct-native-ce
          python3 -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu" \
            2>&1 | tee runtime/ncr001-root-instruct-native-ce/install-torch.log
          python3 -m pip install --disable-pip-version-check \
            "transformers==4.57.6" "huggingface_hub==0.36.2" \
            "safetensors==0.8.0" "tokenizers==0.22.1" "sentencepiece>=0.2,<1" \
            2>&1 | tee runtime/ncr001-root-instruct-native-ce/install-tokenizer.log
      - name: Source-only adversarial toy CE tests and inherited original custody
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ncr_001_sprocket_wire_native_ce.py tests/test_ncr_001_sprocket_wire_native_ce.py
          python3 -m unittest discover -s tests -p 'test_ncr_001_sprocket_wire_native_ce.py' -v \
            2>&1 | tee runtime/ncr001-root-instruct-native-ce/negative-tests.log
          python3 scripts/ncr_001_sprocket_wire_shifted_original_custody.py \
            2>&1 | tee runtime/ncr001-root-instruct-native-ce/original-shifted-custody.json
      - name: Actual SHA-pinned frozen ROOT Instruct native CE and zero NCA/MLP hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ncr_001_sprocket_wire_native_ce.py \
            2>&1 | tee runtime/ncr001-root-instruct-native-ce/native-host.log
      - name: Retain originals, partial model receipts, failures, and source logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-root-native-ce-a${{ github.run_attempt }}
          path: runtime/ncr001-root-instruct-native-ce/
          if-no-files-found: warn
          retention-days: 30
