name: NCR-001E original post-lease publisher-wire receipt readback (no model)
on:
  pull_request:
    branches:
      - review/ncr001-sprocket-postlease-publisher-wire-20261028
    paths:
      - ".github/workflows/ncr-001-postlease-wire-evidence-readback.yml"
      - "scripts/ncr_001_postlease_wire_evidence_audit.py"
      - "tests/test_ncr_001_postlease_wire_evidence_audit.py"
      - "experiments/ncr-001/controls-evidence/postlease-wire-20261028/**"
      - "docs/NCR_001_POSTLEASE_WIRE_EVIDENCE.md"
      - "RAG.md"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ncr001-postlease-wire-readback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-original-byte-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NCR_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact evidence head, immutable original model source and training lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NCR_EXPECTED_HEAD"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = "14ce5fbaa38f8806c8c8738f19c01b91385eebaf"
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = "59fff1aed872b5563aa6898171983973e0cdb02c"
          # The original physical head is immutably pinned in the archive manifest;
          # the default exact-head shallow checkout does not retain that commit object.
          python3 - <<'PY'
          import json
          p=json.load(open("experiments/ncr-001/protocol.json"))
          assert p["train_authorized"] is False
          assert set(p["models"]) == {"smollm2","sprocket_chat","sprocket_instruct","void1"}
          PY
      - name: Check Git original ZIP custody, the 11+10 source tests and original frozen-host scientific limits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-wire-readback
          python3 -m py_compile scripts/ncr_001_postlease_wire_evidence_audit.py tests/test_ncr_001_postlease_wire_evidence_audit.py
          python3 scripts/ncr_001_postlease_wire_evidence_audit.py --json \
            2>&1 | tee runtime/ncr001-wire-readback/original-git-audit.json
          python3 -m unittest discover -s tests -p 'test_ncr_001_postlease_wire_evidence_audit.py' -v \
            2>&1 | tee runtime/ncr001-wire-readback/evidence-negative-tests.log
      - name: Independently re-download original Actions containers (not reconstructed receipts)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-wire-readback/original
          for id in 12829497410 12828893309 12829691760; do
            curl --fail --silent --show-error --location --retry 2 --connect-timeout 20 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              --output "runtime/ncr001-wire-readback/original/artifact-${id}.zip"
            test -s "runtime/ncr001-wire-readback/original/artifact-${id}.zip"
          done
      - name: Compare Git's original container bytes against fresh original GitHub downloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee runtime/ncr001-wire-readback/actions-fresh-readback.log
          import hashlib
          from pathlib import Path
          from scripts.ncr_001_postlease_wire_evidence_audit import (
              audit, original_zip_bytes, ORIGINAL_ZIPS)
          archived=original_zip_bytes()
          for name,meta in ORIGINAL_ZIPS.items():
              current=Path("runtime/ncr001-wire-readback/original")/name
              original=current.read_bytes()
              assert original==archived[name],name+" Git original vs re-downloaded Actions bytes differ"
              assert hashlib.sha256(original).hexdigest()==meta["sha256"]
              print("EXACT_ORIGINAL_GIT_AND_ACTIONS_SHA256",name,meta["sha256"],len(original))
          result=audit()
          assert result["training_authorized"] is False
          assert result["tool_memory_semantics_admitted"] is False
          assert result["retained_original_failures"] is True
          print("READBACK_PASS",result["source_head"],result["physical_checks"])
          PY
      - name: Preserve positive and negative readback logs, original ZIPs on both failure/success
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-postlease-wire-original-readback-a${{ github.run_attempt }}
          path: runtime/ncr001-wire-readback/
          if-no-files-found: warn
          retention-days: 30
