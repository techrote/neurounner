name: NCR-001E Sprocket Chat deterministic #72 adjudication (no model, no training)

on:
  pull_request:
    branches:
      - review/ncr001e-sprocket-chat-generate-20261027
    paths:
      - '.github/workflows/ncr-001e-sprocket-chat-adjudication.yml'
      - 'scripts/ncr_001e_sprocket_chat_adjudication.py'
      - 'tests/test_ncr_001e_sprocket_chat_adjudication.py'
      - 'experiments/ncr-001/adjudication/sprocket-chat-pretrain.json'
      - 'experiments/ncr-001/protocol.json'
      - 'experiments/ncr-001/source-pins.json'
      - 'experiments/ncr-001/evidence-review/sprocket-fresh/**'
      - 'experiments/ncr-001/evidence-review/sprocket-cross-process/**'
      - 'experiments/ncr-001/evidence-review/sprocket-extended-context/**'
      - 'experiments/ncr-001/evidence-review/sprocket-chat-generate/**'
      - 'scripts/ncr_001e_sprocket_chat_generate_audit.py'
      - 'scripts/ncr_001e_sprocket_receipt_audit.py'
      - 'scripts/ncr_001e_sprocket_process_receipt_audit.py'
      - 'scripts/ncr_001e_sprocket_extended_receipt_audit.py'
      - 'docs/NCR_001_E_SPROCKET_CHAT_ADJUDICATION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adjudicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recheck original Sprocket archives and reproduce Chat BLOCKED adjudication
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ncr_001e_sprocket_chat_adjudication.py
          python3 scripts/ncr_001e_sprocket_chat_adjudication.py
          python3 - <<'PY'
          import json
          expected=json.load(open('experiments/ncr-001/adjudication/sprocket-chat-pretrain.json'))
          actual=json.load(open('runtime/ncr-001/sprocket-chat-adjudication.json'))
          assert actual == expected
          assert actual['per_model_gate'] is False
          assert actual['train_authorized'] is False
          assert actual['optimizer_steps_observed'] == 0
          assert actual['source_semantic_scope']['instruct_tool_memory_grammar_inherited'] is False
          assert set(actual['blocking_required_checks']) == {
              'base_weight_unchanged_after_step',
              'nonzero_adapter_gradient_after_warmup',
              'finite_state_and_loss',
          }
          print('AUTHORITATIVE_SPROCKET_CHAT_GATE',actual['adjudication'])
          print('ORDINARY_CHAT_ONLY no Instruct semantics; no training')
          PY
      - name: Negative and false-PASS adjudication tests
        run: |
          python3 -m unittest discover -s tests \
            -p 'test_ncr_001e_sprocket_chat_adjudication.py' -v
      - name: Retain deterministic report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001e-sprocket-chat-adjudication
          path: runtime/ncr-001/sprocket-chat-adjudication.json
          if-no-files-found: error
          retention-days: 30
