name: NCR-001 frozen Sprocket Chat assistant-only native CE (NO TRAIN)
# Main-base integration: Chat physical diagnostic semantics below are unchanged from original #191 source.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ncr-001-chat-native-ce.yml"
      - "scripts/ncr_001_sprocket_chat_native_ce.py"
      - "tests/test_ncr_001_sprocket_chat_native_ce.py"
      - "docs/NCR_001_CHAT_NATIVE_CE.md"
      - "RAG.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ncr001-chat-native-ce-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NCR_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  HF_HOME: /tmp/ncr001-chat-native-ce-hf
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  original-chat-assistant-ce:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: techrote/neurounner
          ref: 2271218d625e1462b2cf218445da975efe17fe32
          path: format-authority
          persist-credentials: false
      - name: Require exact original Chat source ancestry and four-model training lock
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_BASE_REF" = "main"
          test "$(git rev-parse HEAD)" = "$NCR_EXPECTED_HEAD"
          test "$(git -C format-authority rev-parse HEAD)" = 2271218d625e1462b2cf218445da975efe17fe32
          test "$(git hash-object experiments/ncr-001/protocol.json)" = 14ce5fbaa38f8806c8c8738f19c01b91385eebaf
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = 59fff1aed872b5563aa6898171983973e0cdb02c
          test "$(git hash-object scripts/ncr_001_postlease_sprocket.py)" = 66e6b4d97eea5e917339b8e7bfb5d1c191db4a2d
          test "$(git hash-object scripts/ncr_001_postlease_evidence_audit.py)" = 96122861fc18962ac2d255f3dd5282bc0bf8f929
          python3 - <<'PY'
          import json
          p=json.load(open("experiments/ncr-001/protocol.json"))
          q=json.load(open("experiments/ncr-001/source-pins.json"))
          assert p["train_authorized"] is False
          assert set(p["models"])==set(q["models"])=={"smollm2","sprocket_chat","sprocket_instruct","void1"}
          assert p["models"]["sprocket_chat"]["weight_file"]=="chat/model.safetensors"
          assert p["models"]["sprocket_instruct"]["weight_file"]=="model.safetensors"
          assert q["models"]["sprocket_chat"]["weight_declared_lfs_sha256_not_downloaded"]=="551c6e262ec4561dda7c74c9ef7cb73bd1a555ad1e05e37e6600c84a5acefe97"
          PY
      - name: Preserve original Chat/Instruct post-lease physical evidence readback (no model)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-chat-native-ce
          python3 scripts/ncr_001_postlease_evidence_audit.py \
            2>&1 | tee runtime/ncr001-chat-native-ce/original-postlease-custody.json
      - name: Install pinned original-host CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu" \
            2>&1 | tee runtime/ncr001-chat-native-ce/install-torch.log
          python3 -m pip install --disable-pip-version-check \
            "transformers==4.57.6" "huggingface_hub==0.36.2" \
            "tokenizers==0.22.1" "safetensors==0.8.0" "sentencepiece>=0.2,<1" \
            2>&1 | tee runtime/ncr001-chat-native-ce/install-source.log
      - name: Check 11 synthetic causal loss/Chat-only negative sentinels
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ncr_001_sprocket_chat_native_ce.py tests/test_ncr_001_sprocket_chat_native_ce.py
          python3 -m unittest discover -s tests -p test_ncr_001_sprocket_chat_native_ce.py -v \
            2>&1 | tee runtime/ncr001-chat-native-ce/source-tests.log
      - name: Execute pinned original CHAT HF model assistant-only synthetic CE; no training
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ncr_001_sprocket_chat_native_ce.py \
            2>&1 | tee runtime/ncr001-chat-native-ce/physical-host.log
      - name: Preserve all original partial/negative/positive results and runner evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-chat-native-ce-a${{ github.run_attempt }}
          path: runtime/ncr001-chat-native-ce/
          if-no-files-found: warn
          retention-days: 30
