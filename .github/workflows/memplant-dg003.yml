name: MEMPLANT DG003 frozen novel-interaction inference

on:
  pull_request:
    branches: [main, research/memplant-dg002-two-rule-transplant]
    paths:
      - '.github/workflows/memplant-dg003.yml'
      - 'experiments/memplant/dreamgraft003/**'
      - 'tests/test_memplant_dg003.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: memplant-dg003-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_DOWNLOAD_TIMEOUT: '120'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'

jobs:
  source_contract:
    name: Source syntax and immutable experiment contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python source syntax and task provenance
        run: |
          python3 -m py_compile experiments/memplant/dreamgraft003/interactions.py tests/test_memplant_dg003.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('experiments/memplant/dreamgraft003/interactions.py').read_text()
          assert 'PREVIOUS_EVIDENCE_RUN = 43736088404' in s
          assert 'new_training_updates":0' in s
          assert all(x in s for x in ('"xor"', '"and"', '"equal"', '"oracle_prefix"', '"text_facts"'))
          print('Fixed task mechanisms and original source provenance recorded; no weights loaded')
          PY

  tasks:
    name: Frozen 1.7B novel interaction ${{ matrix.task }}
    needs: source_contract
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    strategy:
      fail-fast: false
      matrix:
        task: [xor, and, equal]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned CPU inference runtime
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python3 -m pip install --disable-pip-version-check 'transformers==4.57.6' 'huggingface_hub>=0.36,<1' 'psutil>=7,<8' 'safetensors>=0.6,<1' 'numpy>=1.26,<3'
      - name: Verify logic and source-separated native likelihoods
        run: python3 -m unittest discover -s tests -p 'test_memplant_dg003.py' -v
      - name: Fetch immutable DG002 real donor state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memplant-dg002-source-a1
          repository: techrote/neurounner
          run-id: 43736088404
          github-token: ${{ github.token }}
          path: runtime/memplant/dg003/source
      - name: Fetch immutable DG002 target-native prefix carriers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memplant-dg002-prefixes-a1
          repository: techrote/neurounner
          run-id: 43736088404
          github-token: ${{ github.token }}
          path: runtime/memplant/dg003/prefixes
      - name: Test novel mechanism and counterfactual swaps, no fitting
        run: |
          mkdir -p runtime/memplant/dg003/${{ matrix.task }}
          timeout --signal=INT --kill-after=15s 23m python3 -m experiments.memplant.dreamgraft003.interactions \
            --task '${{ matrix.task }}' \
            --source runtime/memplant/dg003/source \
            --checkpoint runtime/memplant/dg003/prefixes \
            --out runtime/memplant/dg003/${{ matrix.task }} \
            ${{ matrix.task == 'xor' && '--creative' || '' }}
      - name: Print raw controls without converting CI pass to science claim
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          for p in Path('runtime/memplant/dg003').glob('*/report.json'):
              r=json.loads(p.read_text())
              a=r.get('evaluation',{})
              print('TASK',r.get('task'),'STATUS',r.get('status'),'ERROR',r.get('error'))
              print('ACCURACY',a.get('conditions'))
              print('INTERVENTIONS',{k:{j:v for j,v in d.items() if j!='cases'} for k,d in a.get('causal_interventions',{}).items()})
          PY
      - name: Archive all source-swaps, oracles and raw failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: memplant-dg003-${{ matrix.task }}-a${{ github.run_attempt }}
          path: runtime/memplant/dg003/${{ matrix.task }}
          if-no-files-found: warn
          retention-days: 30

  synthesis:
    name: Independent-readable research summary
    needs: tasks
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: memplant-dg003-*-a${{ github.run_attempt }}
          path: evidence
          merge-multiple: false
      - name: Summarize raw outcomes and their limits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          reports=sorted(Path('evidence').glob('*/report.json'))
          lines=['# DG003 frozen novel causal interaction audit','',
                 'Model weights, two-output ridge and recipient-native prefixes **unchanged**.',
                 'Previously unused tasks: XOR, AND, agreement. Reused DG002 source corpus;',
                 'not new source-world confirmation.','',
                 '| Task | Real V | True-class prefix | Explicit law text | No prefix | Heat intervention | Vibration intervention |',
                 '| --- | ---: | ---: | ---: | ---: | ---: | ---: |']
          for p in reports:
              r=json.loads(p.read_text())
              a=r.get('evaluation') or {}
              c=a.get('conditions') or {}
              edits=a.get('causal_interventions') or {}
              fmt=lambda key: str(c.get(key,{}).get('correct','—'))+'/'+str(c.get(key,{}).get('n','—'))
              edit=lambda key: str(edits.get(key,{}).get('correct_intervention_direction','—'))+'/'+str(edits.get(key,{}).get('n','—'))
              lines.append(f"| {r.get('task')} ({r.get('status')}) | {fmt('real_v')} | {fmt('oracle_prefix')} | {fmt('text_facts')} | {fmt('no_prefix')} | {edit('heat_swap')} | {edit('vibration_swap')} |")
          if not reports:lines.append('| BLOCKED: no completed task reports | — | — | — | — | — | — |')
          lines+=['','**Interpretation:** Successful CI establishes execution, not interaction inference.',
                  'Require correct new consequences, adequate B oracle, and intervention directionality.',
                  'All raw cases and rejection controls are kept in their respective JSON artifacts.',
                  'No native KV transplant, latent-only surgery, or model-neutral memory implied.']
          Path('interaction-summary.md').write_text('\n'.join(lines)+'\n')
          print(Path('interaction-summary.md').read_text())
          PY
      - name: Retain research summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: memplant-dg003-study-summary-a${{ github.run_attempt }}
          path: interaction-summary.md
          if-no-files-found: warn
          retention-days: 30
