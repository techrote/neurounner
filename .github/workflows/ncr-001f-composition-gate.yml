name: NCR-001F current-main eight-PR source composition (NO MODEL)
on:
  push:
    branches: [review/ncr001f-optimized-assert-failclosed-20261030]
    paths:
      - "scripts/ncr_001f_composition_gate.py"
      - "tests/test_ncr_001f_composition_gate.py"
      - ".github/workflows/ncr-001f-composition-gate.yml"
      - "docs/NCR_001_F_COMPOSITION_GATE.md"
  pull_request:
    branches: [main]
    paths:
      - "scripts/ncr_001f_composition_gate.py"
      - "tests/test_ncr_001f_composition_gate.py"
      - ".github/workflows/ncr-001f-composition-gate.yml"
      - "docs/NCR_001_F_COMPOSITION_GATE.md"
permissions:
  contents: read
concurrency:
  group: ncr001f-composition-g9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  TOKENIZERS_PARALLELISM: "false"
jobs:
  source-only-eight-pr-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify literal source head and frozen original authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor e53ab3a738de8f3313e8b1ca98a89c6194093ed7 HEAD
          test "$(git hash-object experiments/ncr-001/protocol.json)" = 14ce5fbaa38f8806c8c8738f19c01b91385eebaf
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = 59fff1aed872b5563aa6898171983973e0cdb02c
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
      - name: Run eight fake-Git source-composition acceptance and refusal cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001f-composition
          python3 -m py_compile scripts/ncr_001f_composition_gate.py tests/test_ncr_001f_composition_gate.py
          python3 -m unittest discover -s tests -p 'test_ncr_001f_composition_gate.py' -v 2>&1 | tee runtime/ncr001f-composition/guard-tests.log
          python3 -O -m unittest discover -s tests -p 'test_ncr_001f_composition_gate.py' -v 2>&1 | tee runtime/ncr001f-composition/guard-tests-optimized.log
      - name: Compose eight literal original PR diffs on fetched main (no Git push)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ncr_001f_composition_gate.py \
            --repo . --main-ref refs/remotes/origin/main \
            --worktree "$RUNNER_TEMP/ncr001f-composite" \
            --out runtime/ncr001f-composition/report.json \
            2>&1 | tee runtime/ncr001f-composition/compose.log
      - name: Install pinned CPU-only PyTorch for toy controller tests
        run: |
          python3 -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
      - name: Qualify combined event/custody/toy-MLP/shared-root source regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ncr001f-composite"
          python3 -m unittest discover -s tests -p 'test_ncr_001f_action_event_audit.py' -v
          python3 -O -m unittest discover -s tests -p 'test_ncr_001f_action_event_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_ncr_001f_adapter_load_transaction.py' -v
          python3 -O -m unittest discover -s tests -p 'test_ncr_001f_adapter_load_transaction.py' -v
          python3 -m unittest discover -s tests -p 'test_ncr_001f_frozen_hooks.py' -v
          python3 -m unittest discover -s tests -p 'test_ncr_001f_shared_backbone_ownership.py' -v
          python3 -m unittest discover -s tests -p 'test_ncr_001f_fourlane_phase_budget.py' -v
          python3 -O -m unittest discover -s tests -p 'test_ncr_001f_fourlane_phase_budget.py' -v
      - name: Independently assert no scientific admission or physical test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("runtime/ncr001f-composition/report.json").read_text())
          assert d["status"] == "NCR001F_SOURCE_COMPOSITION_PASS__SCIENTIFIC_GATES_BLOCKED"
          assert [v["pr"] for v in d["original_stages"]] == [199,201,209,212,227,224,226,223]
          assert all(d[k] is False for k in ("original_model_executed",
            "sealed_heldouts_opened", "train_authorized",
            "full_72_conformance_pass", "actual_compute_budget_qualified"))
          assert d["optimizer_steps"] == 0 and d["all_domain_tests_passed"] is None
          print("COMPOSITE_SOURCE_ONLY_PASS__ALL_SCIENTIFIC_GATES_BLOCKED")
          PY
      - name: Preserve original source-only logs and negative evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001f-current-main-composition-g9-a${{ github.run_attempt }}
          path: runtime/ncr001f-composition/
          retention-days: 30
          if-no-files-found: warn
