name: NCR-001 original void1 postlease Git custody exact-head independent readback

on:
  pull_request:
    branches: [review/ncr001-void-postlease-eos-nca-mlp-20261028]
    paths:
      - ".github/workflows/ncr-001-void-postlease-custody-verify.yml"
      - "scripts/ncr_001_void_postlease_original_audit.py"
      - "experiments/ncr-001/controls-evidence/void-postlease-20261028/**"
      - "docs/NCR_001_VOID_POSTLEASE_ORIGINAL_CUSTODY.md"
      - "RAG.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verified-original-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE_DIR: experiments/ncr-001/controls-evidence/void-postlease-20261028
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fail closed on source, frozen protocol, original files and no training
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = "14ce5fbaa38f8806c8c8738f19c01b91385eebaf"
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = "59fff1aed872b5563aa6898171983973e0cdb02c"
          test "$(sha256sum "$EVIDENCE_DIR/source-original.zip" | cut -d ' ' -f 1)" = "f87e93a4c54a0a6fee7eda9c4d7db42a92006803134c554e69e9301a3e26646e"
          test "$(sha256sum "$EVIDENCE_DIR/qwen-original.zip" | cut -d ' ' -f 1)" = "ca581f11b0f4006170f6565322cff2f7eef72b5e6844e4c0e615961c05773144"
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          p=json.loads(Path("experiments/ncr-001/protocol.json").read_text())
          assert p["train_authorized"] is False
          assert set(p["models"]) == {"smollm2","sprocket_chat","sprocket_instruct","void1"}
          d=Path(os.environ["EVIDENCE_DIR"])
          m=json.loads((d/"manifest.json").read_text())
          assert m["original_run"] == 40747035876
          assert m["original_source_head"] == "9aed5ca0574a6885c5d60c07d16561e0f73d5043"
          assert m["scientific_status"] == "SOURCE_BOUND_FORWARD_ONLY__72_FINAL_BLOCKED"
          assert m["training_authorized"] is False
          assert m["comparative_training_performed"] is False
          assert m["original_artifact_ids"] == {"source":12842890264,"qwen":12840998564}
          assert m["original_job_ids"] == {"source":123023455576,"qwen":123023557881}
          for name,identity in m["files"].items():
              b=(d/name).read_bytes()
              assert hashlib.sha256(b).hexdigest() == identity["sha256"]
              assert len(b) == identity["bytes"]
          assert len(m["files"]) == 5
          PY
      - name: Independently repeat offline original-host receipt audit and eleven negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ncr_001_void_postlease_original_audit.py
          python3 scripts/ncr_001_void_postlease_original_audit.py \
            "$EVIDENCE_DIR/source-original.zip" "$EVIDENCE_DIR/qwen-original.zip"
      - name: Freshly re-download original Actions artifacts and logs, compare bytes to Git archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-void-custody-readback
          auth="Authorization: Bearer $GH_TOKEN"
          accept="Accept: application/vnd.github+json"
          curl -fsSL --retry 3 -H "$auth" -H "$accept" \
            "https://api.github.com/repos/techrote/neurounner/actions/artifacts/12842890264/zip" \
            -o runtime/ncr001-void-custody-readback/source-original.zip
          curl -fsSL --retry 3 -H "$auth" -H "$accept" \
            "https://api.github.com/repos/techrote/neurounner/actions/artifacts/12840998564/zip" \
            -o runtime/ncr001-void-custody-readback/qwen-original.zip
          curl -fsSL --retry 3 -H "$auth" -H "$accept" \
            "https://api.github.com/repos/techrote/neurounner/actions/jobs/123023455576/logs" \
            -o runtime/ncr001-void-custody-readback/source-original-job.log
          curl -fsSL --retry 3 -H "$auth" -H "$accept" \
            "https://api.github.com/repos/techrote/neurounner/actions/jobs/123023557881/logs" \
            -o runtime/ncr001-void-custody-readback/qwen-original-job.log
          for name in source-original.zip qwen-original.zip source-original-job.log qwen-original-job.log; do
            cmp "$EVIDENCE_DIR/$name" "runtime/ncr001-void-custody-readback/$name"
            sha256sum "runtime/ncr001-void-custody-readback/$name"
          done
          python3 scripts/ncr_001_void_postlease_original_audit.py \
            runtime/ncr001-void-custody-readback/source-original.zip \
            runtime/ncr001-void-custody-readback/qwen-original.zip \
            | tee runtime/ncr001-void-custody-readback/readback-result.json
      - name: Preserve success/failure of independent readback
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-void-postlease-git-custody-readback-a${{ github.run_attempt }}
          path: runtime/ncr001-void-custody-readback/readback-result.json
          if-no-files-found: warn
          retention-days: 30
