name: Recover VILLAGE-001D after pair-repair hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/village-001d-recover-after-pair-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: neurounner-village-001d-recovery-operator
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: '40210543979'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify source run has complete reusable feedback custody
        run: |
          count=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[].name | select(startswith("village001d-feedback-"))] | length')
          test "$count" -eq 36
          echo "Source D run has all 36 feedback artifacts."

      - name: Cancel obsolete pre-fix D run
        run: |
          state=$(gh run view "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json status,conclusion \
            --jq '.status + ":" + (.conclusion // "")')
          echo "source state before cancel: $state"
          case "$state" in
            completed:*)
              ;;
            *)
              gh run cancel "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY"
              ;;
          esac

      - name: Wait for source run to stop and preserve artifacts
        run: |
          for attempt in $(seq 1 60); do
            status=$(gh run view "$SOURCE_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --json status \
              --jq '.status')
            echo "source status: $status"
            if [ "$status" = "completed" ]; then
              break
            fi
            sleep 5
          done
          test "$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')" = "completed"

          count=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[].name | select(startswith("village001d-feedback-"))] | length')
          test "$count" -eq 36

      - name: Verify patched pair compiler is on main
        run: |
          grep -q 'compiler_targeted_repair_prompt' scripts/village_001d_compile_pairs.py
          grep -q 'max_targeted_rounds = 3' scripts/village_001d_compile_pairs.py
          echo "targeted preference-pair repair hardening present."

      - name: Dispatch recovered D campaign
        run: |
          gh workflow run village-001d-preference.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f resume_run_id="$SOURCE_RUN_ID"
          echo "Dispatched VILLAGE-001D using preserved artifacts from run $SOURCE_RUN_ID."
