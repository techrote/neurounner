name: VILLAGE-001E isolated resumable final qualification

on:
  push:
    branches: [work/village-001e-qualification-20261119]
    paths: ['experiments/village-001/qualification-20261119/request.json']
  pull_request:
    paths:
      - '.github/workflows/village-001e-isolated.yml'
      - 'scripts/village_001e_*.py'
      - 'tests/test_village_001e_*.py'
      - 'experiments/village-001/qualification-20261119/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: village-001e-isolated-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  QUAL_ROOT: experiments/village-001/qualification-20261119
  QUAL_CONFIG: experiments/village-001/qualification-20261119/config.json
  PYTHONUNBUFFERED: '1'

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test source-bound replay, fixed gates and frozen suite
        run: |
          python3 -m unittest discover -s tests -p 'test_village_001e_*.py' -v
          python3 -O -m unittest discover -s tests -p 'test_village_001e_*.py'
          python3 scripts/village_001_gate.py
          python3 scripts/village_001e_build_final_suite.py --out "$QUAL_ROOT/final-eval.json" --verify-only
          python3 -m py_compile scripts/village_001e_*.py

  plan:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/work/village-001e-qualification-20261119' }}
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      phase: ${{ steps.verify.outputs.phase }}
      members: ${{ steps.verify.outputs.members }}
      ecology: ${{ steps.verify.outputs.ecology }}
      providers: ${{ steps.verify.outputs.providers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check owned branch lease, immutable D and final-suite bytes
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/village_001e_isolated.py verify

  responses:
    if: ${{ needs.plan.outputs.phase == 'generate' }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        member: ${{ fromJSON(needs.plan.outputs.members) }}
    env:
      MEMBER: ${{ matrix.member }}
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/huggingface/hub
          key: smollm2-135m-12fd25f7-cpu-v1
      - name: Install frozen CPU inference runtime
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.1+cpu'
          python3 -m pip install --disable-pip-version-check 'transformers==4.57.6' 'peft==0.21.2'
      - name: Recover source-bound prior generation if requested
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/village_001e_isolated.py recover-lane --kind responses --id "$MEMBER" --out resume/lane
      - name: Retrieve exact recovered Stage D adapter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads adapters
          python3 scripts/village_001e_isolated.py asset-list --kind responses --id "$MEMBER" > assets.tsv
          while IFS=$'\t' read -r member tag file sha; do
            for attempt in 1 2 3 4; do
              if gh release download "$tag" --pattern "$file" --dir downloads; then break; fi
              test "$attempt" -lt 4 || exit 1
              sleep "$((2 ** attempt))"
            done
            echo "$sha  downloads/$file" | sha256sum -c -
            mkdir -p "adapters/$member"
            tar -xzf "downloads/$file" -C "adapters/$member"
          done < assets.tsv
      - name: Generate only missing fresh final responses
        run: |
          args=(--config "$QUAL_CONFIG" --out "out/$MEMBER")
          if [ "$MEMBER" = BASE ]; then args+=(--base-only); else args+=(--member "$MEMBER" --adapter "adapters/$MEMBER"); fi
          if [ -d resume/lane ]; then args+=(--resume resume/lane); fi
          python3 scripts/village_001e_generate_final_responses.py "${args[@]}"
          replay=(--config "$QUAL_CONFIG" --resume "out/$MEMBER" --out replay --offline)
          if [ "$MEMBER" = BASE ]; then replay+=(--base-only); else replay+=(--member "$MEMBER"); fi
          python3 scripts/village_001e_generate_final_responses.py "${replay[@]}"
      - name: Attach prior artifact provenance
        if: always()
        run: |
          python3 scripts/village_001e_isolated.py attach-custody --receipt resume/lane-custody.json --out "out/$MEMBER"
      - name: Preserve original recovery ZIP on any failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: village001e-resume-custody-responses-${{ matrix.member }}
          path: |
            resume/lane.zip
            resume/lane-custody.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve complete response checkpoints
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: village001e-responses-${{ matrix.member }}
          path: out/${{ matrix.member }}
          if-no-files-found: warn
          retention-days: 30

  ecology:
    if: ${{ needs.plan.outputs.phase == 'generate' }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        session: ${{ fromJSON(needs.plan.outputs.ecology) }}
    env:
      SESSION: ${{ matrix.session }}
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/huggingface/hub
          key: smollm2-135m-12fd25f7-cpu-v1
      - name: Install frozen CPU ecology runtime
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.1+cpu'
          python3 -m pip install --disable-pip-version-check 'transformers==4.57.6' 'peft==0.21.2'
      - name: Recover source-bound prior session if requested
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/village_001e_isolated.py recover-lane --kind ecology --id "$SESSION" --out resume/lane
      - name: Retrieve exact recovered Stage D participants
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads adapters
          python3 scripts/village_001e_isolated.py asset-list --kind ecology --id "$SESSION" > assets.tsv
          while IFS=$'\t' read -r member tag file sha; do
            for attempt in 1 2 3 4; do
              if gh release download "$tag" --pattern "$file" --dir downloads; then break; fi
              test "$attempt" -lt 4 || exit 1
              sleep "$((2 ** attempt))"
            done
            echo "$sha  downloads/$file" | sha256sum -c -
            mkdir -p "adapters/$member"
            tar -xzf "downloads/$file" -C "adapters/$member"
          done < assets.tsv
      - name: Generate only missing prompt-neutral ecology turns
        run: |
          args=(--config "$QUAL_CONFIG" --session "$SESSION" --adapter-root adapters --out "out/$SESSION")
          if [ -d resume/lane ]; then args+=(--resume resume/lane); fi
          python3 scripts/village_001e_ecology_run.py "${args[@]}"
          python3 scripts/village_001e_ecology_run.py --config "$QUAL_CONFIG" --session "$SESSION" --resume "out/$SESSION" --out replay --offline
      - name: Attach prior artifact provenance
        if: always()
        run: |
          python3 scripts/village_001e_isolated.py attach-custody --receipt resume/lane-custody.json --out "out/$SESSION"
      - name: Preserve original recovery ZIP on any failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: village001e-resume-custody-ecology-${{ matrix.session }}
          path: |
            resume/lane.zip
            resume/lane-custody.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve complete ecology checkpoints
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: village001e-ecology-${{ matrix.session }}
          path: out/${{ matrix.session }}
          if-no-files-found: warn
          retention-days: 30

  archive_generation:
    if: ${{ needs.plan.outputs.phase == 'generate' }}
    needs: [plan, responses, ecology]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
      - name: Freeze complete generation before provider work
        run: |
          python3 scripts/village_001e_isolated.py archive-generation --artifacts artifacts
          remote_head=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'neurounner experiment bot'
          git config user.email '261801702+techrote@users.noreply.github.com'
          git add "$QUAL_ROOT/generation" "$QUAL_ROOT/generation-custody.json"
          git diff --cached --check
          git commit -m 'Freeze all 1,068 Stage E generations before blind judging'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Preserve generation archive on publication failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: village001e-generation-custody-${{ github.run_id }}
          path: |
            experiments/village-001/qualification-20261119/generation
            experiments/village-001/qualification-20261119/generation-custody.json
          if-no-files-found: warn
          retention-days: 30

  provider:
    if: ${{ needs.plan.outputs.phase == 'judge' }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.providers) }}
    env:
      KIND: ${{ matrix.kind }}
      LANE: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen source archive and recover prior judgments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/village_001e_isolated.py verify-generation
          python3 scripts/village_001e_isolated.py recover-lane --kind "judge-$KIND" --id "$LANE" --out resume/lane
      - name: Complete missing blind judgments within the fixed call budget
        env:
          NVIDIA_API_KEY: ${{ secrets.NVKEY }}
        run: |
          python3 scripts/village_001_gate.py
          if [ "$KIND" = tournament ]; then
            driver=scripts/village_001e_tournament_scenario.py
            args=(--config "$QUAL_CONFIG" --scenario "$LANE" --responses-root "$QUAL_ROOT/generation/responses")
          else
            driver=scripts/village_001e_ecology_judge.py
            args=(--config "$QUAL_CONFIG" --session "$QUAL_ROOT/generation/ecology/$LANE")
          fi
          resume=()
          if [ -d resume/lane ]; then resume=(--resume resume/lane); fi
          python3 "$driver" "${args[@]}" "${resume[@]}" --out "out/$LANE"
          env -u NVIDIA_API_KEY python3 "$driver" "${args[@]}" --resume "out/$LANE" --out replay --offline
      - name: Attach prior artifact provenance
        if: always()
        run: |
          python3 scripts/village_001e_isolated.py attach-custody --receipt resume/lane-custody.json --out "out/$LANE"
      - name: Preserve original recovery ZIP on any failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: village001e-resume-custody-judge-${{ matrix.kind }}-${{ matrix.id }}
          path: |
            resume/lane.zip
            resume/lane-custody.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve all successful and failed raw provider evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: village001e-judge-${{ matrix.kind }}-${{ matrix.id }}
          path: out/${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 30

  assemble:
    if: ${{ needs.plan.outputs.phase == 'judge' }}
    needs: [plan, provider]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: village001e-judge-tournament-*
          path: artifacts/tournament
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: village001e-judge-ecology-*
          path: artifacts/ecology-judgments
      - name: Independently assemble all successes and failures under frozen gates
        run: |
          python3 scripts/village_001e_isolated.py verify-generation
          python3 scripts/village_001e_assemble.py \
            --response-artifacts "$QUAL_ROOT/generation/responses" \
            --tournament-artifacts artifacts/tournament \
            --ecology-artifacts "$QUAL_ROOT/generation/ecology" \
            --ecology-judgment-artifacts artifacts/ecology-judgments \
            --config "$QUAL_CONFIG" --out experiments/village-001/final-evidence \
            --release-tag village-001e-final-20261119
      - name: Build complete immutable qualification release
        run: |
          mkdir release-assets
          for name in summary confusion-matrices ecology-summary model-registry dataset-provenance per-member-verdicts final-eval; do
            cp "experiments/village-001/final-evidence/$name.json" release-assets/
          done
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf release-assets/village-001e-complete-evidence.tar \
            experiments/village-001/final-evidence "$QUAL_ROOT" \
            datasets/village-001/evaluation datasets/village-001/final-manifest.json \
            datasets/village-001/final-hashes.sha256 datasets/village-001/README.md
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          rows=[]
          for p in sorted(Path('release-assets').iterdir()):
              rows.append({'file':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          receipt={'schema':'village-001e-isolated-release-v1','run_id':int(os.environ['GITHUB_RUN_ID']),'source_head':os.environ['GITHUB_SHA'],'release_tag':'village-001e-final-20261119','assets':rows,'new_optimizer_steps':0}
          Path(os.environ['QUAL_ROOT'],'release-assets.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit complete qualification only to the owned branch
        run: |
          remote_head=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'neurounner experiment bot'
          git config user.email '261801702+techrote@users.noreply.github.com'
          git add experiments/village-001/final-evidence "$QUAL_ROOT/release-assets.json" \
            datasets/village-001/evaluation datasets/village-001/final-manifest.json \
            datasets/village-001/final-hashes.sha256 datasets/village-001/README.md
          git commit -m 'Archive complete Stage E tournament, BASE comparison and ecology evidence'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Publish isolated qualification prerelease and verify every asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create village-001e-final-20261119 --target "$(git rev-parse HEAD)" --prerelease \
            --title 'VILLAGE-001E complete final qualification evidence' \
            --notes-file experiments/village-001/final-evidence/REPORT.md release-assets/*
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/village-001e-final-20261119" > published-release.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          expected=json.loads(Path(os.environ['QUAL_ROOT'],'release-assets.json').read_text())
          published=json.loads(Path('published-release.json').read_text())
          by_name={x['name']:x for x in published['assets']}
          if set(by_name)!={x['file'] for x in expected['assets']} or not published['prerelease']:
              raise SystemExit('release asset set or prerelease flag mismatch')
          for row in expected['assets']:
              actual=by_name[row['file']]
              if actual['state']!='uploaded' or actual['size']!=row['bytes'] or actual['digest']!='sha256:'+row['sha256']:
                  raise SystemExit('release asset mismatch: '+row['file'])
          print('Verified all',len(by_name),'immutable final release assets')
          PY
      - name: Preserve final evidence and release files on any publication failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: village001e-final-${{ github.run_id }}
          path: |
            experiments/village-001/final-evidence
            datasets/village-001/evaluation
            datasets/village-001/final-manifest.json
            datasets/village-001/final-hashes.sha256
            release-assets
            published-release.json
          if-no-files-found: warn
          retention-days: 30
