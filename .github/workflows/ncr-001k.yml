name: NCR-001K frozen void.1 Qwen3 hook qualification

on:
  pull_request:
    branches: [main, research/ncr-001b-pure-torch-core]
    paths:
      - ".github/workflows/ncr-001k.yml"
      - "scripts/ncr_001_void1.py"
      - "scripts/ncr_001k_void1_preflight.py"
      - "tests/test_ncr_001_void1.py"
      - "scripts/ncr_001_core.py"
      - "experiments/ncr-001/protocol.json"
      - "experiments/ncr-001/source-pins.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neurounner-ncr-001k-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: /tmp/ncr-001k-hf
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  frozen-hook-toy:
    name: Local hook lifecycle + frozen toy gradients
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned CPU torch
        run: |
          python3 -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
      - name: Compile and test hook lifecycle without external model
        run: |
          python3 -m py_compile scripts/ncr_001_core.py \
            scripts/ncr_001_void1.py scripts/ncr_001k_void1_preflight.py \
            tests/test_ncr_001_void1.py
          python3 -m unittest discover -s tests -p "test_ncr_001_void1.py" -v

  pinned-real-model:
    name: Pinned frozen 92M checkpoint + KV-cache prepass
    needs: frozen-hook-toy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact training-precedent CPU model stack
        run: |
          python3 -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
          python3 -m pip install --disable-pip-version-check \
            "transformers==4.57.6" "huggingface_hub==0.36.2" \
            "safetensors==0.8.0" "sentencepiece>=0.2,<1"
      - name: Pin files, prove zero-init parity and run no-train decoder conformance
        run: |
          python3 scripts/ncr_001k_void1_preflight.py
      - name: Preserve partial or successful independent source receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr-001k-void1-source-conformance-a${{ github.run_attempt }}
          path: runtime/ncr-001/void1-preflight.json
          if-no-files-found: warn
          retention-days: 30
