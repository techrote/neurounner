name: NCR-001 original fullmask Actions and logs independent Git custody (NO TRAIN)
# Main-base integration: custody/audit semantics below are unchanged from reviewed #182.
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ncr-001-sprocket-wire-fullmask-custody.yml"
      - "scripts/ncr_001_sprocket_wire_fullmask_custody.py"
      - "tests/test_ncr_001_sprocket_wire_fullmask_custody.py"
      - "experiments/ncr-001/controls-evidence/sprocket-wire-fullmask-20261028/**"
      - "docs/NCR_001_SPROCKET_WIRE_FULLMASK_CUSTODY.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ncr001-fullmask-original-custody-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NCR_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  GH_TOKEN: ${{ github.token }}

jobs:
  original-actions-git-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact head, preregistration SHA, four separate frozen models and no training
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NCR_EXPECTED_HEAD"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = "14ce5fbaa38f8806c8c8738f19c01b91385eebaf"
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = "59fff1aed872b5563aa6898171983973e0cdb02c"
          python3 - <<'PY'
          import json
          p=json.load(open("experiments/ncr-001/protocol.json"))
          q=json.load(open("experiments/ncr-001/source-pins.json"))
          assert p["train_authorized"] is False
          assert set(p["models"]) == set(q["models"]) == {"smollm2","sprocket_chat","sprocket_instruct","void1"}
          assert q["models"]["sprocket_chat"]["hf_weight_file"] == "chat/model.safetensors"
          assert q["models"]["sprocket_instruct"]["hf_weight_file"] == "model.safetensors"
          PY
      - name: Independently verify byte-exact original Git container/member/log custody
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-sprocket-fullmask-custody
          python3 -m py_compile scripts/ncr_001_sprocket_wire_fullmask_custody.py tests/test_ncr_001_sprocket_wire_fullmask_custody.py
          python3 scripts/ncr_001_sprocket_wire_fullmask_custody.py \
            2>&1 | tee runtime/ncr001-sprocket-fullmask-custody/git-audit.json
          python3 -m unittest discover -s tests -p 'test_ncr_001_sprocket_wire_fullmask_custody.py' -v \
            2>&1 | tee runtime/ncr001-sprocket-fullmask-custody/negative-tests.log
      - name: Fetch exact original read-only GitHub Actions ZIPs for fresh comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-sprocket-fullmask-custody/original
          for id in 12857787221 12856874121; do
            curl --fail --silent --show-error --location --retry 2 --connect-timeout 20 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              --output "runtime/ncr001-sprocket-fullmask-custody/original/artifact-${id}.zip"
            test -s "runtime/ncr001-sprocket-fullmask-custody/original/artifact-${id}.zip"
          done
      - name: Require fresh GitHub original ZIP container bytes exactly match immutable Git custody
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee runtime/ncr001-sprocket-fullmask-custody/github-vs-git-readback.json
          from pathlib import Path
          import sys,json
          sys.path.insert(0,"scripts")
          import ncr_001_sprocket_wire_fullmask_custody as check
          folder=Path("runtime/ncr001-sprocket-fullmask-custody/original")
          src={f"artifact-{i}.zip":(folder/f"artifact-{i}.zip").read_bytes()
               for i in (12857787221,12856874121)}
          result=check.audit(original_zip_files=src)
          print(json.dumps(result,sort_keys=True))
          PY
      - name: Retain original/failed/successful auditor and Actions-readback logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-fullmask-original-custody-a${{ github.run_attempt }}
          path: runtime/ncr001-sprocket-fullmask-custody/
          if-no-files-found: warn
          retention-days: 30
