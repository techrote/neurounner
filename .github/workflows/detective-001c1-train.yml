name: DETECTIVE-001C1 two-character witness continuation

on:
  pull_request:
    paths:
      - "experiments/detective-001/training-c1.json"
      - "scripts/detective_001c1_*.py"
      - "tests/test_detective_001c1_*.py"
      - ".github/workflows/detective-001c1-train.yml"
      - "datasets/village-001/member-corpora/V-G02-A.jsonl"
      - "datasets/village-001/member-corpora/V-G09-C.jsonl"
      - "experiments/village-001/sft-evidence/adapter-release.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detective-001c1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      evidence_ready: ${{ steps.evidence.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile and run all detective contracts
        run: |
          python3 -m py_compile \
            scripts/detective_001c1_dataset.py \
            scripts/detective_001c1_final.py \
            scripts/detective_001c1_train.py \
            scripts/detective_001c1_evaluate.py \
            scripts/detective_001c1_assemble.py \
            scripts/detective_001c1_verify.py
          python3 -m unittest discover -s tests -p 'test_detective_001*.py' -v
      - name: Build deterministic training corpus and prove learner-final absent
        run: |
          rm -rf runtime/detective-001c
          python3 scripts/detective_001c1_dataset.py \
            --out runtime/detective-001c
          python3 scripts/detective_001c1_dataset.py \
            --out runtime/detective-001c --check
          test ! -e runtime/detective-001c/final-suite.json
          test ! -e runtime/detective-001c/final
          if [ -e datasets/detective-001c/manifest.json ]; then
            diff -ru datasets/detective-001c runtime/detective-001c
          fi
      - name: Revalidate existing final evidence if present
        id: evidence
        run: |
          if [ -e experiments/detective-001/training-c1-evidence/campaign-summary.json ]; then
            test -e datasets/detective-001c/manifest.json
            python3 scripts/detective_001c1_verify.py \
              --dataset-root datasets/detective-001c \
              --evidence experiments/detective-001/training-c1-evidence
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: detective001c1-corpus
          path: runtime/detective-001c
          if-no-files-found: error
          retention-days: 30

  release-custody-repair:
    needs: offline-contract
    if: >-
      needs.offline-contract.outputs.evidence_ready == 'true' &&
      ${{ github.event_name }} == 'pull_request' &&
      ${{ github.head_ref }} == 'research/detective-001c1-witness-policy-20261027' &&
      ${{ github.event.pull_request.head.repo.full_name }} == 'techrote/neurounner' &&
      ${{ github.event.pull_request.user.login }} == 'techrote'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify published adapter bytes against authoritative committed evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='detective-001c1-v1'
          rm -rf release-readback
          mkdir release-readback
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"             --pattern 'detective-001c1-*.tar.gz' --dir release-readback
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          manifest=json.loads(Path("experiments/detective-001/training-c1-evidence/adapter-release.json").read_text())
          files={p.name:p for p in Path("release-readback").glob("*.tar.gz")}
          assert set(files)=={x["file"] for x in manifest["assets"]}
          for asset in manifest["assets"]:
              p=files[asset["file"]]
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
              assert h.hexdigest()==asset["sha256"], (p,h.hexdigest(),asset["sha256"])
              assert p.stat().st_size==asset["bytes"]
          print("release assets: byte/hash PASS")
          PY
      - name: Rebind stale release tag/notes to the authoritative evidence source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='detective-001c1-v1'
          source_head=$(python3 - <<'PY'
          import json
          print(json.load(open("experiments/detective-001/training-c1-evidence/provenance.json"))["source_head"])
          PY
          )
          test -n "$source_head"
          git cat-file -e "$source_head^{commit}"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          before=$(git rev-parse "$TAG^{commit}")
          echo "release tag before=$before authoritative_source=$source_head"
          if [ "$before" != "$source_head" ]; then
            git tag -f "$TAG" "$source_head"
            git push --force origin "refs/tags/$TAG"
          fi
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
          SOURCE_HEAD="$source_head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          body=Path("experiments/detective-001/training-c1-evidence/REPORT.md").read_text()
          Path("/tmp/release-patch.json").write_text(json.dumps({
              "target_commitish":os.environ["SOURCE_HEAD"],
              "body":body,
          }))
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id"             --input /tmp/release-patch.json >/tmp/release-response.json
          test "$(git ls-remote origin "refs/tags/$TAG" | cut -f1)" = "$source_head"
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          release=json.loads(Path("/tmp/release-response.json").read_text())
          provenance=json.loads(Path("experiments/detective-001/training-c1-evidence/provenance.json").read_text())
          expected_body=Path("experiments/detective-001/training-c1-evidence/REPORT.md").read_text()
          assert release["tag_name"]=="detective-001c1-v1"
          assert release["target_commitish"]==provenance["source_head"]
          assert release["body"]==expected_body
          print("release tag/metadata custody: PASS",provenance["source_head"])
          PY

  train:
    needs: offline-contract
    if: >-
      needs.offline-contract.outputs.evidence_ready != 'true' &&
      ${{ github.event_name }} == 'pull_request' &&
      ${{ github.head_ref }} == 'research/detective-001c1-witness-policy-20261027' &&
      ${{ github.event.pull_request.head.repo.full_name }} == 'techrote/neurounner' &&
      ${{ github.event.pull_request.user.login }} == 'techrote'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        member: [V-G02-A, V-G09-C]
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: detective001c1-corpus
          path: datasets/detective-001c
      - name: Verify deterministic corpus before model download
        run: python3 scripts/detective_001c1_dataset.py --out datasets/detective-001c --check
      - name: Install pinned CPU fine-tuning stack
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
          python3 -m pip install --disable-pip-version-check \
            "transformers==4.57.6" "peft==0.21.2" \
            "huggingface_hub==0.36.2" "safetensors==0.8.0"
      - name: Retrieve exact immutable Village parent adapter
        env:
          GH_TOKEN: ${{ github.token }}
          MEMBER: ${{ matrix.member }}
        run: |
          mkdir -p downloads parents
          gh release download village-001-sft-v1 \
            --repo techrote/neurounner \
            --pattern "village-001-sft-$MEMBER-smollm2-135m-lora.tar.gz" \
            --dir downloads
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.detective_001b_pilot import unpack_adapter
          member=os.environ["MEMBER"]
          release=json.loads(Path("experiments/village-001/sft-evidence/adapter-release.json").read_text())
          asset=next(x for x in release["assets"] if x["member_id"]==member)
          unpack_adapter(Path("downloads")/asset["file"],Path("parents")/member,asset)
          print(member,asset["adapter_directory_sha256"])
          PY
      - name: Continue exact parent LoRA for 64 bounded detective steps
        env:
          MEMBER: ${{ matrix.member }}
        run: |
          python3 scripts/detective_001c1_train.py \
            --member "$MEMBER" \
            --dataset-root datasets/detective-001c \
            --parent-adapter "parents/$MEMBER" \
            --out "out/$MEMBER"
      - name: Verify terminal training evidence
        env:
          MEMBER: ${{ matrix.member }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          member=os.environ["MEMBER"]
          r=json.loads((Path("out")/member/"result.json").read_text())
          assert r["experiment"]=="DETECTIVE-001C1"
          assert r["member_id"]==member
          assert r["training"]["optimizer_steps"]==64
          assert len(r["training"]["losses"])==64
          assert r["model"]["only_lora_parameters_trainable"] is True
          assert re.fullmatch(r"[0-9a-f]{64}",r["adapter"]["directory_sha256"])
          assert (Path("out")/member/"adapter"/"adapter_model.safetensors").is_file()
          print(member,r["training"]["first_loss"],"->",r["training"]["last_loss"],
                r["adapter"]["directory_sha256"])
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: detective001c1-trained-${{ matrix.member }}
          path: out/${{ matrix.member }}
          if-no-files-found: warn
          retention-days: 30

  evaluate-and-publish:
    needs: [offline-contract, train]
    if: >-
      needs.offline-contract.outputs.evidence_ready != 'true' &&
      ${{ github.event_name }} == 'pull_request' &&
      ${{ github.head_ref }} == 'research/detective-001c1-witness-policy-20261027' &&
      ${{ github.event.pull_request.head.repo.full_name }} == 'techrote/neurounner' &&
      ${{ github.event.pull_request.user.login }} == 'techrote'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
      DETECTIVE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: detective001c1-corpus
          path: datasets/detective-001c
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: detective001c1-trained-V-G02-A
          path: artifacts/V-G02-A
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: detective001c1-trained-V-G09-C
          path: artifacts/V-G09-C
      - name: Install pinned CPU inference stack
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
          python3 -m pip install --disable-pip-version-check \
            "transformers==4.57.6" "peft==0.21.2" \
            "huggingface_hub==0.36.2" "safetensors==0.8.0"
      - name: Retrieve and verify the same immutable SFT parents for comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads parents
          for member in V-G02-A V-G09-C; do
            gh release download village-001-sft-v1 \
              --repo techrote/neurounner \
              --pattern "village-001-sft-$member-smollm2-135m-lora.tar.gz" \
              --dir downloads
            MEMBER="$member" python3 - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.detective_001b_pilot import unpack_adapter
          member=os.environ["MEMBER"]
          release=json.loads(Path("experiments/village-001/sft-evidence/adapter-release.json").read_text())
          asset=next(x for x in release["assets"] if x["member_id"]==member)
          unpack_adapter(Path("downloads")/asset["file"],Path("parents")/member,asset)
          PY
          done
      - name: Materialize post-training learner-final and compare parents to continuations
        run: |
          rm -rf evaluation
          python3 scripts/detective_001c1_evaluate.py \
            --dataset-root datasets/detective-001c \
            --g02-parent parents/V-G02-A \
            --g09-parent parents/V-G09-C \
            --g02-trained artifacts/V-G02-A/adapter \
            --g09-trained artifacts/V-G09-C/adapter \
            --g02-trained-result artifacts/V-G02-A/result.json \
            --g09-trained-result artifacts/V-G09-C/result.json \
            --out evaluation
          test -s evaluation/final-suite.json
          test -s evaluation/raw-results.json
          test -s evaluation/summary.json
      - name: Assemble neutral release cartridges and durable campaign evidence
        run: |
          rm -rf release-assets experiments/detective-001/training-c1-evidence
          python3 scripts/detective_001c1_assemble.py \
            --dataset-root datasets/detective-001c \
            --artifacts artifacts \
            --evaluation evaluation \
            --evidence-out experiments/detective-001/training-c1-evidence \
            --release-out release-assets \
            --source-head "$DETECTIVE_HEAD_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 scripts/detective_001c1_verify.py \
            --dataset-root datasets/detective-001c \
            --evidence experiments/detective-001/training-c1-evidence
          test "$(find release-assets -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: detective001c1-complete-${{ github.run_id }}
          path: |
            datasets/detective-001c
            experiments/detective-001/training-c1-evidence
            release-assets
          if-no-files-found: error
          retention-days: 30
      - name: Refuse stale source before persistent publication
        run: |
          branch='research/detective-001c1-witness-policy-20261027'
          remote_sha=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f 1)
          test "$remote_sha" = "$DETECTIVE_HEAD_SHA"
      - name: Publish neutral two-character continuation assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="detective-001c1-v1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/*.tar.gz \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$DETECTIVE_HEAD_SHA" \
              --title "DETECTIVE-001C1 two-character witness-policy continuations" \
              --notes-file experiments/detective-001/training-c1-evidence/REPORT.md \
              release-assets/*.tar.gz
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets | length' | grep -x '2'
      - name: Commit durable dataset and evidence to the exact PR branch
        run: |
          git config user.name "neurounner experiment bot"
          git config user.email "261801702+techrote@users.noreply.github.com"
          git add datasets/detective-001c experiments/detective-001/training-c1-evidence
          git diff --cached --quiet && { echo "expected new C1 evidence"; exit 1; }
          git commit -m "DETECTIVE-001C1: record two-character continuation and sealed-final evidence"
          git push origin HEAD:research/detective-001c1-witness-policy-20261027
