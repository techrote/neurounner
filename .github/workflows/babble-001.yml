name: BABBLE-001 local swarm to NVIDIA compiler

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/babble-001.yml'
      - 'scripts/babble_guides.py'
      - 'scripts/babble_worker.py'
      - 'scripts/nvidia_babble_compile.py'
      - 'experiments/babble-001/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: neurounner-babble-001
  cancel-in-progress: false

jobs:
  guides:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-babble001]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch pinned llama.cpp runtime
        run: bash scripts/bootstrap.sh runtime
      - name: Resolve Qwen3.5-4B guide model
        id: model
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          s=json.load(open("config/candidates.json"))["qwen35-4b"]
          print("url="+s["url"]); print("file="+s["file"]); print("sha256="+s["sha256"])
          PY
      - name: Download and verify guide model
        env:
          URL: ${{ steps.model.outputs.url }}
          FILE: ${{ steps.model.outputs.file }}
          SHA: ${{ steps.model.outputs.sha256 }}
        run: |
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 -o "$RUNNER_TEMP/$FILE" "$URL"
          echo "$SHA  $RUNNER_TEMP/$FILE" | sha256sum -c -
      - name: Generate thematic prompt guides
        env:
          FILE: ${{ steps.model.outputs.file }}
        run: python3 scripts/babble_guides.py "$RUNNER_TEMP/$FILE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: babble001-guides
          path: results/babble001/guides.json
          if-no-files-found: error
          retention-days: 7

  babble:
    needs: guides
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        worker: [0,1,2,3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/neurounner
          key: ubuntu-neurounner-v1-b11852-edc2ac32-bb741ebb
      - name: Ensure runtime and Sprocket
        run: |
          bash scripts/bootstrap.sh runtime
          bash scripts/bootstrap.sh sprocket
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: babble001-guides
          path: guide-artifact
      - name: Run Sprocket babble worker
        run: |
          python3 scripts/babble_worker.py             --worker ${{ matrix.worker }}             --guides guide-artifact/guides.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: babble001-worker-${{ matrix.worker }}
          path: |
            results/babble001/worker-${{ matrix.worker }}.json
            results/babble001/worker-${{ matrix.worker }}-server.log
          if-no-files-found: error
          retention-days: 7

  compile:
    needs: [guides,babble]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: babble001-guides
          path: guide-artifact
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: babble001-worker-*
          path: babble-artifacts
          merge-multiple: true
      - name: Compile personality packets with NVIDIA
        env:
          NVIDIA_API_KEY: ${{ secrets.NVKEY }}
        run: |
          test -n "$NVIDIA_API_KEY" || { echo "NVKEY repository secret is not configured"; exit 1; }
          python3 scripts/nvidia_babble_compile.py             --guides guide-artifact/guides.json             --babbles babble-artifacts             --out results/babble001/compiled
      - name: Summarize without exposing source text
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("results/babble001/compiled/manifest.json"))
          print("compiler:",m["compiler_model"])
          print("guides:",m["guide_count"])
          print("raw babbles:",m["babble_count"])
          print("compiled packets:",m["packet_count"])
          for b in m["batches"]:
              print("batch",b["batch"],"attempts",len(b["attempts"]),"usage",b.get("usage"))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: babble001-compiled-dataset
          path: results/babble001/compiled
          if-no-files-found: error
          retention-days: 14
