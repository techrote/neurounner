name: DREAMGRAFT DG016 topology and timed closure
on:
  pull_request:
    branches: [research/memplant-dg015-material-recovery-20261116]
    paths:
      - '.github/workflows/memplant-topology-transfer-016.yml'
      - 'experiments/memplant/trajectory_transfer_016/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trained-trajectory-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [26011628, 26011629]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned CPU numerical tools
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python3 -m pip install --disable-pip-version-check 'numpy==1.26.4'
      - name: Selftests — random mazes and legal actions
        run: |
          python3 -m py_compile experiments/memplant/trajectory_transfer_016/experiment.py
          python3 -m experiments.memplant.trajectory_transfer_016.experiment --selftest
      - name: Train neural donors and receiving policies; sealed trajectories
        run: |
          OUT=runtime/memplant/dg016/${{ matrix.seed }}
          mkdir -p "$OUT"
          sha256sum experiments/memplant/trajectory_transfer_016/experiment.py > "$OUT/source.sha256"
          timeout --signal=INT --kill-after=15s 26m python3 -m experiments.memplant.trajectory_transfer_016.experiment \
            --seed ${{ matrix.seed }} --train-worlds 300 --updates 800 --sealed 100 \
            --horizon 96 --donor-steps 140 --out "$OUT"
      - name: Verify source, files, negative controls and bounds
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('runtime/memplant/dg016/${{ matrix.seed }}')
          hashes=json.loads((p/'sha256.json').read_text())
          assert len(hashes)>=18
          for name,digest in hashes.items():
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==digest,name
          report=json.loads((p/'report.json').read_text())
          assert report['source_sha256']==hashlib.sha256(pathlib.Path('experiments/memplant/trajectory_transfer_016/experiment.py').read_bytes()).hexdigest()
          assert report['train_test_seed_overlap']==0
          for split in ('iid','ood'):
              r=report['results'][split]
              assert r['trajectories']['oracle']['success']==100
              assert r['withheld_worlds']==50
              assert all(row['illegal']==0 for row in r['trajectories'].values())
              assert r['trajectories']['inherited']['worlds']==100
          print('DG016 verified',report['seed'],len(hashes),'hashes, both sealed splits')
          PY
      - name: Preserve immutable trained checkpoints and negative results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dg016-${{ matrix.seed }}
          path: runtime/memplant/dg016/${{ matrix.seed }}
          if-no-files-found: warn
          retention-days: 30
