name: One-shot DRIV3R research relocation
on:
  push:
    branches:
      - research/driv3r-consolidation-2026-11-16
permissions:
  contents: write
concurrency:
  group: one-shot-driv3r-relocation
  cancel-in-progress: false
jobs:
  relocate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Copy and verify original Git blobs
        run: python3 scripts/migrate_cybersand_driv3r.py
      - name: Python syntax qualification
        run: python3 -m compileall -q experiments/driv3r experiments/agent_painter/worm/surgery
      - name: Commit research only and remove migration workflow
        run: |
          git config user.name 'research-migration[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- experiments/driv3r experiments/agent_painter/worm/surgery docs/driv3r-migration/MANIFEST.json
          git rm -f .github/workflows/driv3r-migration-once.yml
          git commit -m 'research: preserve CyberSand DRIV3R labs in Neurounner'
          git push origin HEAD:refs/heads/research/driv3r-consolidation-2026-11-16
