name: NCR-001 Sprocket original learning-artifact readback (no training)
on:
  pull_request:
    branches:
      - review/ncr001-sprocket-nca-learning-gate-20261028
    paths:
      - ".github/workflows/ncr-001-sprocket-learning-readback.yml"
      - "scripts/ncr_001_sprocket_learning_artifact_readback.py"
      - "docs/NCR_001_SPROCKET_LEARNING_READBACK.md"
      - "RAG.md"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ncr001-sprocket-learning-readback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  independent-source-artifact-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NCR_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_RUN_ID: "40710171622"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source head and four-model protocol is locked
        run: |
          test "$(git rev-parse HEAD)" = "$NCR_EXPECTED_HEAD"
          test "$(git hash-object experiments/ncr-001/protocol.json)" = "14ce5fbaa38f8806c8c8738f19c01b91385eebaf"
          test "$(git hash-object experiments/ncr-001/source-pins.json)" = "59fff1aed872b5563aa6898171983973e0cdb02c"
          python3 -m py_compile scripts/ncr_001_sprocket_learning_artifact_readback.py
          python3 - <<'PY'
          import json
          p = json.load(open('experiments/ncr-001/protocol.json'))
          assert p['train_authorized'] is False
          assert set(p['models']) == {'smollm2', 'sprocket_chat', 'sprocket_instruct', 'void1'}
          PY
      - name: Download byte-exact original read-only Actions artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-learning-readback/original
          for entry in source:12826525345 chat:12826246889 instruct:12825942600; do
            lane="${entry%%:*}"
            id="${entry##*:}"
            curl --fail --silent --show-error --location --retry 2 --connect-timeout 20 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              --output "runtime/ncr001-learning-readback/original/${lane}.zip"
            test -s "runtime/ncr001-learning-readback/original/${lane}.zip"
          done
      - name: Audit original physical receipts, failures, gradients and source identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/ncr001-learning-readback
          python3 scripts/ncr_001_sprocket_learning_artifact_readback.py \
            --source-zip runtime/ncr001-learning-readback/original/source.zip \
            --chat-zip runtime/ncr001-learning-readback/original/chat.zip \
            --instruct-zip runtime/ncr001-learning-readback/original/instruct.zip \
            --output runtime/ncr001-learning-readback/report.json \
            2>&1 | tee runtime/ncr001-learning-readback/readback.log
          python3 - <<'PY'
          import json
          x=json.load(open('runtime/ncr001-learning-readback/report.json'))
          assert x['adversarial_receipt_mutations_rejected']==12
          assert x['archive_promoted_to_git'] is False
          assert x['full_72_conformance_pass'] is False
          assert x['train_authorized'] is False
          PY
      - name: Preserve source audit and original ZIPs including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ncr001-learning-readback-a${{ github.run_attempt }}
          path: runtime/ncr001-learning-readback/
          if-no-files-found: warn
          retention-days: 30
