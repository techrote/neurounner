name: MEMPLANT native KV and Living Memory Garden

on:
  pull_request:
    branches: [main, research/memplant-dg002-two-rule-transplant]
    paths:
      - '.github/workflows/memplant-living-garden.yml'
      - 'experiments/memplant/memorygarden/**'
      - 'tests/test_memplant_garden.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: memplant-living-garden-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_DISABLE_TELEMETRY: '1'
  HF_HUB_DOWNLOAD_TIMEOUT: '120'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'

jobs:
  offline:
    name: Garden deterministic source and simulation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python source syntax and pure-stdlib evaluator tests
        run: |
          python3 -m py_compile experiments/memplant/memorygarden/*.py tests/test_memplant_garden.py
          python3 -m unittest discover -s tests -p test_memplant_garden.py -v

  allele:
    name: Counterfactual Allele on genuine Qwen state (no model training)
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install numerical analysis only
        run: python3 -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
      - name: Retrieve original DG002 real donor state archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memplant-dg002-source-a1
          repository: techrote/neurounner
          run-id: 43736088404
          github-token: ${{ github.token }}
          path: runtime/memplant/garden/source
      - name: Apply train-derived numerical alleles to previously encoded worlds
        run: |
          mkdir -p runtime/memplant/garden/allele
          OPENBLAS_NUM_THREADS=1 python3 -m experiments.memplant.memorygarden.allele \
            --source runtime/memplant/garden/source \
            --out runtime/memplant/garden/allele/report.json
      - name: Preserve full causal edit, reencode and matched controls
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: memplant-allele-source-a${{ github.run_attempt }}
          path: runtime/memplant/garden/allele
          if-no-files-found: warn
          retention-days: 30

  kv_clone:
    name: Real native Qwen KV clone into fresh same-checkpoint model instance
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install frozen real-model PyTorch CPU stack
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python3 -m pip install --disable-pip-version-check \
            'transformers==4.57.6' 'huggingface_hub>=0.36,<1' 'psutil>=7,<8' 'safetensors>=0.6,<1' 'numpy>=1.26,<3'
      - name: Same-checkpoint native K/V transfer with wrong-donor controls
        run: |
          mkdir -p runtime/memplant/garden/native-kv
          timeout --signal=INT --kill-after=15s 14m python3 -m experiments.memplant.memorygarden.kv_clone \
            --out runtime/memplant/garden/native-kv/report.json
      - name: Retain real model cache restoration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: memplant-native-kv-custody-a${{ github.run_attempt }}
          path: runtime/memplant/garden/native-kv
          if-no-files-found: warn
          retention-days: 30

  inventors:
    name: Existing neurounner ${{ matrix.subject }} generative world inventor
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        subject: [sprocket, lfm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install minimal source-state numerics
        run: python3 -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
      - name: Fetch pinned llama.cpp runtime and exactly one GGUF subject
        run: bash scripts/bootstrap.sh ${{ matrix.subject }}
      - name: Recover exact real Qwen donor source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memplant-dg002-source-a1
          repository: techrote/neurounner
          run-id: 43736088404
          github-token: ${{ github.token }}
          path: runtime/memplant/garden/source
      - name: Model inventor trial with real state-derived text postcards and counterfactuals
        run: |
          mkdir -p runtime/memplant/garden/inventors
          timeout --signal=INT --kill-after=15s 16m python3 -m experiments.memplant.memorygarden.subjects \
            --subject ${{ matrix.subject }} --source runtime/memplant/garden/source \
            --max-tokens 170 --out runtime/memplant/garden/inventors/${{ matrix.subject }}.json
      - name: Retain raw generative attempts, grading and negative cases
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: memplant-inventor-${{ matrix.subject }}-a${{ github.run_attempt }}
          path: |
            runtime/memplant/garden/inventors
            logs/memplant-${{ matrix.subject }}/**
          if-no-files-found: warn
          retention-days: 30
